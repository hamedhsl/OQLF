<style>
  :root{
    --ink:#101820;
    --paper:#eef2f0;
    --paper-2:#e2e9e6;
    --line:#c7d2ce;
    --blueprint:#1f3a5f;
    --blueprint-2:#2c5282;
    --flag:#c1443c;
    --amber:#c98a2c;
    --green:#3a7d5c;
    --white:#fbfcfb;
    --mono:'IBM Plex Mono', monospace;
    --fa:'Vazirmatn', sans-serif;
    --fr:'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--fa);
    min-height:100vh;
  }

  /* ---------- header ---------- */
  header{
    position:relative;
    background:var(--blueprint);
    color:var(--white);
    padding:26px 24px 18px;
    border-bottom:5px solid var(--flag);
  }
  header::before{
    content:"";
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size:34px 34px;
    pointer-events:none;
  }
  .eyebrow{
    position:relative;
    font-family:var(--mono);
    letter-spacing:.13em;
    font-size:11px;
    color:#9fd3c7;
    text-transform:uppercase;
    display:flex;align-items:center;gap:9px;
    direction:ltr;justify-content:flex-start;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--flag);}
  h1{
    position:relative;
    margin:8px 0 0;
    font-size:clamp(19px,3vw,27px);
    font-weight:700;
    line-height:1.4;
  }
  .headmeta{
    position:relative;
    display:flex;gap:8px;flex-wrap:wrap;
    margin-top:10px;
  }
  .badge{
    font-family:var(--mono);font-size:10.5px;direction:ltr;
    padding:5px 11px;border:1px solid rgba(255,255,255,.28);
    border-radius:100px;color:#e7eef2;
  }

  /* ---------- part switcher ---------- */
  .part-tabs{
    position:relative;
    display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;
  }
  .part-tab{
    all:unset;cursor:pointer;
    padding:9px 16px;border-radius:9px;
    font-size:12.5px;font-weight:600;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    color:#dce6ea;
    transition:all .15s ease;
  }
  .part-tab:hover{background:rgba(255,255,255,.16);}
  .part-tab.active{background:var(--flag);border-color:var(--flag);color:var(--white);}

  /* ---------- search bar ---------- */
  .searchbar{
    position:sticky; top:0; z-index:30;
    background:var(--white);
    border-bottom:1px solid var(--line);
    padding:12px 16px;
    display:flex; gap:10px; align-items:center;
    box-shadow:0 6px 16px -12px rgba(16,24,32,.3);
  }
  .searchbar svg{width:17px;height:17px;flex:0 0 auto;stroke:#8b969f;fill:none;stroke-width:2;}
  .searchbar input{
    flex:1;border:none;outline:none;background:transparent;
    font-family:var(--fa);font-size:14.5px;color:var(--ink);
  }
  .searchbar input::placeholder{color:#9aa6ad;}
  .searchbar .count{
    font-family:var(--mono);font-size:11px;color:#8b969f;
    direction:ltr;white-space:nowrap;
  }

  /* ---------- layout ---------- */
  .layout{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  nav.chapters{
    flex:0 0 260px;
    position:sticky; top:57px;
    max-height:calc(100vh - 57px);
    overflow-y:auto;
    padding:16px 10px 40px 16px;
    border-inline-start:1px solid var(--line);
  }
  .nav-group-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    color:#8b969f;text-transform:uppercase;
    padding:14px 12px 6px;
  }
  .nav-group-label:first-child{padding-top:2px;}
  .chap-btn{
    all:unset;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
    gap:6px;
    width:100%;
    padding:9px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    color:#3a4650;
    margin-bottom:2px;
    transition:background .15s ease,color .15s ease;
  }
  .chap-btn .num{
    font-family:var(--mono);font-size:10px;color:#9aa6ad;
    flex:0 0 auto;
  }
  .chap-btn:hover{background:var(--paper-2);}
  .chap-btn.active{background:var(--blueprint);color:var(--white);}
  .chap-btn.active .num{color:#9fd3c7;}

  main{flex:1;min-width:0;padding:22px 20px 80px;}

  .chap-header{margin-bottom:16px;}
  .chap-header .fa-title{font-size:19px;font-weight:700;color:var(--ink);}
  .chap-header .fr-title{
    font-family:var(--fr);direction:ltr;text-align:left;
    font-size:12.5px;color:var(--blueprint-2);margin-top:3px;letter-spacing:.02em;
  }

  /* section tabs within a vocab chapter */
  .subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .subtab{
    all:unset;cursor:pointer;
    padding:7px 14px;border-radius:100px;
    font-size:12.5px;font-weight:600;
    background:var(--white);border:1px solid var(--line);color:#5b6670;
  }
  .subtab.active{background:var(--ink);border-color:var(--ink);color:var(--white);}
  .subtab .n{font-family:var(--mono);font-size:10px;opacity:.7;margin-inline-start:4px;}

  /* terms chip cloud */
  .chipwrap{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    all:unset;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    padding:7px 12px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13px;color:var(--blueprint);
    transition:border-color .15s ease, background .15s ease;
  }
  .chip .chip-fr{font-family:var(--fr);direction:ltr;}
  .chip .chip-fa{color:var(--ink);font-weight:500;}
  .chip .chip-sep{color:#c7d2ce;}
  .chip:hover{border-color:var(--blueprint);background:#f4f8f6;}
  .chip svg{width:11px;height:11px;fill:var(--blueprint-2);flex:0 0 auto;}
  .chip.playing{background:var(--flag);border-color:var(--flag);color:var(--white);}
  .chip.playing svg{fill:var(--white);}

  /* verbs table */
  .tablecard{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  thead th{
    background:#fff;border-bottom:2px solid var(--ink);
    padding:11px 8px;font-size:11.5px;font-family:var(--mono);
    letter-spacing:.05em;text-transform:uppercase;color:#5b6670;text-align:right;
  }
  thead th.verb-h{direction:ltr;text-align:center;width:34%;}
  thead th.ex-h{direction:ltr;text-align:left;}
  thead th.audio-h{width:44px;text-align:center;}
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:#f4f8f6;}
  td{padding:13px 14px;vertical-align:top;font-size:14px;}
  .word-fr{direction:ltr;font-family:var(--fr);font-weight:700;font-size:14.5px;color:var(--blueprint);text-align:center;word-break:break-word;}
  .word-fa{color:var(--ink);font-weight:600;font-size:13px;margin-top:3px;text-align:center;word-break:break-word;}
  .def-fr{direction:ltr;text-align:left;font-family:var(--fr);font-size:13px;color:#5b6670;line-height:1.6;margin-bottom:5px;}
  .ex-fr{direction:ltr;text-align:left;font-family:var(--fr);font-size:13.5px;color:#26333d;line-height:1.6;font-style:italic;}
  td.audio-cell{text-align:center;padding:11px 4px;}

  .speak-btn{
    all:unset;cursor:pointer;
    width:32px;height:32px;border-radius:50%;
    background:var(--paper);border:1.5px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
    position:relative;flex:0 0 auto;
  }
  .speak-btn svg{width:13px;height:13px;fill:var(--blueprint);}
  .speak-btn:hover{background:var(--blueprint);border-color:var(--blueprint);transform:translateY(-2px);}
  .speak-btn:hover svg{fill:var(--white);}
  .speak-btn.playing{background:var(--flag);border-color:var(--flag);}
  .speak-btn.playing svg{fill:var(--white);}
  .speak-btn.playing::after{
    content:"";position:absolute;inset:-5px;border-radius:50%;
    border:1.5px solid var(--flag);animation:pulse 1s ease-out infinite;
  }
  @keyframes pulse{0%{transform:scale(.85);opacity:.9;}100%{transform:scale(1.35);opacity:0;}}

  .speak-btn-lg{
    all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:9px;background:var(--blueprint);color:var(--white);
    font-size:12.5px;font-weight:600;position:relative;
  }
  .speak-btn-lg svg{width:13px;height:13px;fill:var(--white);}
  .speak-btn-lg.playing{background:var(--flag);}
  .speak-btn-lg:hover{filter:brightness(1.1);}

  /* expressions list */
  .expr-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .expr-row{background:var(--white);padding:13px 14px;display:flex;align-items:center;gap:12px;}
  .expr-row .txt{flex:1;min-width:0;}
  .expr-fr{direction:ltr;text-align:left;font-family:var(--fr);font-weight:600;font-size:14px;color:var(--blueprint);}
  .expr-ex{direction:ltr;text-align:left;font-family:var(--fr);font-size:12.5px;color:#5b6670;margin-top:3px;line-height:1.5;font-style:italic;}

  .empty-state{text-align:center;padding:40px 20px;color:#8b969f;font-size:13.5px;}

  /* ---------- grammar ---------- */
  .grammar-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .grammar-rule-fr{
    direction:ltr;text-align:left;font-family:var(--fr);font-size:12px;color:#8b969f;
    background:var(--paper);border-radius:6px;padding:8px 10px;margin-bottom:8px;line-height:1.6;
  }
  .grammar-rule-fa{font-size:14.5px;line-height:2;color:var(--ink);}
  .grammar-examples{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .grammar-example{
    display:flex;align-items:center;gap:10px;
    background:var(--paper);border-radius:8px;padding:9px 12px;
  }
  .grammar-example .txt{flex:1;min-width:0;}
  .grammar-example .fr{direction:ltr;text-align:left;font-family:var(--fr);font-size:13.5px;color:var(--blueprint);}
  .grammar-example .fa{font-size:12.5px;color:#5b6670;margin-top:3px;}

  .section-heading{
    font-size:13px;font-weight:700;color:var(--blueprint);margin:20px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .section-heading::before{content:"";width:4px;height:16px;background:var(--flag);border-radius:2px;display:inline-block;}

  .exercise-item{
    background:var(--white);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:8px;
  }
  .exercise-q{direction:ltr;text-align:left;font-family:var(--fr);font-size:13.5px;color:var(--ink);}
  .exercise-toggle{
    all:unset;cursor:pointer;font-size:11.5px;color:var(--blueprint-2);font-weight:600;margin-top:8px;display:inline-block;
  }
  .exercise-answer{
    direction:ltr;text-align:left;font-family:var(--fr);font-size:13px;color:var(--green);
    margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:none;
  }
  .exercise-answer.shown{display:block;}

  /* ---------- info / exam structure ---------- */
  .info-card{
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:12px;
  }
  .info-card .part-title{font-size:14.5px;font-weight:700;color:var(--blueprint);}
  .info-card .part-fr{direction:ltr;text-align:left;font-family:var(--mono);font-size:10.5px;color:#9aa6ad;margin-top:2px;}
  .info-card .part-desc{font-size:13.5px;line-height:2;color:var(--ink);margin-top:8px;}
  .info-card ul{margin:8px 0 0;padding-inline-start:20px;}
  .info-card li{font-size:13px;color:#5b6670;line-height:1.9;}

  /* ---------- phrases (categorized) ---------- */
  .phrase-cat{margin-bottom:20px;}
  .phrase-cat-title{
    font-size:13px;font-weight:700;color:var(--blueprint);margin-bottom:8px;
    display:flex;align-items:center;gap:8px;
  }
  .phrase-cat-title .fr{font-family:var(--fr);direction:ltr;font-weight:500;color:#8b969f;font-size:11px;}

  /* ---------- conjugation ---------- */
  .conj-card{
    background:var(--white);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:8px;
  }
  .conj-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .conj-verb{direction:ltr;font-family:var(--fr);font-weight:700;font-size:15px;color:var(--blueprint);}
  .conj-meaning{font-size:12.5px;color:var(--ink);font-weight:600;}
  .conj-rows{margin-top:8px;display:grid;grid-template-columns:1fr;gap:5px;}
  .conj-row{direction:ltr;text-align:left;font-family:var(--fr);font-size:12px;color:#5b6670;}
  .conj-row b{color:var(--ink);font-family:var(--fa);font-weight:600;margin-inline-end:4px;}

  /* ---------- reading passages ---------- */
  .reading-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .reading-gist{
    background:var(--paper-2);border-radius:10px;padding:12px 14px;
    font-size:13px;color:#3a4650;line-height:1.9;margin-bottom:14px;
  }
  .reading-passage{
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:20px 22px;direction:ltr;text-align:left;font-family:var(--fr);
    font-size:14px;line-height:1.85;color:#26333d;white-space:pre-wrap;
    max-height:70vh;overflow-y:auto;
  }

  /* mobile chapter select */
  .mobile-part-select, .mobile-chap-select{display:none;}

  footer{
    max-width:1180px;margin:20px auto 0;padding:16px 20px;
    color:#7b8791;font-size:11.5px;text-align:center;
    font-family:var(--mono);letter-spacing:.03em;
  }

  @media (max-width:860px){
    nav.chapters{display:none;}
    .mobile-part-select, .mobile-chap-select{display:block;margin:14px 16px 0;}
    .mobile-part-select select, .mobile-chap-select select{
      width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--line);
      background:var(--white);font-family:var(--fa);font-size:13.5px;color:var(--ink);
    }
    .part-tabs{display:none;}
    main{padding:16px 16px 70px;}
    td{padding:11px 8px;}
    .speak-btn{width:30px;height:30px;}
    .speak-btn svg{width:12px;height:12px;}
    .reading-passage{padding:16px;font-size:13.5px;}
  }
</style>

s ont fabriqué des pièces en acier inoxydable."]], "kind": "grammar"}, {"id": "g2", "titleFr": "2.2 Les Verbes en Français (Groupes)", "titleFa": "گروه‌های فعل فرانسوی", "sections": [{"rule_fr": "گروه اول: افعال با پایان -er (به‌جز aller) — منظم هستند.", "rule_fa": "گروه اول: افعال با پایان -er (به‌جز aller). این افعال منظم‌اند. مثال: tester, analyser, calculer.", "examples": [["parler → je parle, tu parles…", "صرف منظم: من صحبت می‌کنم، تو صحبت می‌کنی…"]]}, {"rule_fr": "گروه دوم: افعال با پایان -ir که وجه وصفی‌شان به -issant ختم می‌شود.", "rule_fa": "گروه دوم: افعال -ir که participe présent آن‌ها به -issant ختم می‌شود، معمولاً منظم‌اند. مثال: établir, agrandir, définir.", "examples": [["finir → finissant, réussir → réussissant", "اتمام → در حال اتمام، موفقیت → در حال موفق‌شدن"]]}, {"rule_fr": "گروه سوم: بقیه‌ی افعال (اغلب بی‌قاعده).", "rule_fa": "گروه سوم شامل تمام افعال دیگر است که اغلب بی‌قاعده‌اند، مثل aller, faire, prendre, venir — نیاز به یادگیری جداگانه دارند.", "examples": []}], "exercises": [["assembler → کدام گروه؟", "گروه اول"], ["choisir → کدام گروه؟", "گروه دوم"], ["construire → کدام گروه؟", "گروه سوم"], ["venir → کدام گروه؟", "گروه سوم"]], "kind": "grammar"}, {"id": "g3", "titleFr": "2.3 Les Temps du Futur", "titleFa": "زمان‌های آینده", "sections": [{"rule_fr": "Futur Proche = aller (زمان حال) + مصدر — برای عملی قریب‌الوقوع یا قطعی.", "rule_fa": "آینده‌ی نزدیک (Futur Proche) با فعل aller در زمان حال + مصدر ساخته می‌شود؛ برای کاری که قرار است به‌زودی یا قطعی اتفاق بیفتد.", "examples": [["Je vais vérifier le circuit électrique.", "می‌روم مدار برق را بررسی کنم."]]}, {"rule_fr": "Futur Simple = مصدر + پسوندهای -ai, -as, -a, -ons, -ez, -ont — برای آینده‌ی دورتر یا رسمی‌تر.", "rule_fa": "آینده‌ی ساده (Futur Simple) با افزودن پسوندهای -ai, -as, -a, -ons, -ez, -ont به مصدر ساخته می‌شود؛ برای آینده‌ای دورتر یا رسمی‌تر.", "examples": [["Nous terminerons le projet la semaine prochaine.", "پروژه را هفته‌ی آینده تمام خواهیم کرد."]]}, {"rule_fr": "تفاوت: Futur Proche روی قطعیت/نزدیکی تأکید دارد؛ Futur Simple رسمی‌تر و گاه دورتر است.", "rule_fa": "تفاوت: آینده‌ی نزدیک بر فوریت و قطعیت تأکید دارد، آینده‌ی ساده رسمی‌تر و گاه برای آینده‌ای دورتر به‌کار می‌رود.", "examples": [["Ils vont lancer le test d'ici quelques minutes.", "تا چند دقیقه‌ی دیگر آزمایش را شروع می‌کنند."], ["Ils lanceront le test la semaine prochaine.", "آزمایش را هفته‌ی آینده شروع خواهند کرد."]]}], "exercises": [["Je/J'___ (partir) en inspection du chantier demain matin.", "Je vais partir demain matin. (آینده‌ی نزدیک)"], ["Nous ___ (installer) les nouvelles turbines d'ici la fin du mois.", "Nous installerons les nouvelles turbines… (آینده‌ی ساده)"], ["Ils ___ (commencer) à assembler les pièces immédiatement.", "Ils vont commencer… (آینده‌ی نزدیک)"]], "kind": "grammar"}, {"id": "g4", "titleFr": "2.4 Les Adjectifs (Démonstratifs et Possessifs)", "titleFa": "صفات اشاره و ملکی", "sections": [{"rule_fr": "Adjectifs Démonstratifs: ce, cet, cette, ces — برای اشاره‌ی دقیق به یک اسم.", "rule_fa": "صفات اشاره (ce, cet, cette, ces) برای اشاره‌ی دقیق به یک اسم به‌کار می‌روند. پیش از مصوت یا h خاموش از cet استفاده می‌شود.", "examples": [["ce document, cet appareil, cette machine, ces plans", "این سند، این دستگاه، این ماشین، این نقشه‌ها"], ["cet ingénieur, cet hélicoptère", "این مهندس، این بالگرد (پیش از مصوت/h خاموش)"]]}, {"rule_fr": "Adjectifs Possessifs: mon, ma, mes, ton, ta, tes, son, sa, ses, notre, nos, votre, vos, leur, leurs.", "rule_fa": "صفات ملکی نشان‌دهنده‌ی مالکیت‌اند و بر اساس جنسیت و تعداد اسم بعدی تغییر می‌کنند.", "examples": [["ma maquette, mes prototypes", "ماکت من، نمونه‌های اولیه‌ی من"]]}], "exercises": [["___ plan d'architecture a des spécifications complexes.", "Ce plan d'architecture…"], ["Nous devons mettre à jour ___ documents techniques.", "nos documents techniques"], ["Je vérifie ___ prototypes dans le laboratoire.", "mes prototypes"]], "kind": "grammar"}, {"id": "g5", "titleFr": "2.5 Les Pronoms (Toniques, COD, COI, Y)", "titleFa": "ضمایر (تأکیدی، مفعول مستقیم و غیرمستقیم، Y)", "sections": [{"rule_fr": "Pronoms Toniques: moi, toi, lui, elle, nous, vous, eux, elles — برای تأکید یا بعد از حروف اضافه.", "rule_fa": "ضمایر تأکیدی برای تأکید روی شخص یا بعد از حروف اضافه (avec moi, chez toi) به‌کار می‌روند.", "examples": [["C'est pour lui que nous avons modifié le schéma.", "این برای اوست که شماتیک را تغییر دادیم."]]}, {"rule_fr": "Pronoms COD: me, te, le, la, nous, vous, les — جایگزین مفعول مستقیم (پاسخ به «چه کسی؟/چه چیزی؟»).", "rule_fa": "ضمایر مفعول مستقیم (COD) جایگزین کسی/چیزی می‌شوند که مستقیماً مفعول فعل است.", "examples": [["Je vois le rapport. → Je le vois.", "گزارش را می‌بینم. → آن را می‌بینم."]]}, {"rule_fr": "Pronoms COI: me, te, lui, nous, vous, leur — جایگزین مفعولی که با à معرفی می‌شود.", "rule_fa": "ضمایر مفعول غیرمستقیم (COI) جایگزین مفعولی می‌شوند که با حرف اضافه‌ی à معرفی شده.", "examples": [["Je téléphone à l'ingénieur. → Je lui téléphone.", "به مهندس زنگ می‌زنم. → به او زنگ می‌زنم."]]}, {"rule_fr": "Pronom Y: جایگزین مکان (با à, en, sur…) یا مفعولی که با à معرفی شده (برای اشیا).", "rule_fa": "ضمیر Y جایگزین مکان یا مفعول غیرجاندار معرفی‌شده با à می‌شود.", "examples": [["Nous allons au chantier. → Nous y allons.", "به کارگاه می‌رویم. → به آنجا می‌رویم."], ["Je pense à la solution. → J'y pense.", "به راه‌حل فکر می‌کنم. → به آن فکر می‌کنم."]]}, {"rule_fr": "جای ضمیر: پیش از فعل صرف‌شده یا مصدر؛ در امر مثبت، بعد از فعل با خط‌تیره.", "rule_fa": "جای ضمیر: پیش از فعل صرف‌شده (Je le vois)، پیش از مصدر (Je vais le voir)، و در جمله‌ی امری مثبت بعد از فعل با خط‌تیره (Regarde-le!).", "examples": []}], "exercises": [["Nous contrôlons la pression. → Nous ___ contrôlons.", "la"], ["Il a envoyé le rapport aux ingénieurs. → Il ___ a envoyé le rapport.", "leur"], ["Je pense à la nouvelle méthode. → J'___ pense.", "y"], ["Nous nous rendons au laboratoire chaque matin. → Nous ___ allons.", "y"]], "kind": "grammar"}, {"id": "g6", "titleFr": "2.6 Les Verbes Pronominaux", "titleFa": "افعال ضمیری (بازتابی)", "sections": [{"rule_fr": "افعالی که با ضمیر انعکاسی صرف می‌شوند (me, te, se, nous, vous, se).", "rule_fa": "افعال ضمیری با یک ضمیر انعکاسی صرف می‌شوند. در زمان passé composé همیشه با être صرف می‌شوند.", "examples": [["Je me prépare avant la réunion.", "پیش از جلسه آماده می‌شوم."], ["Elle s'est présentée au comité.", "او خودش را به کمیته معرفی کرد."]]}, {"rule_fr": "سه نوع: بازتابی (se laver)، متقابل (se contacter)، و اصطلاحی (s'en aller, se souvenir).", "rule_fa": "سه نوع فعل ضمیری وجود دارد: بازتابی (عمل به خود سوژه برمی‌گردد)، متقابل (عمل بین چند نفر رد و بدل می‌شود)، و اصطلاحی (فقط به شکل ضمیری وجود دارند).", "examples": [["Ils se sont contactés.", "آن‌ها با هم تماس گرفتند. (متقابل)"]]}], "exercises": [["(se connecter) Je ________ au logiciel de simulation.", "Je me suis connecté(e) au logiciel de simulation."], ["(se tromper) Je ________ dans mes calculs.", "Je me suis trompé(e) dans mes calculs."]], "kind": "grammar"}, {"id": "g7", "titleFr": "2.7 Le Passé Récent", "titleFa": "گذشته‌ی اخیر", "sections": [{"rule_fr": "عملی که تازه اتفاق افتاده. ساختار: venir (زمان حال) + de + مصدر.", "rule_fa": "گذشته‌ی اخیر برای عملی است که تازه انجام شده. ساختار: فعل venir در زمان حال + de + مصدر.", "examples": [["Nous venons de terminer la maquette.", "تازه ماکت را تمام کردیم."]]}], "exercises": [["Nous ________ (venir de + terminer) le prototype.", "Nous venons de terminer le prototype."], ["Ils ________ (venir de + détecter) un problème.", "Ils viennent de détecter un problème."]], "kind": "grammar"}, {"id": "g8", "titleFr": "2.8 Le Passé Composé et l'Imparfait", "titleFa": "گذشته‌ی ساده (پاسه کامپوزه) و ناقص (امپارفه)", "sections": [{"rule_fr": "Passé Composé: عمل مشخص و تمام‌شده در گذشته. با avoir (اغلب) یا être (افعال حرکتی/ضمیری).", "rule_fa": "گذشته‌ی مرکب (Passé Composé) برای اعمال نقطه‌ای و تمام‌شده در گذشته به‌کار می‌رود؛ با avoir یا être ساخته می‌شود.", "examples": [["J'ai effectué un essai hier.", "دیروز یک آزمایش انجام دادم."]]}, {"rule_fr": "Imparfait: عادت، توصیف، یا عملی در حال انجام در گذشته. ریشه از nous در زمان حال + پسوندهای -ais…", "rule_fa": "ناقص (Imparfait) برای عادت‌ها، توصیف‌ها، یا عملی در حال انجام در گذشته به‌کار می‌رود.", "examples": [["Nous vérifiions chaque étape à cette époque.", "آن زمان هر مرحله را بررسی می‌کردیم."]]}, {"rule_fr": "معمولاً Imparfait زمینه/توصیف را می‌سازد، و Passé Composé رویدادی است که آن زمینه را قطع می‌کند.", "rule_fa": "معمولاً امپارفه زمینه یا توصیف صحنه را می‌سازد و پاسه‌کامپوزه رویدادی است که در آن زمینه اتفاق می‌افتد یا آن را قطع می‌کند.", "examples": [["Lorsque l'alarme s'est déclenchée, ils étaient en train de programmer le robot.", "وقتی آژیر به‌صدا درآمد، آن‌ها داشتند ربات را برنامه‌نویسی می‌کردند."]]}], "exercises": [["Quand je/j'___ (être) en formation, je/j'___ (analyser) des matériaux tous les jours.", "étais / analysais"], ["Hier, nous ___ (vérifier) la solidité de la structure.", "avons vérifié"]], "kind": "grammar"}, {"id": "g9", "titleFr": "2.9 Les Phrases Conditionnelles", "titleFa": "جملات شرطی", "sections": [{"rule_fr": "شرط واقعی: Si + حال ساده → آینده‌ی ساده.", "rule_fa": "شرط قابل‌تحقق: Si + زمان حال → آینده‌ی ساده. یعنی چیزی که واقعاً ممکن است اتفاق بیفتد.", "examples": [["Si tu viens au laboratoire, nous lancerons le test ensemble.", "اگر به آزمایشگاه بیایی، آزمایش را با هم شروع می‌کنیم."]]}, {"rule_fr": "شرط خلاف واقع در حال: Si + ناقص → شرطی حال.", "rule_fa": "شرط خلاف واقعِ حال: Si + امپارفه → وجه شرطیِ حال. یعنی فرضی که در حال حاضر واقعیت ندارد.", "examples": [["Si j'avais les plans, je pourrais commencer la simulation.", "اگر نقشه‌ها را داشتم، می‌توانستم شبیه‌سازی را شروع کنم. (اما ندارم)"]]}, {"rule_fr": "شرط خلاف واقع در گذشته: Si + گذشته‌ی کامل (plus-que-parfait) → شرطی گذشته.", "rule_fa": "شرط خلاف واقعِ گذشته: Si + ماضی بعید → وجه شرطیِ گذشته. یعنی فرصتی که در گذشته از دست رفته.", "examples": [["Si nous avions vérifié le système, nous aurions évité la panne.", "اگر سیستم را بررسی کرده بودیم، از خرابی جلوگیری می‌کردیم. (خیلی دیر شده)"]]}], "exercises": [["Si nous avons le budget, nous ___ (achever) la construction cet été.", "nous achèverons la construction"], ["Si je trouvais une faille, je/j'___ (corriger) le code immédiatement.", "je corrigerais le code"]], "kind": "grammar"}, {"id": "g10", "titleFr": "2.10 عبارات زمانی: Il y a و Depuis", "titleFa": "عبارات زمانی: Il y a و Depuis", "sections": [{"rule_fr": "Il y a: مدت‌زمان سپری‌شده از یک رویداد گذشته.", "rule_fa": "«Il y a» برای بیان مدت‌زمانی که از یک رویداد گذشته سپری شده استفاده می‌شود.", "examples": [["J'ai signé le contrat il y a trois semaines.", "قرارداد را سه هفته پیش امضا کردم."]]}, {"rule_fr": "Depuis: عملی که در گذشته شروع شده و همچنان ادامه دارد.", "rule_fa": "«Depuis» برای عملی است که در گذشته آغاز شده و تا الان ادامه دارد.", "examples": [["Je travaille sur ce projet depuis janvier.", "از ژانویه روی این پروژه کار می‌کنم. (و هنوز ادامه دارد)"]]}], "exercises": [["J'ai reçu les plans ___ deux jours.", "il y a"], ["Nous testons ce logiciel ___ l'année dernière.", "depuis"]], "kind": "grammar"}, {"id": "g11", "titleFr": "2.11 L'Impératif", "titleFa": "وجه امری", "sections": [{"rule_fr": "برای دستور، توصیه یا دستورالعمل؛ بدون ضمیر فاعلی، در سه شخص: tu, nous, vous.", "rule_fa": "وجه امری برای دستور، توصیه یا دستورالعمل به‌کار می‌رود؛ بدون ضمیر فاعلی و فقط در سه شخص tu، nous و vous صرف می‌شود.", "examples": [["(Tu) Lance le test !", "آزمایش را شروع کن!"], ["(Nous) Vérifions la maquette !", "بیایید ماکت را بررسی کنیم!"], ["(Vous) Envoyez le fichier !", "فایل را ارسال کنید!"]]}, {"rule_fr": "برای افعال گروه اول در دوم شخص مفرد، -s پایانی حذف می‌شود؛ مگر پیش از en/y که برای تلفظ روان برمی‌گردد.", "rule_fa": "در افعال گروه اول، در شکل «tu» حرف s پایانی حذف می‌شود (Parle!)؛ اما پیش از en یا y برای روانی تلفظ دوباره برمی‌گردد (Vas-y!).", "examples": []}], "exercises": [["(contrôler) la pression régulièrement. — شکل tu", "Contrôle la pression régulièrement."], ["(aller) au laboratoire maintenant ! — شکل vous", "Allez au laboratoire maintenant !"]], "kind": "grammar"}, {"id": "g12", "titleFr": "2.12 ضمایر En و Y", "titleFa": "ضمایر En و Y", "sections": [{"rule_fr": "Pronom En: جایگزین مفعولی که با de معرفی شده یا یک مقدار.", "rule_fa": "ضمیر En جایگزین مفعولی می‌شود که با de معرفی شده، یا جایگزین یک مقدار عددی.", "examples": [["Tu as du matériel ? → Oui, j'en ai.", "تجهیزات داری؟ → بله، دارم."], ["Tu as acheté trois capteurs ? → J'en ai acheté trois.", "سه تا سنسور خریدی؟ → سه تا خریدم."]]}, {"rule_fr": "Pronom Y: جایگزین مکان یا مفعول معرفی‌شده با à (تکرار از بخش ۵.۴).", "rule_fa": "ضمیر Y جایگزین مکان یا مفعولی می‌شود که با à معرفی شده است.", "examples": [["Je participe au projet. → J'y participe.", "در پروژه شرکت می‌کنم. → در آن شرکت می‌کنم."]]}], "exercises": [["Nous nous sommes rendus à l'usine. → Nous ___ sommes rendus.", "y"], ["Il a parlé de la nouvelle norme ISO. → Il ___ a parlé.", "en"]], "kind": "grammar"}, {"id": "g13", "titleFr": "2.13 ترتیب ضمایر متعدد", "titleFa": "ترتیب ضمایر متعدد در جمله", "sections": [{"rule_fr": "ترتیب کلی: me/te/se/nous/vous → le/la/les → lui/leur → y → en.", "rule_fa": "وقتی چند ضمیر با هم در یک جمله بیایند، ترتیب کلی این است: me/te/se/nous/vous ← le/la/les ← lui/leur ← y ← en.", "examples": [["Je le lui donne.", "آن را به او می‌دهم."], ["Nous y en avons installé.", "از آن‌ها در آنجا نصب کردیم."]]}, {"rule_fr": "نکته: در passé composé اگر COD پیش از فعل بیاید، فعل باید با آن مطابقت داشته باشد (accord).", "rule_fa": "نکته: در passé composé، اگر مفعول مستقیم (COD) پیش از فعل بیاید، وجه وصفی گذشته باید با آن مطابقت (accord) داشته باشد.", "examples": []}], "exercises": [["Nous donnons les plans à l'ingénieur. → Nous ___ ___ donnons.", "les lui"], ["Ils installeront des capteurs dans le bâtiment. → Ils ___ ___ installeront.", "y en"]], "kind": "grammar"}, {"id": "g14", "titleFr": "2.14 نکات تکمیلی (COD/COI، افعال غیرشخصی)", "titleFa": "نکات تکمیلی: COD/COI و افعال غیرشخصی", "sections": [{"rule_fr": "مرور COD/COI: COD پاسخ به «چه کسی؟/چه چیزی؟» و COI پاسخ به «به چه کسی؟/به چه چیزی؟».", "rule_fa" ش فردی (۷۰ دقیقه)", "fr": "PART 3: Individual Writing (70 minutes)", "desc": "متنی حدود ۲۰۰ کلمه‌ای می‌نویسید. بر اساس مطالعه‌ی موردی و گفتگو، راه‌حل‌ها یا توصیه‌ها را به‌شکلی روشن و ساختاریافته ارائه می‌دهید.", "points": ["ساختار: مقدمه‌ی کوتاه → راه‌حل‌های پیشنهادی → توجیه → نتیجه‌گیری", "فقط نسخه‌ی نهایی تصحیح می‌شود، نه پیش‌نویس", "ارزیابی: وضوح، ساختار، لحن حرفه‌ای، گرامر، واژگان"]}, {"part": "بخش ۴ — گفتگوی شفاهی فردی (۱۰ دقیقه)", "fr": "PART 4: Individual Oral (10 minutes)", "desc": "با یک ممتحن ملاقات می‌کنید که اطلاعات جدیدی به پرونده اضافه می‌کند. باید واکنش حرفه‌ای نشان دهید، استدلالتان را توضیح دهید و در صورت لزوم توصیه‌هایتان را تعدیل کنید. (ضبط صوتی)", "points": ["واکنش حرفه‌ای به اطلاعات/محدودیت‌های جدید، تعدیل توصیه‌ها، توضیح روشن استدلال", "ارزیابی: فرانسه‌ی خودجوش، استدلال حرفه‌ای، انطباق‌پذیری"]}]}, {"id": "oral_phrases", "titleFa": "عبارات کاربردی (بخش شفاهی)", "titleFr": "3.3 Important Phrases", "kind": "phrases", "groupFa": "عبارات و افعال", "categories": [{"cat": "Phrases d'Introduction", "catFa": "عبارات مقدماتی", "items": [["Je vous écris afin de vous informer que...", "برایتان می‌نویسم تا مطلع‌تان کنم که..."], ["Nous souhaitons attirer votre attention sur...", "می‌خواهیم توجه‌تان را به... جلب کنیم"], ["L'objectif principal de cette réunion est de...", "هدف اصلی این جلسه این است که..."], ["Il est important de noter que...", "لازم است توجه داشت که..."], ["Suite à notre dernière discussion, je...", "پیرو آخرین گفتگویمان، من..."], ["En réponse à votre demande, je...", "در پاسخ به درخواست شما، من..."]]}, {"cat": "Exprimer une Opinion ou une Suggestion", "catFa": "بیان نظر یا پیشنهاد", "items": [["Je pense que...", "فکر می‌کنم که..."], ["Il serait judicieux de...", "عاقلانه خواهد بود که..."], ["Nous recommandons fortement que...", "ما قویاً توصیه می‌کنیم که..."], ["À mon avis, il serait préférable de...", "به نظر من، بهتر خواهد بود که..."], ["Il est conseillé de...", "توصیه می‌شود که..."]]}, {"cat": "Faire des Transitions", "catFa": "ایجاد انتقال vegarderions", "پشتیبان‌گیری کردن"], ["simuler", "la simulation", "on simule / nous simulons / vous simulez", "que nous simulions", "nous simulerions", "شبیه‌سازی کردن"], ["monter", "le montage", "on monte / nous montons / vous montez", "que nous montions", "nous monterions", "سوار/برپا کردن"], ["construire", "la construction", "on construit / nous construisons / vous construisez", "que nous construisions", "nous construirions", "ساختن"], ["dessiner", "le dessin", "on dessine / nous dessinons / vous dessinez", "que nous dessinions", "nous dessinerions", "نقشه‌کشیدن"], ["distribuer", "la distribution", "on distribue / nous distribuons / vous distribuez", "que nous distribuions", "nous distribuerions", "توزیع کردن"], ["modéliser", "la modélisation", "on modélise / nous modélisons / vous modélisez", "que nous modélisions", "nous modéliserions", "مدل‌سازی کردن"]]}, {"id": "topic1", "titleFr": "1. L’intelligence artificielle (IA)", "titleFa": "اهمیت هوش مصنوعی (IA)", "text": "1. L’intelligence artificielle (IA)\nNous savons que l'intelligence artificielle (IA) est un acteur majeur du changement aujourd'hui, et nous\ndevrions l'intégrer dans notre projet.\nComment procéder ? La méthode la plus applicable serait l'apprentissage supervisé. Il faudrait collecter\ndes données, entraîner l'IA, puis valider le modèle.\n\nQuels est l'avantage de l'IA ?\n➢ Elle nous aiderait à réduire les erreurs humaines !\n➢ Elle nous permettrait de mieux contrôler les données.\n➢ Nous pourrions réduire les coûts en ressources humaines et surmonter le manque de main-d'œuvre.\n\nL'IA pourrait également aider à résoudre des problèmes environnementaux :\n➢ On peut développer un plan d'optimisation pour la consommation d'énergie, la gestion des\ndéchets, augmenter l'efficacité, en utilisant l'IA.\n➢ Il est important que nous intégrions l'environnementale pratique dans notre IA pour contribuer au\ndéveloppement durable.\nCependant, l'IA peut avoir des aspects négatifs, aussi :\n➢ L'IA n'est pas facile à utiliser pour tout le monde !\n➢ Nous devrions donner une base de données bien établie à l'IA.\nPour surmonter le premier défi, nous devrions faire appel à des experts. Pour le second, nous devrions\ninvestir du temps avant de lancer l'IA.\n\nIl est essentiel qu'elle comprenne parfaitement nos besoins, car toute incompréhension pourrait affecter\nses performances.\n\nEn résumé, il est important que nous développions un plan détaillé pour l'intégration de l'IA. L'équipe\ndoit être bien formée pour utiliser efficacement cette technologie. Si nous respectons ces étapes, nous\npourrions maximiser les avantages tout en minimisant les risques.", "kind": "reading", "groupFa": "موضوعات عمومی گفتگو"}, {"id": "topic2", "titleFr": "2. L'importance de la formation", "titleFa": "اهمیت آموزش کارکنان", "text": "2. L'importance de la formation\nLa formation est essentielle pour le succès de toute organisation. Il est crucial que nous analysions\nd'abord les besoins et les lacunes.\n\nDonc, nous devrions évaluer les compétences actuelles des employés par organiser un test de\nconnaissances. Si nous identifions clairement les compétences manquantes, nous développons un\nplan de formation efficace :\n\n➢ Formation par la pratique : Il est important que nous utilisions des exemples concrets et\ndes modèles interactifs pour faciliter l'apprentissage comme le jeu de rôle, les études de cas,…)\n➢ Considérer tous les niveaux : Nous devons, prendre en compte que le niveau d’apprentissage\nest unique par chaque personne Il est essentiel que la formation soit adaptée aux différents\nniveaux de compétence de chaque personne.\n➢ Personnaliser la formation : Nous devrions personnaliser le contenu, nous pourrons alors\nrépondre aux besoins spécifiques de chaque personne.\n\nPourquoi la formation est-elle importante ?\n\n➢ Amélioration des compétences : La formation permet aux employés de développer de\nnouvelles compétences et d'améliorer leurs performances.\n➢ Adaptation aux changements : Il est nécessaire que l'équipe soit à jour avec les dernières\navancées.\n\nAprès la formation, il est important que nous évaluions son efficacité. Nous pouvons réaliser un\nsondage de satisfaction. Il est également important de fournir une formation continue.\n\nConclusion\n\nEn résumé, la formation est un investissement précieux. Il faudrait que nous planifiions chaque étape,\nen intégrant des méthodes interactives et personnalisées, pour assure qu'elle réponde aux besoins.", "kind": "reading", "groupFa": "موضوعات عمومی گفتگو"}, {"id": "topic3", "titleFr": "3. L'importance de l'environnement", "titleFa": "اهمیت محیط زیست", "text": "3. L'importance de l'environnement\nLa protection de l'environnement est essentielle pour le bien-être de notre planète et des générations futures.\nDonc, nous devons toujours donner la priorité à l'environnement l'écologie/ le développement durable.\nIl est essentiel que nous adoptions les gestes nécessaires pour minimiser notre impact sur\nl'environnement. Nous devons préserver les ressources naturelles pour les générations futures.\nPourquoi l'environnement est-il important ?\n➢   Protection de la biodiversité : Nous perdrions la diversité, si\n➢   Santé publique : Il est nécessaire que nous contrôlions la pollution pour améliorer la qualité de\nl'air et de l'eau.\nComment procéder?\n1. Analyser notre impact environnemental :\n➢ Nous sommes obligés d’analyser attentivement le cycle de vie du produit.\n➢ Nous devrions évaluer les effets de nos activités sur l'environnement. Il serait bénéfique\nque nous identifiions les domaines où nous pouvons réduire notre empreinte écologique.\n➢ Il est important que nous que nous auditions l’environnement de temps en temps et\nvérifier si les règles sont bien respectées ou non.\n2. Établir un plan d'action : Il est important que nous développions un plan inclue des objectifs\nclairs et des mesures concrètes pour améliorer notre performance environnementale.\no   Réduction des déchets : Il est important que nous adoptions des pratiques de recyclage\net de compostage.\no   Économie d'énergie : Il faudrait que nous utilisions des sources d'énergie renouvelables\net améliorions notre efficacité énergétique. →Économiser l’énergie contribue à la\nprotection de l’environnement.\no   Préservation de l'eau : Il est essentiel que nous gérions l'utilisation de l'eau de manière\nresponsable.\n3. Sensibiliser et former : Si nous éduquons notre équipe sur les enjeux environnementaux, ils\nseront plus engagés dans cette démarche. Il est essentiel que nous devions sensibiliser les gens\naux enjeux environnementaux.\nÉvaluer et ajuster nos actions\nAprès la mise en place des initiatives, il est important que nous évaluions leur efficacité.\n➢   Il fout évaluer l’impact de …. Avant le début des….\n➢   Il est important que nous analysions les impacts environnementaux du projet.\nConclusion\nEn résumé, la protection de l'environnement est un engagement essentiel. Il faudrait que nous planifiions\nnos actions pour garantir qu'elles aient un impact positif.\n*Chaque geste compte pour contribution à la protection de l’environnement.", "kind": "reading", "groupFa": "موضوعات عمومی گفتگو"}, {"id": "topic4", "titleFr": "4. L'importance de la santé et de la sécurité", "titleFa": "اهمیت سلامت و ایمنی شغلی", "text": "4. L'importance de la santé et de la sécurité\nLa santé et la sécurité au travail sont essentielles pour le bien-être des employés et le succès de notre\norganisation. Nous devons toujours donner la priorité a la santé et la sécurité avant tout.\n→La prévention est meilleure que le traitement.\nIl est crucial que nous mettions en place des mesures appropriées pour assurer un environnement de\ntravail sûr. Si nous identifions les risques potentiels, nous pourrons prévenir les accidents et les maladies\nprofessionnelles→ Casque de sécurité, lunettes de protection, bouchons d'oreilles, gants de protection,\nchaussures de sécurité, masques respiratoires, harnais de sécurité, vêtements de protection.\nComment procéder?\n1. Analyser les risques : Il est important d'analyser en profondeur les risques autour du lieu de\ntravail. Il serait bénéfique que nous consultions les employés pour obtenir leurs perspectives.\n2. Établir un plan de santé et de sécurité : Il est important que ce plan inclue :\n➢ Formation pratique : Il faudrait que nous organisions des formations interactives pour\nque les employés sachent comment réagir en cas d'urgence→ premier secours.\n→Organiser des sessions pour sensibiliser les employés aux risques !\n➢ Tester les connaissances : Nous devrions évaluer le niveau de compréhension des\nprocédures de sécurité.\n➢ Considérer tous les niveaux : Il est essentiel que la formation soit adaptée à tous les\npostes et responsabilités.\n➢ Il fout que nous vérifiions la conformité des équipements avec les règles de sécurité.\n➢ Les personnels doivent être formés pour réagir en cas d’urgence.\n➢ Les machines doivent être inspectées régulièrement.\nPourquoi la santé et la sécurité sont-elles importantes ?\n•   Conformité légale : Il est nécessaire que nous respections les lois et règlementations en matière\nde sécurité.\n•   Amélioration de la productivité : Si les employés se sentent en sécurité, ils seront plus motivés\net efficaces.\nÉvaluer et ajuster les mesures de santé et de sécurité\nLes employés doivent signaler tous les risques à leurs superviseurs.\nAprès la mise en place des mesures, il est important que nous évaluions leur efficacité.\nIl est important que nous développions un plan de prévention qui non seulement couvre les accidents\npassés, mais aussi anticipe la situation future.\nConclusion\nEn résumé, la santé et la sécurité au travail sont indispensables. Il faudrait que nous planifiions chaque\nétape pour garantir que les mesures répondent aux besoins et contribuent au bien-être de tous. Si nous\ntravaillons ensemble, nous pourrons créer un environnement de travail sûr et productif.", "kind": "reading", "groupFa": "موضوعات عمومی گفتگو"}, {"id": "case1", "titleFr": "ÉTUDE DE CAS 1: Gestion des risques dans une usine manufacturière", "titleFa": "مطالعه‌ی موردی 1: مدیریت ریسک در یک کارخانه‌ی تولیدی", "text": "ÉTUDE DE CAS 1: Gestion des risques dans une usine manufacturière\n1. Contexte\nUne usine qui fabrique des composantes mécaniques a enregistré plusieurs accidents de travail récemment\n(coupures, coincements, irritations). La direction veut réduire les incidents et renforcer la conformité aux\nexigences de la CNESST.\nLes ingénieurs doivent participer à une démarche de prévention structurée.\n2. Objectifs du mandat\n1. Repérer les dangers présents dans les opérations de production.\n2. Proposer des mesures de prévention réalistes.\n3. Vérifier si les mesures mises en place sont efficaces.\n3. Risques identifiés (après visites terrain et analyse des incidents)\n•   Risques mécaniques : protections absentes ou insuffisantes sur certaines machines; zones de\npincement; arrêt d’urgence mal positionné.\n•   Risques chimiques : exposition possible à des produits irritants (nettoyants, solvants, huiles);\nprocédures d’entreposage inégales.\n•   Risques ergonomiques : postures contraignantes; manutention manuelle; gestes répétitifs.\n\nPartie 2 – Expression orale en groupe (discussion)\n1. But de la discussion\nPartager l’information, clarifier les besoins, puis convenir de solutions et de recommandations.\n2. Plan de prise de parole (structure simple)\n1. Résumer le problème en une phrase.\n2. Nommer le risque principal dont vous parlez.\n3. Proposer 2 ou 3 mesures concrètes.\n4. Dire comment on va vérifier l’efficacité.\n3. Contenu attendu selon les “fiches” (réponses modèles)\nFiche 1 – Dispositifs de protection des machines\nMesures recommandées (exemples)\n•   Installer des protecteurs fixes ou mobiles avec verrouillage.\n•   Ajouter des capteurs de présence (barrières immatérielles) sur les zones dangereuses.\n\n•   Vérifier l’accessibilité des arrêts d’urgence.\n•   Mettre en place une procédure de cadenassage pour les interventions.\nPhrase modèle\nIl serait préférable d’installer des protecteurs et des capteurs. Il faudrait que l’accès aux zones dangereuses\nsoit contrôlé. Il est important que la maintenance suive un plan de vérification régulier.\nFiche 2 – Formation sur les produits chimiques\nMesures recommandées (exemples)\n•   Former les employés sur l’étiquetage, les pictogrammes et les fiches de données de sécurité.\n•   Exiger les EPI adaptés (gants, lunettes, protection respiratoire selon le produit).\n•   Clarifier l’entreposage (compatibilités, ventilation, contenants).\n•   Définir une procédure en cas de déversement.\nPhrase modèle\nIl faudrait que la formation soit obligatoire. Il est essentiel que les employés comprennent les pictogrammes\net sachent quoi faire en cas d’exposition.\nFiche 3 – Réaménagement ergonomique\nMesures recommandées (exemples)\n•   Ajuster la hauteur des plans de travail; ajouter des supports.\n•   Introduire des aides à la manutention (chariot, palan, tables élévatrices).\n•   Réduire les gestes répétitifs par rotation des tâches.\n•   Faire une évaluation ergonomique périodique.\nPhrase                                                                                              modèle\nOn pourrait réaménager les postes pour limiter les postures pénibles. Il serait important que l’équipement\nsoit ajustable pour s’adapter à différents employés.\nFiche 4 – Supervision et organisation\nMesures recommandées (exemples)\n•   Planifier des inspections HSE hebdomadaires avec checklist.\n•   Suivre les actions correctives dans un registre (responsable, délai, statut).\n•   Faire des rencontres “sécurité” courtes et régulières.\n•   Mettre en place un canal simple de signalement des risques.\nPhrase                                                                                                      modèle\nIl serait nécessaire que les superviseurs fassent des vérifications régulières. Il faut que les actions correctives\nsoient suivies et fermées dans des délais clairs.\n4. Phrases “outil” (simples et mémorisables)\n•   À mon avis, il faudrait…\n\n•   Il serait important que + subjonctif…\n•   Je propose de… parce que…\n•   Pour vérifier l’efficacité, on peut…\n•   Je suis d’accord, mais je pense que…\n\nPartie 3 – Expression écrite (200 mots environ)\n1. Structure attendue (4 paragraphes)\n1. Rappel du contexte et de l’objectif.\n2. Recommandations techniques (machines, chimie, ergonomie).\n3. Recommandations de gestion (supervision, suivi).\n4. Conclusion : bénéfices et méthode de vérification.\n2. Production écrite modèle (≈200 mots)\nAfin de réduire les accidents dans l’usine et d’assurer la conformité aux exigences de la CNESST, un\nprogramme de prévention devrait être appliqué de façon structurée. D’abord, pour limiter les risques\nmécaniques, il serait préférable d’installer des dispositifs de protection sur les machines, comme des\nprotecteurs et des capteurs. Il faut que les arrêts d’urgence soient accessibles et que les interventions soient\nencadrées par une procédure de cadenassage.\nEnsuite, pour les produits chimiques, les employés devraient suivre une formation obligatoire. Il est\nessentiel qu’ils comprennent l’étiquetage, utilisent l’équipement de protection individuelle et respectent des\nrègles d’entreposage claires. Une procédure en cas de déversement devrait aussi être connue.\nPar ailleurs, l’ergonomie peut être améliorée par un réaménagement des postes de travail. On pourrait\najouter des équipements ajustables et des aides à la manutention, et organiser une rotation des tâches afin\nde réduire les gestes répétitifs.\nEnfin, la direction devrait renforcer la supervision par des inspections régulières et un registre de suivi des\nactions correctives. L’efficacité des mesures pourrait être évaluée par le nombre d’incidents, les\nobservations terrain et la participation des employés.\n\nPartie 4 – Expression orale individuelle (présentation 10 minutes)\n1. Objectif\nExpliquer vos recommandations comme si vous parliez à un acteur du dossier (gestionnaire, superviseur,\nreprésentant SST).\n2. Plan de présentation (facile à suivre)\n1. Contexte et priorité.\n2. Mesures techniques principales.\n3. Mesures de gestion.\n4. Vérification de l’efficacité.\n\n5. Conclusion.\n3. Script modèle (adaptable)\nDans cette usine, la priorité est de réduire les accidents et de s’assurer que les exigences de la CNESST\nsoient respectées. Je recommande d’agir sur trois axes : la sécurité des machines, la gestion des produits\nchimiques et l’ergonomie.\nPour les machines, il faudrait installer des protecteurs et des capteurs sur les zones dangereuses. Il est\nimportant que les arrêts d’urgence soient accessibles et que les interventions soient faites avec une\nprocédure de cadenassage. Pour les produits chimiques, les employés devraient recevoir une formation\nobligatoire sur l’étiquetage, les fiches de données de sécurité et le port des EPI. Il faut aussi clarifier\nl’entreposage et les actions en cas de déversement.\nSur le plan organisationnel, les superviseurs devraient effectuer des inspections régulières avec une liste de\nvérification. Il serait nécessaire de suivre les actions correctives dans un registre avec des responsables et\ndes délais. Enfin, l’efficacité des mesures peut être évaluée par la baisse des incidents, les audits terrain et\nles retours des employés. Ces actions amélioreraient la sécurité et réduiraient durablement les risques.\n\nConseils de méthode (fin de chapitre)\n1. Parler et écrire avec une structure fixe : contexte, risques, solutions, vérification.\n2. Utiliser souvent le conditionnel : il faudrait, il serait préférable, on pourrait.\n3. Utiliser le subjonctif après : il faut que, il est important que, il est essentiel que.\n4. Donner des mesures concrètes (2 à 3), pas une liste trop longue.\n5. Toujours expliquer “comment on vérifie” : indicateurs, inspections, registre, audits.", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "case2", "titleFr": "ÉTUDE DE CAS 2 : Projet d’usine pharmaceutique au Québec et choix du", "titleFa": "مطالعه‌ی موردی 2: پروژه‌ی کارخانه‌ی دارویی در کبک و انتخاب سطح اتوماسیون", "text": "ÉTUDE DE CAS 2 : Projet d’usine pharmaceutique au Québec et choix du\nniveau d’automatisation\n\n1) Contexte\nVous travaillez dans une firme de génie-conseil. Une entreprise pharmaceutique étrangère souhaite\nimplanter au Québec une nouvelle usine pour fabriquer des médicaments stériles destinés au marché\ncanadien (par exemple des crèmes, des onguents et des solutions). Comme plusieurs produits sont\nnouveaux, la production exige des équipements spécialisés.\nL’usine peut fonctionner avec des opérations manuelles (opérateurs présents sur le plancher) ou avec des\nsystèmes automatisés (contrôle à distance depuis une salle de commande). Le client veut une usine\nmoderne, mais hésite entre une automatisation partielle ou complète. L’automatisation implique la\nconception des systèmes, le choix de l’instrumentation et des panneaux de commande, la programmation,\nles essais et la mise en service, puis une gestion rigoureuse une fois les systèmes en opération.\n\n2) Partie 2 – Expression orale en groupe (discussion)\n2.1 But de la discussion\n1. Clarifier les besoins du client.\n2. Proposer des recommandations concrètes (équipements, conformité, coûts, mise en marché).\n3. Justifier les choix (avantages, risques, impacts).\n2.2 Plan de réponse (structure simple)\n•   Besoin principal\n•   Recommandation\n•   Justification\n•   Prochaine étape (ce qu’on fait ensuite)\n2.3 Réponses modèles par fiche\nFiche 1 – Analyse des besoins en équipement\nÉquipements spécialisés typiques (à adapter au scénario)\n•   Zones propres et environnement contrôlé (air, filtration, pression différentielle).\n•   Systèmes de préparation et de transfert (cuves, pompes, tuyauterie sanitaire).\n•   Équipements de nettoyage et/ou de stérilisation adaptés au procédé.\n•   Ligne de remplissage/conditionnement et contrôles en cours de production.\n•   Instrumentation et supervision (capteurs, automates, interfaces opérateur).\nComment la firme peut aider\n•   Rédiger un cahier des charges (URS) et des critères d’acceptation.\n\n•   Évaluer les fournisseurs (performance, conformité, service, délais).\n•   Planifier les essais (FAT/SAT), la mise en service et la qualification.\nRecommandation claire (sur l’automatisation)\n•   Proposer une automatisation “par étapes” : automatiser d’abord les opérations à fort impact\nqualité/sécurité, puis étendre ensuite selon les résultats et le budget.\nFiche 2 – Évaluation des réglementations\nPoints majeurs à couvrir (niveau “examen OQLF”, sans entrer dans le juridique)\n•   Respect des Bonnes pratiques de fabrication (BPF) prévues par le Règlement sur les aliments et\ndrogues, Partie C, Division 2.\n•   Utiliser les guides de Santé Canada sur les BPF (GUI-0001).\n•   Pour les produits stériles, suivre l’annexe dédiée “Manufacture of sterile drugs” (GUI-0119), qui\nprécise les attentes pour la fabrication et l’emballage/étiquetage des médicaments stériles.\n•   Obtenir une licence d’établissement (Drug Establishment Licence) si le site fabrique,\nemballe/étiquette, teste, importe, distribue, etc.\nComment la firme peut accompagner\n•   Faire une analyse d’écart (gap analysis) entre le design prévu et les exigences BPF.\n•   Définir un plan de validation/qualification (IQ/OQ/PQ) et un système qualité adapté.\n•   Préparer le site pour les inspections et la documentation.\nFiche 3 – Évaluation des coûts\nPrincipales catégories de coûts\n•   Bâtiment et utilités : zones propres, ventilation, eau, vapeur, air comprimé, énergie.\n•   Équipements et installation : achat, intégration, tuyauterie, instrumentation.\n•   Automatisation : automates, interfaces, licences logicielles, cybersécurité, tests.\n•   Validation et qualité : qualification, documentation, formation, audits.\n•   Personnel : production, maintenance, assurance qualité, contrôle qualité.\n•   Délais et risques : contingences, retards fournisseurs, modifications de conception.\nComment la firme aide à construire un budget réaliste\n•   Faire un budget par phases : étude, conception, achats, construction, mise en service, qualification,\ndémarrage.\n•   Ajouter une contingence et un scénario “automatisation partielle vs complète” (comparaison\ncoûts/risques/bénéfices).\nFiche 4 – Planification de la mise en marché\nStratégies possibles (niveau général)\n•   Planifier un lancement progressif : un nombre limité de produits au début, puis montée en cadence.\n\n•   Définir une stratégie de chaîne d’approvisionnement et de distribution au Canada.\n•   Construire un plan de qualité et de traçabilité pour sécuriser la confiance du marché.\n•   Préparer une communication scientifique et réglementaire (données, conformité, fiabilité).\nComment la firme peut soutenir\n•   Traduire les exigences du marché en exigences techniques (capacités, volumes, flexibilité).\n•   Planifier le calendrier industriel compatible avec les exigences de conformité (validation avant\nproduction commerciale).\n•   Mettre en place des indicateurs de performance (qualité, rendement, délais).\n\n3) Partie 3 – Expression écrite (texte modèle, environ 200 mots)\nDans le cadre du projet d’implantation d’une usine de médicaments stériles au Québec, je recommande une\napproche structurée et progressive. D’abord, il faut préciser les besoins en équipements : zones propres,\nutilités, équipements de procédé et ligne de conditionnement. Notre firme peut rédiger un cahier des\ncharges, comparer les fournisseurs et organiser les essais et l’acceptation des équipements.\nEnsuite, la conformité réglementaire doit guider la conception. L’usine devra respecter les Bonnes pratiques\nde fabrication applicables au Canada, et des exigences spécifiques existent pour la fabrication de\nmédicaments stériles. Il est donc important de planifier dès le départ la qualification des équipements et la\nvalidation des systèmes, ainsi que la documentation qualité.\nPour l’automatisation, je propose une automatisation par étapes. Il serait préférable d’automatiser en priorité\nles opérations critiques pour la qualité et la stérilité, tout en gardant des procédures manuelles robustes là\noù c’est plus simple et moins risqué au début. Cette approche réduit les risques au démarrage et facilite\nl’amélioration continue.\nEnfin, un budget réaliste doit intégrer les coûts d’infrastructure, d’équipements, d’automatisation, de\nvalidation et de personnel. Avec ce plan, le projet sera plus maîtrisé et le démarrage plus fiable.\n\n4) Partie 4 – Expression orale individuelle (plan + script court)\nPlan (5 points)\n1. Résumer le besoin du client.\n2. Proposer le niveau d’automatisation recommandé.\n3. Expliquer les impacts sur la conformité et la qualité.\n4. Donner 3 actions concrètes à lancer immédiatement.\n5. Conclure avec la logique et les bénéfices.\nScript modèle (adaptable)\nVotre objectif est d’implanter une usine stérile moderne au Québec, tout en maîtrisant les risques, les coûts\net les délais. Je recommande une automatisation progressive : automatiser d’abord les étapes critiques pour\nla stérilité et la qualité, puis étendre ensuite selon les résultats. Cette stratégie limite les erreurs humaines\nlà où l’impact est le plus élevé, tout en évitant une complexité excessive dès le départ.\n\nEn parallèle, la conception doit être alignée sur les exigences de Bonnes pratiques de fabrication et sur les\nattentes spécifiques aux produits stériles. Il faut donc planifier la qualification des équipements, la\nvalidation des systèmes et la documentation.\nLes premières actions sont : rédiger un cahier des charges des équipements et de l’automatisation,\nsélectionner des fournisseurs avec des critères d’acceptation clairs, puis établir un plan de mise en service\net de qualification. Avec cette approche, vous réduisez les risques de non-conformité, vous sécurisez le\ndémarrage et vous gardez une flexibilité pour vos nouveaux produits.\n\n5) Conseils de méthode (style “manuel”)\n1. Pour chaque réponse, gardez la même logique : besoin, recommandation, justification, action\nsuivante.\n2. Utilisez souvent le conditionnel : « il faudrait », « il serait préférable », « on pourrait ».\n3. Utilisez le subjonctif après : « il faut que », « il est important que », « il est essentiel que ».\n4. Ne listez pas trop : 3 idées fortes valent mieux que 10 idées faibles.\n5. Ajoutez toujours une phrase sur la gestion des risques : conformité, qualité, délais, coûts.\nSi vous envoyez le sample suivant, je conserve exactement la même structure pour que votre document\nfinal soit homogène.", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "case3", "titleFr": "ÉTUDE DE CAS 3: Déploiement d’un réseau de télécommunications en zones", "titleFa": "مطالعه‌ی موردی 3: استقرار شبکه‌ی مخابراتی در مناطق روستایی (مالزی)", "text": "ÉTUDE DE CAS 3: Déploiement d’un réseau de télécommunications en zones\nrurales (Malaisie)\n\n1) Contexte\nLa société SeleraLink Telecom (SLT) est une entreprise de télécommunications de taille moyenne en\nMalaisie. Elle fournit des services de téléphonie mobile, d’Internet haut débit et de données aux particuliers\net aux entreprises. Dans le cadre de sa croissance, SLT souhaite moderniser et étendre son réseau vers des\nzones rurales et sous-desservies, notamment dans l’intérieur du pays et certaines régions difficiles d’accès.\nLe projet inclut le déploiement d’infrastructures pour l’Internet mobile de nouvelle génération et la mise à\nniveau de la couverture dans des secteurs éloignés. Une équipe d’ingénieurs en télécommunications est\nmandatée pour concevoir, planifier et réaliser ce déploiement, tout en tenant compte des contraintes\ngéographiques, de l’accessibilité des sites, des exigences réglementaires locales et de la réalité économique\n(rentabilité plus lente en milieu rural).\n\n2) Partie 2 – Expression orale en groupe\n2.1 Objectif de la discussion\nÉchanger l’information, choisir une stratégie de déploiement réaliste et proposer des recommandations\nconcrètes (techniques, logistiques et organisationnelles).\n2.2 Structure de prise de parole (réutilisable)\n1. Besoin et contrainte principale\n2. Solution proposée\n3. Justification (qualité de service, coûts, délais)\n4. Risques et mesures de mitigation\n5. Prochaine étape\n\nFiche 1 – Évaluation des besoins et planification du réseau\na) Critères techniques et géographiques\n•   Relief et végétation : zones montagneuses, forêts denses, vallées (impact sur la propagation radio).\n•   Densité de population : villages dispersés, petites villes, axes de transport.\n•   Accessibilité : routes, ponts, saison des pluies, disponibilité d’énergie et de transport.\n•   Besoins en service : voix, données, services pour écoles/santé/entreprises.\n•   Niveau de performance visé : couverture, débit, latence, disponibilité.\n•   Maintenabilité : facilité d’intervention, sécurité des sites.\nb) Priorisation des régions (couverture, coûts, ROI)\n\n•   Prioriser les zones à forte utilité publique (santé, éducation, services essentiels).\n•   Commencer par les corridors (routes, centres locaux) pour créer une base de couverture.\n•   Déployer par phases : pilote, extension, optimisation.\n•   Utiliser des indicateurs simples : coût par site, coût par utilisateur couvert, difficulté d’accès.\n•   Réserver les sites extrêmes (très isolés) à une solution hybride ou à une phase ultérieure.\nc) Technologies recommandées (et pourquoi)\n•   Réseau mobile (4G/5G selon la stratégie) pour la couverture et la montée en capacité.\n•   Fibre optique quand c’est possible pour le transport (backhaul) et la stabilité.\n•   Faisceaux hertziens (micro-ondes) si la fibre est difficile ou trop coûteuse.\n•   Satellite pour les sites très isolés, en solution de dernier recours ou temporaire.\n•   Wi-Fi local (points communautaires) pour améliorer l’accès dans certains villages.\n\nFiche 2 – Conception du réseau\na) Infrastructures recommandées\n•   Stations de base (macro-cellules) pour une large couverture rurale.\n•   Antennes sectorielles et mâts adaptés au relief et à la portée souhaitée.\n•   Répéteurs ou petites cellules dans les zones d’ombre (vallées, bâtiments).\n•   Backhaul : fibre si disponible; sinon micro-ondes; sinon satellite selon le cas.\nb) Redondance (disponibilité, latence)\n•   Prévoir deux chemins de transport quand c’est possible (redondance).\n•   Sécuriser l’alimentation (batteries, génératrice, solutions hybrides si besoin).\n•   Mettre en place une supervision à distance et des alertes (pannes, performance).\n•   Standardiser les équipements pour accélérer la maintenance et réduire les erreurs.\nc) Compatibilité avec appareils actuels et futurs\n•   Choisir des équipements conformes aux standards de l’industrie (interopérabilité).\n•   Prévoir une architecture évolutive (mises à jour logicielles, ajout de capacité).\n•   Tester la compatibilité avec différents appareils et scénarios d’usage.\n•   Planifier une migration progressive (coexistence 4G/5G si applicable).\n\nFiche 3 – Défis géographiques et logistiques\na) Difficultés et moyens de les surmonter\n\nDifficultés possibles : accès difficile, saisons pluvieuses, délais de transport, sites isolés, pénurie de\ntechniciens                                                                                     localement.\nMesures :\n•    Planifier par saisons et sécuriser la logistique (stockage local, itinéraires).\n•    Utiliser des modules pré-assemblés pour réduire le temps sur site.\n•    Former des équipes locales et prévoir des contrats de maintenance régionaux.\n•    Créer une stratégie de pièces de rechange et d’intervention rapide.\nb) Sans fil vs filaire (avantages et inconvénients)\nSans fil (micro-ondes, satellite)\n•    Avantages : rapidité de déploiement, moins de travaux, utile en zones difficiles.\n•    Inconvénients : capacité parfois limitée, latence plus élevée (satellite), sensibilité météo.\nFilaire (fibre)\n•    Avantages : grande capacité, faible latence, bonne stabilité, durable.\n•    Inconvénients : coûts et délais plus élevés, travaux civils importants.\nApproche recommandée : choisir une solution hybride selon les zones.\nc) Intégration sans perturber le service existant\n•    Déploiement par étapes avec fenêtres de basculement planifiées.\n•    Tests avant mise en production, puis déploiement progressif.\n•    Plan de retour arrière en cas de problème.\n•    Coordination étroite avec les équipes d’exploitation.\n\nFiche 4 – Réglementations et normes locales\na) Points réglementaires à considérer (niveau général)\n•    Autorisations d’installation des sites et travaux civils.\n•    Licences et gestion des fréquences.\n•    Exigences environnementales et sécurité des installations.\n•    Exigences de cybersécurité et de protection des données.\nb) Gestion des interactions avec les autorités\n•    Identifier les autorités concernées et définir un calendrier d’approbation.\n•    Préparer un dossier standard (plans, sécurité, impacts, calendrier).\n•    Nommer un responsable conformité et tenir un registre des autorisations.\n•    Maintenir une communication régulière et documentée.\n\nc) Sécurité et protection des données (approche ingénieur)\n•   Concevoir une architecture sécurité : segmentation, contrôle d’accès, chiffrement.\n•   Mettre en place un programme de cybersécurité : mises à jour, tests, procédures.\n•   Former le personnel et appliquer des règles d’identités et d’accès.\n•   Vérifier la conformité des pratiques de données selon les exigences locales.\n\n3) Partie 3 – Expression écrite (environ 200 mots)\nSujet : coûts, rentabilité, formation et gestion du personnel\nPour réussir l’extension du réseau de SeleraLink Telecom en zones rurales, il faudrait d’abord estimer le\ncoût total du projet. Cette estimation devrait inclure les infrastructures, les équipements, la main-d’œuvre,\nles permis, ainsi que les coûts d’exploitation. Il serait préférable de préparer un budget par phases : étude,\nconception, achats, déploiement, mise en service et exploitation. Il est important qu’une contingence soit\nprévue, car l’accès aux sites isolés peut augmenter les coûts et les délais.\nPour le financement, l’entreprise pourrait comparer un financement interne à un modèle de partenariat. Un\npartenariat public-privé pourrait être envisagé si l’objectif inclut une amélioration de l’accès numérique\ndans des régions peu rentables à court terme. Le retour sur investissement devrait être calculé à partir du\nnombre d’utilisateurs, des revenus par service, de la croissance prévue et des coûts de maintenance. Il faut\nque l’analyse tienne compte d’un scénario prudent, car la rentabilité peut être progressive.\nEnfin, pour assurer l’exploitation, il serait nécessaire de recruter et de former des techniciens et des\ningénieurs localement. Une formation continue devrait être organisée afin que l’équipe reste à jour sur les\ntechnologies et la cybersécurité. Des partenariats avec des universités et des entreprises locales pourraient\naccélérer la montée en compétence.\n\n4) Partie 4 – Expression orale (plan + script)\nSujet : environnement, durabilité, évolutivité et défis futurs\nPlan (5 points)\n1. Impacts environnementaux possibles\n2. Mesures pour réduire l’impact\n3. Durabilité de l’exploitation\n4. Évolutivité du réseau\n5. Innovations et stratégie long terme\nScript modèle (adaptable)\nLe déploiement d’un réseau en zones rurales peut entraîner des impacts environnementaux, notamment\nl’utilisation des terres, la consommation d’énergie et la production de déchets électroniques. Il faudrait\nminimiser ces impacts par une sélection de sites responsable et par une conception qui limite les travaux\ninutiles. Il serait aussi important de réduire les déplacements de maintenance grâce à une supervision à\ndistance performante.\n\nPour assurer la durabilité, on pourrait privilégier des équipements sobres et, lorsque c’est possible, utiliser\ndes solutions énergétiques adaptées aux sites isolés. Il faut également mettre en place une gestion rigoureuse\ndes équipements en fin de vie : collecte, réutilisation, recyclage et traçabilité, afin de limiter l’impact\nenvironnemental.\nSur le plan technique, le réseau doit être évolutif. Il serait nécessaire de dimensionner le transport et la\ncapacité radio pour supporter l’augmentation du nombre d’utilisateurs et la croissance des usages,\nnotamment les objets connectés. À long terme, la maintenance en régions éloignées restera un défi; il est\nessentiel que des équipes locales soient formées et que les pièces critiques soient disponibles.\nEnfin, pour préparer l’avenir, la conception devrait permettre d’intégrer des évolutions comme la\nvirtualisation du réseau et l’utilisation d’outils d’analyse pour optimiser le trafic. Cette approche rendrait le\nréseau plus performant, durable et adaptable.\n\n5) Conseils (style manuel)\n1. Garder une structure constante : besoin, solution, justification, risque, prochaine étape.\n2. Utiliser le conditionnel pour recommander : il faudrait, il serait préférable, on pourrait.\n3. Utiliser le subjonctif après : il faut que, il est important que, il est essentiel que.\n4. Donner 2 ou 3 mesures fortes, puis expliquer comment les appliquer.\n5. Terminer avec une phrase sur la vérification : indicateurs, tests, supervision, audits.", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "case4", "titleFr": "ÉTUDE DE CAS 4: Construction d’un pont sur un grand fleuve au Québec", "titleFa": "مطالعه‌ی موردی 4: ساخت یک پل روی رودخانه‌ی بزرگ در کبک", "text": "ÉTUDE DE CAS 4: Construction d’un pont sur un grand fleuve au Québec\n\n1) Contexte\nLe ministère des Transports du Québec a confié à l’entreprise Horizon Infrastructures Québec (HIQ) la\nréalisation d’un nouveau pont reliant une grande ville de la région de Québec à une île habitée voisine. Le\nbut est d’améliorer la mobilité des résidents et de soutenir le développement économique régional.\nLe projet, estimé à environ 1,2 milliard de dollars, doit être livré en quatre ans. Le pont doit accueillir un\nimportant volume de véhicules et inclure des aménagements sécuritaires pour les piétons et les cyclistes.\nLa durée de vie visée est de 100 ans.\nLe site présente des contraintes majeures : largeur importante du cours d’eau, courants forts, variations\nsaisonnières du niveau d’eau, et zones de fondation complexes. Le projet se situe aussi près d’un milieu\nnaturel sensible, ce qui impose des exigences environnementales strictes. Enfin, les objectifs de budget et\nd’échéancier sont très serrés.\n\n2) Objectifs du projet\n1. Concevoir un pont sécuritaire, durable et adapté au paysage.\n2. Réduire au minimum l’impact environnemental pendant les travaux et sur le long terme.\n3. Respecter les coûts et les délais.\n4. Intégrer des solutions techniques robustes pour les conditions climatiques et géotechniques.\n\n3) Principaux enjeux (résumé)\n•   Géotechnique et hydrologie : sols variables, fondations difficiles, courants, glace, variations du\nniveau d’eau.\n•   Environnement : protection de l’eau, de la faune et de la flore, contrôle des rejets et des sédiments.\n•   Sécurité : sécurité des travailleurs et des usagers, gestion de chantier en conditions difficiles.\n•   Coûts et délais : risques de retard (météo), logistique complexe, contrôle budgétaire.\n\nPartie 2 – Expression orale en groupe (discussion)\n2.1 Objectif\nAnalyser les risques, choisir une approche technique, et proposer un plan de gestion du projet, de la sécurité\net de l’environnement.\n2.2 Structure de prise de parole (réutilisable)\n1. Constat (le problème principal)\n2. Recommandation (solution)\n3. Justification (pourquoi)\n\n4. Risques (ce qui peut mal aller)\n5. Mesures (comment limiter ces risques)\n\nFiche 1 – Planification et gestion des risques\na) Méthode de gestion de projet recommandée\nRecommandation : une gestion par phases (approche “cascade” structurée), avec jalons formels.\nPourquoi :\n•   Grand projet d’infrastructure avec exigences strictes, autorisations, ingénierie détaillée.\n•   Forte dépendance entre étapes (conception, appels d’offres, fondations, tablier).\n•   Besoin d’un contrôle clair sur coûts, qualité, sécurité et environnement.\nb) Risques techniques liés au site et mesures\nRisques principaux :\n•   Fondations complexes, instabilité locale, érosion, affouillement.\n•   Courants forts, glace, variations de niveau d’eau.\n•   Conditions météo : vents, gel, tempêtes.\nMesures :\n•   Campagne géotechnique détaillée et modélisation.\n•   Choix de fondations adaptées (pieux/caissons selon résultats).\n•   Plan de travaux saisonnier et méthodes de protection du chantier.\n•   Surveillance continue (capteurs, inspections, suivi hydrologique).\nc) Stratégie de gestion des risques environnementaux\n•   Plan de protection de l’eau (contrôle des sédiments, barrières, zones de confinement).\n•   Limiter les travaux en périodes sensibles (ex. reproduction ou migration).\n•   Procédures strictes pour carburants et produits (stockage, prévention des fuites).\n•   Suivi environnemental et rapports réguliers aux autorités.\nd) Plan de gestion de la sécurité\n•   Analyse de risques chantier (travail en hauteur, levage, navigation, coactivité).\n•   Procédures obligatoires, permis de travail, formations ciblées.\n•   Inspections sécurité quotidiennes et audits réguliers.\n•   Plan d’urgence (chute, noyade, incendie, conditions météo) et exercices.\n\nFiche 2 – Conception et choix des matériaux\n\na) Propriétés essentielles des matériaux\n•   Résistance à la corrosion (sels de déglaçage, humidité).\n•   Résistance au gel-dégel et aux cycles thermiques.\n•   Résistance à la fatigue (trafic important) et durabilité à long terme.\n•   Facilité d’entretien et réparabilité.\n•   Performance mécanique adaptée (rigidité, résistance).\nb) Pont suspendu vs pont à haubans (comparaison simple)\nPont                                                                                             suspendu\nAvantages : adapté aux très grandes portées; bonne solution si grands dégagements requis.\nInconvénients : système complexe; sensibilité au vent; coûts souvent plus élevés; entretien important.\nPont                                             à                                              haubans\nAvantages : très performant pour grandes portées; structure rigide; construction souvent plus rapide par\nsegments.\nInconvénients : conception des haubans et ancrages exigeante; maintenance des câbles.\nRecommandation possible (à argumenter) : souvent, un pont à haubans est un bon compromis pour une\ngrande traversée avec contraintes de délais, si le site s’y prête.\nc) Intégration de solutions écologiques\n•   Béton à plus faible empreinte (substituts cimentaires) et matériaux recyclés quand possible.\n•   Optimisation de la quantité de matériaux (conception efficiente).\n•   Plan de gestion énergétique du chantier (réduction carburant, logistique optimisée).\n•   Gestion des eaux de ruissellement et protection des rives.\nd) Tests et validations pour conditions extrêmes\n•   Études de vent (soufflerie ou simulation) et vérifications dynamiques.\n•   Validation gel-dégel, corrosion, fatigue, durabilité.\n•   Essais de matériaux et contrôles qualité sur site.\n•   Plan d’inspection et de maintenance basé sur la durée de vie.\n\nFiche 3 – Construction et gestion des délais\na) Outils de suivi recommandés\n•   Échéancier détaillé (diagramme de Gantt) avec chemin critique.\n•   Indicateurs : avancement, coûts, risques, non-conformités.\n•   Réunions de coordination hebdomadaires et tableau de suivi des actions.\nb) Gestion des ressources pour optimiser coûts et délais\n•   Plan de mobilisation des équipes selon les phases.\n\n•   Plan d’approvisionnement et de logistique (matériaux, équipements).\n•   Standardisation des méthodes et préfabrication si possible.\n•   Gestion des changements (validation rapide, traçabilité).\nc) Stratégies en cas de retard (météo extrême)\n•   Replanification basée sur le chemin critique.\n•   Travaux alternatifs (activités en atelier, préfabrication).\n•   Augmentation temporaire des ressources sur tâches critiques.\n•   Ajustement du calendrier selon saisons, avec marges de contingence.\n\nFiche 4 – Impact environnemental et normes\na) Étude d’impact : approche et mesures préventives\n•   Inventaire des milieux (eau, faune, flore, habitats).\n•   Analyse des impacts par phase (construction et exploitation).\n•   Mesures : contrôle sédiments, gestion des rejets, prévention des fuites, zones protégées.\nb) Systèmes de surveillance continue\n•   Suivi de la qualité de l’eau (turbidité, contaminants) et des sédiments.\n•   Suivi du bruit, des émissions et des déchets.\n•   Inspections environnementales planifiées, avec rapports.\nc) Gestion d’un désaccord avec les autorités\n•   Documenter les faits et comparer aux exigences.\n•   Proposer un plan correctif mesurable (mesures renforcées, modifications méthode).\n•   Ajuster la séquence des travaux si nécessaire.\n•   Maintenir une communication structurée et transparente.\n\nPartie 3 – Expression écrite (environ 200 mots)\nSujet : recommandations professionnelles (synthèse des fiches)\nPour ce projet de pont, il faudrait adopter une gestion par phases avec des jalons clairs, car les risques\ntechniques et environnementaux sont élevés. D’abord, en raison des conditions du site, il est essentiel que\nl’étude géotechnique soit approfondie et que la conception des fondations tienne compte des courants et\ndes variations saisonnières. Il serait important de prévoir une surveillance continue pendant les travaux afin\nde détecter rapidement tout problème de sol ou d’affouillement.\nEnsuite, le choix des matériaux doit viser une durée de vie de 100 ans. Il serait préférable d’utiliser des\nsolutions résistantes à la corrosion et au gel-dégel, et de définir un plan d’entretien dès la conception.\n\nConcernant le type de pont, on devrait comparer les options techniques selon la portée, le vent, la\nconstructibilité et les délais.\nSur le plan environnemental, il faut que des mesures strictes soient mises en place pour éviter la pollution\nde l’eau, notamment le contrôle des sédiments et la prévention des fuites. Un système de suivi\nenvironnemental devrait être maintenu tout au long du chantier.\nEnfin, pour respecter l’échéancier, un suivi de type Gantt et une gestion serrée des ressources seraient\nnécessaires. En cas de météo extrême, il faudrait adapter le plan de travaux et prioriser les activités du\nchemin critique.\n\nPartie 4 – Expression orale individuelle (10 minutes)\nSujet : recommandations au client pour réussir le projet\nPlan (5 points)\n1. Résumer le besoin et les contraintes\n2. Risques techniques et mesures principales\n3. Environnement : prévention et surveillance\n4. Sécurité : règles chantier et contrôles\n5. Délais et budget : méthode de suivi et actions en cas d’écart\nScript modèle (adaptable)\nCe projet vise à construire un pont durable et sécuritaire, tout en respectant un budget et un échéancier\nstricts. À mon avis, la priorité est de réduire les risques liés au site, notamment les fondations et les\nconditions hydrologiques. Il faut que l’étude géotechnique soit complète et que la conception des fondations\nsoit validée par des analyses et des essais. Pendant la construction, une surveillance continue est nécessaire\npour contrôler l’affouillement et les conditions de travail.\nSur le plan environnemental, il est essentiel de protéger la qualité de l’eau et les écosystèmes. Il faudrait\nmettre en place un contrôle des sédiments, des procédures strictes pour les produits pétroliers et un suivi\nrégulier avec des indicateurs mesurables. En cas de non-conformité, il serait préférable de corriger\nrapidement les méthodes de travail et de documenter les actions.\nLa sécurité doit être gérée au quotidien : formations, procédures, inspections, et plan d’urgence. Enfin, pour\nrespecter les délais, on devrait suivre le chemin critique, contrôler les changements et prévoir des stratégies\nd’adaptation en cas de météo défavorable. Cette approche permettrait de livrer un pont fiable, conforme et\ndurable.\n\nConseils (style manuel)\n1. Toujours répondre avec la même logique : risque, mesure, justification, suivi.\n2. Utiliser le conditionnel pour recommander et rester professionnel.\n3. Utiliser le subjonctif après “il faut que”, “il est essentiel que”, “il est important que”.\n4. Donner des solutions concrètes et mesurables (surveillance, indicateurs, inspections).", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "case5", "titleFr": "ÉTUDE DE CAS 5: Programme d’eau potable pour plusieurs villages et réseau", "titleFa": "مطالعه‌ی موردی 5: برنامه‌ی آب آشامیدنی برای چند روستا و شبکه‌ی توزیع", "text": "ÉTUDE DE CAS 5: Programme d’eau potable pour plusieurs villages et réseau\nde distribution\n\n1) Contexte\nDans la province rurale de Lantéa, au sein du pays d’Arbina, plusieurs villages n’ont pas un accès fiable à\nl’eau potable. La population totale est modeste et répartie sur de petits noyaux d’habitation. Les familles\nutilisent surtout l’eau de surface (cours d’eau, mares, petites sources), dont la qualité varie selon la saison.\nDes épisodes de contamination sont signalés et entraînent des problèmes de santé, surtout chez les enfants.\nPour améliorer la situation, le Conseil local de l’eau et du développement a décidé de financer un projet\nd’approvisionnement en eau potable. Le projet prévoit la réalisation de quatre forages équipés de pompes,\nl’installation d’un réseau de conduites reliant les points de production, et la mise en place de points de\ndistribution publics dans chaque village (bornes-fontaines). Le projet doi
