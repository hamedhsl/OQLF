 spécifiques. Il faut que la stratégie financière\nsoit transparente et que le centre puisse couvrir une partie de ses coûts par des activités, des abonnements\net la location d’espaces pour événements.\n\n6) Conseils (style manuel)\n1. Garder une structure constante : besoin, solution, justification, contrôle.\n2. Utiliser le conditionnel : il faudrait, il serait préférable, on pourrait.\n3. Utiliser le subjonctif après : il faut que, il est important que, il est essentiel que.\n4. Mettre en avant l’accessibilité, la sécurité et les coûts d’exploitation (pas seulement la\nconstruction).\n5. Conclure par la vérification : indicateurs d’usage, coûts réels, plan de maintenance, satisfaction des\nusagers.", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "model1", "titleFr": "Modèle 1-General", "titleFa": "مدل 1: الگوی عمومی (۴ پاراگراف)", "text": "Modèle 1-General\nParagraphe 1 – Contexte et objectif (2–3 phrases)\n\nDans le cadre de [PROJET / SITUATION], l’objectif est de [OBJECTIF PRINCIPAL : réduire les incidents\n/ améliorer la performance / assurer la conformité / protéger la santé / etc.]. Il faudrait que [ACTEUR\nPRINCIPAL : l’équipe / la direction / la municipalité] adopte une approche structurée afin de [RÉSULTAT\nATTENDU]. Les contraintes principales sont [2 CONTRAINTES : budget, délais, sécurité, environnement,\nacceptabilité, continuité des opérations].\nParagraphe 2 – Mesures techniques (3–5 phrases)\n\nD’abord, il serait préférable de [MESURE 1] afin de [EFFET 1]. Il est important que [EXIGENCE\nTECHNIQUE en subjonctif] (ex. les équipements soient vérifiés / la qualité soit contrôlée / les risques\nsoient réduits). Ensuite, on pourrait [MESURE 2] pour [EFFET 2]. Enfin, il faudrait [MESURE 3] dans les\nzones / étapes critiques, car [JUSTIFICATION COURTE].\nParagraphe 3 – Gestion, risques et conformité (3–5 phrases)\n\nSur le plan de la gestion, il serait nécessaire de [ACTION GESTION : planifier / prioriser / définir\nresponsabilités / formation / maintenance]. Il faut que [PROCÉDURE / SUIVI en subjonctif] (ex. les\ninspections soient réalisées / les actions correctives soient suivies / la documentation soit à jour). Pour\nlimiter les risques, on devrait prévoir [2 RISQUES] et mettre en place [MESURES DE CONTRÔLE :\nconfinement, redondance, plan de sécurité, etc.]. Cette démarche faciliterait aussi le respect des normes et\ndes exigences applicables.\nParagraphe 4 – Vérification et conclusion (2–3 phrases)\n\nL’efficacité des mesures pourrait être évaluée par [3 INDICATEURS : baisse des incidents, consommation,\nplaintes, qualité, délais, coûts, audits]. Il est essentiel que le suivi soit maintenu après la mise en service,\nafin que les problèmes soient détectés rapidement. En appliquant ces recommandations, [BÉNÉFICE\nFINAL] et le projet sera plus [qualité : fiable / sécuritaire / durable / rentable].", "kind": "template", "groupFa": "مدل‌های نگارش (۸ مدل)"}, {"id": "model2", "titleFr": "Modèle 2 – « Problème → Causes → Solutions → Suivi »", "titleFa": "مدل 2: مشکل → علت‌ها → راه‌حل‌ها → پیگیری", "text": "Modèle 2 – « Problème → Causes → Solutions → Suivi »\nParagraphe 1 – Problème et impacts\nLa situation concerne [PROJET / LIEU / ORGANISATION] où l’on observe [PROBLÈME\nPRINCIPAL]. Cette situation entraîne [IMPACT 1] et [IMPACT 2]. Il faudrait que [ACTEUR]\nintervienne rapidement afin de [OBJECTIF], tout en respectant [CONTRAINTE 1] et [CONTRAINTE\n2].\nParagraphe 2 – Causes probables et vérifications\nLes causes possibles sont [CAUSE 1], [CAUSE 2] et [CAUSE 3]. Il serait important de confirmer ces\ncauses par [TEST / MESURE 1] et [TEST / MESURE 2]. Il faut que [DONNÉES / OBSERVATIONS\n– subjonctif] afin d’orienter correctement les actions.\nParagraphe 3 – Solutions (priorisées)\nEn priorité, il serait préférable de [SOLUTION 1] pour [EFFET]. Ensuite, on pourrait [SOLUTION 2]\nafin de [EFFET]. Enfin, il faudrait [SOLUTION 3] pour stabiliser la situation à long terme. Il est essentiel\nque [CONDITION DE SUCCÈS – subjonctif] (ex. les procédures soient respectées / le système soit\najusté).\nParagraphe 4 – Suivi et conclusion\nPour vérifier l’efficacité, on devrait suivre [INDICATEUR 1], [INDICATEUR 2] et [INDICATEUR 3].\nIl faut que [PLAN DE SUIVI – subjonctif] et que [RESPONSABILITÉS – subjonctif]. En appliquant\nces mesures, [BÉNÉFICE] et la solution sera [QUALITÉ].", "kind": "template", "groupFa": "مدل‌های نگارش (۸ مدل)"}, {"id": "model3", "titleFr": "Modèle 3 – « Options + recommandation » (comparatif simple)", "titleFa": "مدل 3: گزینه‌ها + توصیه (مقایسه‌ی ساده)", "text": "Modèle 3 – « Options + recommandation » (comparatif simple)\nParagraphe 1 – Contexte et besoin\nDans le cadre de [PROJET], il faut répondre à [BESOIN PRINCIPAL] tout en tenant compte de\n[CONTRAINTE 1] et [CONTRAINTE 2]. L’objectif est de [OBJECTIF]. Il serait préférable d’évaluer\nplusieurs options avant de décider.\nParagraphe 2 – Option A (forces / limites)\nUne première option serait [OPTION A]. Cette option permettrait de [AVANTAGE 1] et de [AVANTAGE\n2]. Toutefois, elle présente des limites : [LIMITE 1] et [LIMITE 2]. Il est important que [CONDITION\n– subjonctif] pour que cette option soit acceptable.\nParagraphe 3 – Option B (forces / limites) + recommandation\nUne deuxième option serait [OPTION B]. Elle pourrait offrir [AVANTAGE 1] et réduire [RISQUE /\nCOÛT]. Cependant, elle exige [EXIGENCE 1] et [EXIGENCE 2]. Dans ce contexte, je recommanderais\n[OPTION CHOISIE], car [JUSTIFICATION COURTE]. Il faut que [ACTION CLÉ – subjonctif] dès\nle départ.\nParagraphe 4 – Mise en œuvre et suivi\nLa mise en œuvre devrait inclure [ÉTAPE 1], [ÉTAPE 2] et [ÉTAPE 3]. L’efficacité pourrait être évaluée\npar [INDICATEUR 1], [INDICATEUR 2] et [INDICATEUR 3]. Il est essentiel que le suivi soit maintenu\nafin que [CORRECTIONS – subjonctif] si nécessaire.", "kind": "template", "groupFa": "مدل‌های نگارش (۸ مدل)"}, {"id": "model4", "titleFr": "Modèle 4 – Plan d’action en phases (court / moyen / long terme)", "titleFa": "مدل 4: برنامه‌ی اقدام مرحله‌ای (کوتاه/میان/بلندمدت)", "text": "Modèle 4 – Plan d’action en phases (court / moyen / long terme)\nParagraphe 1 – Contexte et objectif\nDans le cadre de [PROJET / SITUATION], l’objectif est de [OBJECTIF] tout en respectant\n[CONTRAINTE 1] et [CONTRAINTE 2]. Il faudrait que [ACTEUR] adopte une démarche par phases\nafin de [RÉSULTAT ATTENDU].\nParagraphe             2           –        Court     terme         (actions     immédiates)\nÀ court terme, il serait préférable de [ACTION 1 IMMÉDIATE] et de [ACTION 2 IMMÉDIATE] afin\nde [EFFET COURT TERME]. Il est important que [MESURE DE SÉCURITÉ/CONTRÔLE –\nsubjonctif]. On devrait aussi [VÉRIFICATION / MESURE] pour confirmer [CAUSE / SITUATION].\nParagraphe      3     –       Moyen    terme   (mise      en    œuvre   principale)\nÀ moyen terme, on pourrait [ACTION PRINCIPALE 1] puis [ACTION PRINCIPALE 2] afin de\n[EFFET MOYEN TERME]. Il faut que [PROCÉDURE / QUALITÉ – subjonctif] et que\n[RESPONSABILITÉS – subjonctif]. Cette phase devrait inclure [TEST / FORMATION /\nDOCUMENTATION].\nParagraphe           4         –         Long     terme     (prévention     et    suivi)\nÀ long terme, il faudrait mettre en place [MAINTENANCE / GOUVERNANCE / SURVEILLANCE]\npour éviter [RISQUE DE RÉCIDIVE]. L’efficacité pourrait être suivie par [INDICATEUR 1],\n[INDICATEUR 2] et [INDICATEUR 3]. Il est essentiel que [SUIVI – subjonctif] afin que\n[AMÉLIORATIONS – subjonctif] si nécessaire.", "kind": "template", "groupFa": "مدل‌های نگارش (۸ مدل)"}, {"id": "model5", "titleFr": "Modèle 5 – Risques et mesures de mitigation", "titleFa": "مدل 5: ریسک‌ها و اقدامات کاهش‌دهنده", "text": "Modèle 5 – Risques et mesures de mitigation\nParagraphe 1 – Contexte et besoin\nLe projet concerne [PROJET / SITUATION] et vise à [OBJECTIF]. Cependant, il comporte plusieurs\nrisques qui pourraient affecter [SÉCURITÉ / QUALITÉ / DÉLAIS / BUDGET / ENVIRONNEMENT].\nIl faudrait que [ACTEUR] identifie et traite ces risques dès la planification.\nParagraphe 2 – Risques principaux (2 à 4)\nLes risques principaux sont [RISQUE 1], [RISQUE 2] et [RISQUE 3]. Ces risques peuvent entraîner\n[CONSÉQUENCE 1] et [CONSÉQUENCE 2]. Il est important que [ANALYSE/ÉTUDE – subjonctif]\nafin de confirmer les points critiques.\nParagraphe 3 – Mesures de mitigation\nPour limiter [RISQUE 1], il serait préférable de [MESURE 1]. Pour [RISQUE 2], on pourrait [MESURE\n2] et [MESURE 3]. Enfin, il faudrait [MESURE 4] afin de réduire [RISQUE 3]. Il faut que\n[PROCÉDURES – subjonctif] et que [FORMATION/CONTRÔLE – subjonctif].\nParagraphe 4 – Suivi et conclusion\nLe suivi devrait inclure [INSPECTIONS / AUDITS / INDICATEURS]. L’efficacité des mesures pourrait\nêtre évaluée par [INDICATEUR 1], [INDICATEUR 2] et [INDICATEUR 3]. En appliquant cette\napproche, le projet sera [QUALITÉ] et les risques seront mieux maîtrisés.", "kind": "template", "groupFa": "مدل‌های نگارش (۸ مدل)"}, {"id": "model6", "titleFr": "Modèle 6 – Parties prenantes et communication", "titleFa": "مدل 6: ذی‌نفعان و ارتباطات", "text": "Modèle 6 – Parties prenantes et communication\nParagraphe 1 – Contexte et enjeux humains\nDans ce dossier, [PROJET / SITUATION] affecte [PARTIES PRENANTES : employés, citoyens,\nclients, autorités, etc.]. L’objectif est de [OBJECTIF], mais il faut aussi gérer l’acceptation et la\ncommunication. Il serait nécessaire que [ACTEUR] adopte un plan de communication clair.\nParagraphe 2 – Parties prenantes et besoins d’information\nLes parties prenantes principales sont [GROUPE 1], [GROUPE 2] et [GROUPE 3]. Chacune a des\nattentes : [ATTENTE 1], [ATTENTE 2], [ATTENTE 3]. Il est important que [INFORMATION –\nsubjonctif] et que [CANAL/FRÉQUENCE – subjonctif].\nParagraphe 3 – Actions de communication et gestion des préoccupations\nOn devrait communiquer [MESSAGE CLÉ 1] et [MESSAGE CLÉ 2], ainsi que le calendrier\n[CALENDRIER]. Il faudrait prévoir [MÉCANISME : point de contact, réunions, affichage, FAQ] pour\nrecueillir les questions. En cas de préoccupations, il serait préférable de [ACTION : expliquer, ajuster,\ndocumenter]. Il faut que [MESURES DE SÉCURITÉ/QUALITÉ – subjonctif] pour rassurer les\nusagers.\nParagraphe 4 – Vérification et conclusion\nL’efficacité du plan pourrait être évaluée par [INDICATEUR : plaintes, participation, satisfaction]. Il\nest essentiel que [SUIVI – subjonctif] afin que [CORRECTIONS – subjonctif] si nécessaire. Cette\napproche améliorerait la confiance et faciliterait la mise en œuvre du projet.", "kind": "template", "groupFa": "مدل‌های نگارش (۸ مدل)"}, {"id": "model7", "titleFr": "Modèle 7 – ROI / budget / financement", "titleFa": "مدل 7: بازگشت سرمایه / بودجه / تأمین مالی", "text": "Modèle 7 – ROI / budget / financement\nParagraphe 1 – Contexte et objectif financier\nDans le cadre de [PROJET / SITUATION], l’objectif est de [OBJECTIF TECHNIQUE] tout en\nmaîtrisant [BUDGET / COÛTS]. Il faudrait que [ACTEUR : organisation / ville / direction] établisse\nune analyse financière afin de comparer les options et de sécuriser la rentabilité à long terme.\nParagraphe 2 – Estimation des coûts (CAPEX / OPEX)\nLe coût total devrait inclure [COÛT 1 : équipements], [COÛT 2 : installation], [COÛT 3 : tests / mise\nen service] et [COÛT 4 : maintenance]. Il est important que [LES POSTES DE COÛTS – subjonctif]\n(ex. les coûts soient détaillés / les hypothèses soient documentées). On devrait aussi prévoir\n[CONTINGENCE / IMPRÉVUS] pour tenir compte de [RISQUE FINANCIER].\nParagraphe 3 – Modèle de financement et ROI\nPour le financement, on pourrait envisager [OPTION A : financement interne] ou [OPTION B :\npartenariat / subvention / PPP]. Le retour sur investissement pourrait être estimé à partir de\n[ÉCONOMIE 1], [ÉCONOMIE 2] et [BÉNÉFICE NON FINANCIER : fiabilité, conformité, image].\nIl faut que [L’ANALYSE – subjonctif] inclue un scénario prudent, car [INCERTITUDE : prix,\nrendement, demande].\nParagraphe 4 – Suivi et décision\nLa décision devrait se baser sur [CRITÈRES <script>
const DATA = JSON.parse(document.getElementById('chapter-data').textContent);

const PARTS = [
  {id:'part1', label:'واژگان تخصصی', sub:'۲۱ فصل'},
  {id:'part2', label:'دستور زبان', sub:'۱۴ مبحث'},
  {id:'part3', label:'آمادگی آزمون', sub:'ساختار، عبارات، مطالعات موردی'},
];

let currentPart = 'part1';
let currentChapterId = DATA.part1[0].id;
let currentSub = 'terms';

const speakerIcon = `<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4Z"/></svg>`;

/* ---------- speech ---------- */
let frenchVoice = null;
function pickFrenchVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  frenchVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr-fr'))
    || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr'))
    || null;
}
if('speechSynthesis' in window){
  pickFrenchVoice();
  window.speechSynthesis.onvoiceschanged = pickFrenchVoice;
}
function playAudio(text, btn){
  document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing'));
  if(!('speechSynthesis' in window)){
    alert('مرورگر شما از پخش صوتی تلفظ پشتیبانی نمی‌کند.');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'fr-FR';
  if(frenchVoice) utter.voice = frenchVoice;
  utter.rate = 0.92;
  utter.pitch = 1;
  if(btn) btn.classList.add('playing');
  utter.onend = () => { if(btn) btn.classList.remove('playing'); };
  utter.onerror = () => { if(btn) btn.classList.remove('playing'); };
  window.speechSynthesis.speak(utter);
}
function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

/* ---------- stats badges ---------- */
function renderStats(){
  const v = DATA.part1, g = DATA.part2, e = DATA.part3;
  const terms = v.reduce((s,c)=>s+c.terms.length,0);
  const verbs = v.reduce((s,c)=>s+c.verbs.length,0);
  const exprs = v.reduce((s,c)=>s+c.exprs.length,0);
  document.getElementById('stat-badges').innerHTML = `
    <span class="badge">${v.length} فصل واژگان</span>
    <span class="badge">${terms} واژه</span>
    <span class="badge">${verbs} فعل</span>
    <span class="badge">${g.length} مبحث گرامر</span>
    <span class="badge">${e.filter(x=>x.kind==='reading').length} متن آمادگی</span>
    <span class="badge">🔊 audio</span>
  `;
}
renderStats();

/* ---------- part tabs ---------- */
const partTabsEl = document.getElementById('part-tabs');
const mobilePartSelect = document.getElementById('mobile-part-select');
PARTS.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'part-tab' + (p.id===currentPart ? ' active' : '');
  btn.dataset.id = p.id;
  btn.textContent = p.label;
  btn.addEventListener('click', () => selectPart(p.id));
  partTabsEl.appendChild(btn);

  const opt = document.createElement('option');
  opt.value = p.id; opt.textContent = p.label;
  mobilePartSelect.appendChild(opt);
});
mobilePartSelect.addEventListener('change', () => selectPart(mobilePartSelect.value));

function selectPart(partId){
  currentPart = partId;
  currentChapterId = DATA[partId][0].id;
  currentSub = 'terms';
  document.querySelectorAll('.part-tab').forEach(b => b.classList.toggle('active', b.dataset.id === partId));
  mobilePartSelect.value = partId;
  document.getElementById('searchbar').style.display = (partId === 'part1') ? 'flex' : 'none';
  document.getElementById('search').value = '';
  document.getElementById('search-view').style.display = 'none';
  document.getElementById('chapter-view').style.display = 'block';
  renderNav();
  renderChapter();
}

/* ---------- sidebar nav ---------- */
const chapterNav = document.getElementById('chapter-nav');
const mobileSelect = document.getElementById('mobile-select');

function renderNav(){
  chapterNav.innerHTML = '';
  mobileSelect.innerHTML = '';
  const chapters = DATA[currentPart];
  let lastGroup = null;
  chapters.forEach((c, i) => {
    const grp = c.groupFa || null;
    if(grp && grp !== lastGroup){
      const label = document.createElement('div');
      label.className = 'nav-group-label';
      label.textContent = grp;
      chapterNav.appendChild(label);
      lastGroup = grp;
    }
    const btn = document.createElement('button');
    btn.className = 'chap-btn' + (c.id===currentChapterId ? ' active' : '');
    btn.dataset.id = c.id;
    const numLabel = c.kind === 'vocab' || c.kind === 'grammar' ? String(i+1).padStart(2,'0') : '';
    btn.innerHTML = `<span>${c.titleFa}</span>${numLabel ? `<span class="num">${numLabel}</span>` : ''}`;
    btn.addEventListener('click', () => selectChapter(c.id));
    chapterNav.appendChild(btn);

    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.titleFa;
    mobileSelect.appendChild(opt);
  });
  mobileSelect.value = currentChapterId;
}
mobileSelect.addEventListener('change', () => selectChapter(mobileSelect.value));

function selectChapter(id){
  currentChapterId = id;
  currentSub = 'terms';
  document.querySelectorAll('.chap-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  mobileSelect.value = id;
  renderChapter();
}

/* ---------- main render dispatcher ---------- */
function renderChapter(){
  const c = DATA[currentPart].find(x => x.id === currentChapterId);
  const view = document.getElementById('chapter-view');
  let html = `<div class="chap-header">
      <div class="fa-title">${c.titleFa}</div>
      ${c.titleFr ? `<div class="fr-title">${c.titleFr}</div>` : ''}
    </div>`;

  if(c.kind === 'vocab') html += renderVocab(c);
  else if(c.kind === 'grammar') html += renderGrammar(c);
  else if(c.kind === 'info') html += renderInfo(c);
  else if(c.kind === 'phrases') html += renderPhrases(c);
  else if(c.kind === 'conjugation') html += renderConjugation(c);
  else if(c.kind === 'reading' || c.kind === 'template') html += renderReading(c);

  view.innerHTML = html;
  attachHandlers(view, c);
}

/* ---------- vocab ---------- */
function renderVocab(c){
  let html = `<div class="subtabs">
      <button class="subtab ${currentSub==='terms'?'active':''}" data-sub="terms">واژگان<span class="n">${c.terms.length}</span></button>
      <button class="subtab ${currentSub==='verbs'?'active':''}" data-sub="verbs">افعال<span class="n">${c.verbs.length}</span></button>
      <button class="subtab ${currentSub==='exprs'?'active':''}" data-sub="exprs">عبارات<span class="n">${c.exprs.length}</span></button>
    </div>`;

  if(currentSub === 'terms'){
    html += c.terms.length ? `<div class="chipwrap">` + c.terms.map(t =>
      `<button class="chip" data-text="${escAttr(t[0])}"><span class="chip-fr">${t[0]}</span><span class="chip-sep">·</span><span class="chip-fa">${t[1]}</span></button>`
    ).join('') + `</div>` : `<div class="empty-state">واژه‌ای ثبت نشده.</div>`;
  } else if(currentSub === 'verbs'){
    html += c.verbs.length ? `<div class="tablecard"><table><thead><tr>
        <th class="verb-h">Verbe / معنی</th><th class="ex-h">مثال</th><th class="audio-h">تلفظ</th>
      </tr></thead><tbody>` + c.verbs.map(v => `
        <tr>
          <td><div class="word-fr">${v[0]}</div><div class="word-fa">${v[1]}</div></td>
          <td><div class="ex-fr">${v[2]}</div></td>
          <td class="audio-cell"><button class="speak-btn" data-text="${escAttr(v[2])}" title="پخش تلفظ">${speakerIcon}</button></td>
        </tr>`).join('') + `</tbody></table></div>` : `<div class="empty-state">فعلی ثبت نشده.</div>`;
  } else if(currentSub === 'exprs'){
    html += c.exprs.length ? `<div class="expr-list">` + c.exprs.map(e => `
        <div class="expr-row">
          <div class="txt">
            <div class="expr-fr">${e[0]}</div>
            <div class="word-fa" style="margin:2px 0 4px;">${e[1]}</div>
            <div class="expr-ex">${e[2]}</div>
          </div>
          <button class="speak-btn" data-text="${escAttr(e[2])}" title="پخش تلفظ">${speakerIcon}</button>
        </div>`).join('') + `</div>` : `<div class="empty-state">عبارتی ثبت نشده.</div>`;
  }
  return html;
}

/* ---------- grammar ---------- */
function renderGrammar(c){
  let html = c.sections.map(s => `
    <div class="grammar-card">
      <div class="grammar-rule-fr">${s.rule_fr}</div>
      <div class="grammar-rule-fa">${s.rule_fa}</div>
      ${s.examples && s.examples.length ? `<div class="grammar-examples">` + s.examples.map(ex => `
        <div class="grammar-example">
          <button class="speak-btn" data-text="${escAttr(ex[0])}" title="پخش تلفظ">${speakerIcon}</button>
          <div class="txt"><div class="fr">${ex[0]}</div><div class="fa">${ex[1]}</div></div>
        </div>`).join('') + `</div>` : ''}
    </div>`).join('');

  if(c.exercises && c.exercises.length){
    html += `<div class="section-heading">تمرین و پاسخ</div>`;
    html += c.exercises.map((ex,i) => `
      <div class="exercise-item">
        <div class="exercise-q">${i+1}. ${ex[0]}</div>
        <button class="exercise-toggle" data-idx="${i}">نمایش پاسخ ▾</button>
        <div class="exercise-answer" id="ans-${c.id}-${i}">${ex[1]}</div>
      </div>`).join('');
  }
  return html;
}

/* ---------- info (exam structure) ---------- */
function renderInfo(c){
  return c.parts.map(p => `
    <div class="info-card">
      <div class="part-title">${p.part}</div>
      <div class="part-fr">${p.fr}</div>
      <div class="part-desc">${p.desc}</div>
      <ul>${p.points.map(pt => `<li>${pt}</li>`).join('')}</ul>
    </div>`).join('');
}

/* ---------- phrases ---------- */
function renderPhrases(c){
  return c.categories.map(cat => `
    <div class="phrase-cat">
      <div class="phrase-cat-title">${cat.catFa} <span class="fr">${cat.cat}</span></div>
      <div class="expr-list">${cat.items.map(it => `
        <div class="expr-row">
          <div class="txt"><div class="expr-fr">${it[0]}</div><div class="word-fa" style="margin-top:3px;">${it[1]}</div></div>
          <button class="speak-btn" data-text="${escAttr(it[0])}" title="پخش تلفظ">${speakerIcon}</button>
        </div>`).join('')}</div>
    </div>`).join('');
}

/* ---------- conjugation ---------- */
function renderConjugation(c){
  return `<div class="chipwrap" style="margin-bottom:12px;"></div>` +
    c.rows.map(r => `
    <div class="conj-card">
      <div class="conj-top">
        <div><span class="conj-verb">${r[0]}</span> <span class="conj-meaning">— ${r[5]}</span></div>
        <button class="speak-btn" data-text="${escAttr(r[0])}" title="پخش تلفظ">${speakerIcon}</button>
      </div>
      <div class="conj-rows">
        <div class="conj-row"><b>اسم:</b>${r[1]}</div>
        <div class="conj-row"><b>حال:</b>${r[2]}</div>
        <div class="conj-row"><b>التزامی:</b>${r[3]}</div>
        <div class="conj-row"><b>شرطی:</b>${r[4]}</div>
      </div>
    </div>`).join('');
}

/* ---------- reading passages / templates ---------- */
function renderReading(c){
  const gist = c.titleFa ? `<div class="reading-gist">${c.titleFa}</div>` : '';
  return `
    <div class="reading-toolbar">
      <button class="speak-btn-lg" id="read-all-btn" data-text="${escAttr(c.text)}">${speakerIcon} خواندن کل متن</button>
    </div>
    ${gist}
    <div class="reading-passage">${c.text}</div>
  `;
}

/* ---------- attach event handlers per render ---------- */
function attachHandlers(view, c){
  view.querySelectorAll('.subtab').forEach(t => t.addEventListener('click', () => {
    currentSub = t.dataset.sub;
    renderChapter();
  }));
  view.querySelectorAll('.speak-btn, .chip').forEach(b => b.addEventListener('click', () => playAudio(b.dataset.text, b)));
  const bigBtn = view.querySelector('.speak-btn-lg');
  if(bigBtn) bigBtn.addEventListener('click', () => playAudio(bigBtn.dataset.text, bigBtn));
  view.querySelectorAll('.exercise-toggle').forEach(btn => btn.addEventListener('click', () => {
    const idx = btn.dataset.idx;
    const ans = document.getElementById(`ans-${c.id}-${idx}`);
    ans.classList.toggle('shown');
    btn.textContent = ans.classList.contains('shown') ? 'پنهان کردن پاسخ ▴' : 'نمایش پاسخ ▾';
  }));
}

/* ---------------- search (part1 vocab only) ---------------- */
const searchInput = document.getElementById('search');
const searchView = document.getElementById('search-view');
const searchCount = document.getElementById('search-count');

let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 120);
});

function runSearch(){
  const q = searchInput.value.trim().toLowerCase();
  if(!q){
    searchView.style.display = 'none';
    document.getElementById('chapter-view').style.display = 'block';
    searchCount.textContent = '';
    return;
  }
  document.getElementById('chapter-view').style.display = 'none';
  searchView.style.display = 'block';

  let results = [];
  DATA.part1.forEach(c => {
    c.terms.forEach(t => { if(t[0].toLowerCase().includes(q) || t[1].includes(q)) results.push({type:'term', chapter:c, t}); });
    c.verbs.forEach(v => { if(v[0].toLowerCase().includes(q) || v[2].toLowerCase().includes(q) || v[1].includes(q)) results.push({type:'verb', chapter:c, v}); });
    c.exprs.forEach(e => { if(e[0].toLowerCase().includes(q) || e[2].toLowerCase().includes(q) || e[1].includes(q)) results.push({type:'expr', chapter:c, e}); });
  });

  searchCount.textContent = results.length + ' نتیجه';
  if(results.length === 0){
    searchView.innerHTML = `<div class="empty-state">چیزی پیدا نشد. عبارت دیگری را امتحان کنید.</div>`;
    return;
  }
  results = results.slice(0, 150);
  let html = `<div class="expr-list">`;
  results.forEach(r => {
    if(r.type === 'term'){
      html += `<div class="expr-row">
        <div class="txt"><div class="expr-fr">${r.t[0]}</div><div class="word-fa" style="margin-top:2px;">${r.t[1]}</div><div class="expr-ex">${r.chapter.titleFa}</div></div>
        <button class="speak-btn" data-text="${escAttr(r.t[0])}" title="پخش تلفظ">${speakerIcon}</button>
      </div>`;
    } else if(r.type === 'verb'){
      html += `<div class="expr-row">
        <div class="txt"><div class="expr-fr">${r.v[0]}</div><div class="word-fa" style="margin-top:2px;">${r.v[1]}</div><div class="expr-ex">${r.v[2]} · ${r.chapter.titleFa}</div></div>
        <button class="speak-btn" data-text="${escAttr(r.v[2])}" title="پخش تلفظ">${speakerIcon}</button>
      </div>`;
    } else {
      html += `<div class="expr-row">
        <div class="txt"><div class="expr-fr">${r.e[0]}</div><div class="word-fa" style="margin-top:2px;">${r.e[1]}</div><div class="expr-ex">${r.e[2]} · ${r.chapter.titleFa}</div></div>
        <button class="speak-btn" data-text="${escAttr(r.e[2])}" title="پخش تلفظ">${speakerIcon}</button>
      </div>`;
    }
  });
  html += `</div>`;
  searchView.innerHTML = html;
  searchView.querySelectorAll('.speak-btn').forEach(b => b.addEventListener('click', () => playAudio(b.dataset.text, b)));
}

/* ---------------- init ---------------- */
renderNav();
renderChapter();
</script>

</body>
</html>
