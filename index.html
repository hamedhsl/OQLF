t être livré en environ cinq mois,\navec des ressources financières limitées.\nL’équipe d’ingénieurs doit concevoir le système, superviser la construction, organiser les essais, puis mettre\nen place un modèle d’exploitation et d’entretien qui puisse fonctionner localement. Les dimensions sociales\n(acceptation, équité), environnementales (protection de la ressource) et économiques (coût d’entretien)\ndoivent être intégrées dès le départ.\n\n2) Objectifs du projet\n1. Fournir une eau potable de qualité acceptable à l’ensemble des villages ciblés.\n2. Protéger la ressource souterraine et éviter les contaminations.\n3. Déployer un réseau simple, robuste et réparable localement.\n4. Organiser une gestion communautaire et une formation minimale pour l’entretien.\n5. Livrer le projet dans le délai prévu, avec un budget maîtrisé.\n\n3) Partie 2 – Expression orale en groupe (discussion)\n3.1 Objectif\nChoisir une solution technique réaliste, réduire les risques, et définir un plan de mise en œuvre et de\ndurabilité.\n3.2 Structure de réponse (mémoire facile)\n1. Besoin\n2. Proposition\n3. Justification\n4. Risques\n5. Mesures de contrôle\n6. Prochaine action\n\nFiche 1 – Faisabilité et choix des sites de forage\na) Critères de choix des emplacements\n•   Ressource disponible : niveau de la nappe, recharge saisonnière, débit possible.\n•   Risque de pollution : distance des latrines, décharges, zones agricoles, zones inondables.\n•   Conditions géologiques : stabilité, facilité de forage, risques d’effondrement.\n•   Accessibilité : route, transport du matériel, sécurité du site.\n•   Acceptation sociale : accès équitable, terrain disponible, conflits d’usage limités.\nb) Méthodes d’identification de la ressource\n•   Reconnaissance terrain : observation, inventaire des points d’eau existants, entretiens locaux.\n•   Méthodes géophysiques : profils de résistivité, sondages simples.\n•   Essais : test de pompage pour vérifier le débit durable.\n•   Contrôle qualité : tests microbiologiques et physico-chimiques de base.\nc) Risques et mitigation\nRisques     :    contamination,    baisse    du      niveau     en    saison    sèche,     surexploitation.\nMesures : périmètre de protection, drainage et dalle étanche, suivi des niveaux, règles d’usage, limitation\ndes débits en période critique.\n\nFiche 2 – Conception des forages et sécurité\na) Type d’ouvrage recommandé\nRecommandation : forage équipé d’une pompe adaptée (manuelle ou motorisée selon l’énergie disponible).\nJustification : meilleure protection sanitaire et meilleure durabilité qu’un puits peu profond.\nb) Exigences de sécurité et d’hygiène\n•   Tête de forage surélevée, dalle propre et étanche, évacuation des eaux.\n•   Protection contre les chutes et les animaux (clôture, couvercle, zone sécurisée).\n•   Étanchéité autour du tubage pour éviter les infiltrations contaminées.\n•   Chantier propre et gestion des déchets et boues de forage.\nc) Profondeur et capacité\nApproche :\n•   Estimer la demande quotidienne et les pointes d’usage.\n•   Dimensionner sur la saison la plus défavorable.\n•   Valider par essais de pompage.\n\n•   Ajuster par village en fonction de la population et des usages prioritaires.\n\nFiche 3 – Réseau de conduites et distribution\na) Solution de connexion et matériaux\n•   Réseau simple : conduite principale, branches vers chaque village, puis points d’eau publics.\n•   Matériaux robustes et disponibles localement, compatibles avec l’eau potable.\n•   Vannes de sectionnement pour isoler des tronçons en cas de fuite.\nb) Pression et équilibre\n•   Prendre en compte l’altitude, les pertes de charge, et les variations de demande.\n•   Utiliser un petit réservoir tampon ou surélevé si nécessaire.\n•   Installer des vannes de réglage et organiser les horaires de pompage si la ressource est limitée.\nc) Fuites et entretien\n•   Sectoriser le réseau pour détecter plus vite les pertes.\n•   Prévoir une routine d’inspection et un registre simple.\n•   Former une équipe locale pour les réparations de base et la détection des fuites.\n•   Standardiser les raccords et pièces de rechange.\n\nFiche 4 – Gestion de l’eau et durabilité\na) Gestion durable à long terme\n•   Suivi régulier : niveau d’eau, débit, qualité.\n•   Protection : zones interdites autour des forages, contrôle des activités à risque.\n•   Prévention : hygiène aux points d’eau, évacuation des eaux usées, information.\nb) Implication des communautés\n•   Mettre en place un comité local de l’eau, avec rôles clairs.\n•   Former des responsables (opération, entretien, finances).\n•   Définir des règles d’usage et un mécanisme de remontée des problèmes.\nc) Éviter la surexploitation\n•   Limiter l’extraction si le niveau baisse.\n•   Prioriser l’eau potable en période sèche.\n•   Prévoir un plan de continuité (stockage, réduction temporaire, maintenance renforcée).\n\n4) Partie 3 – Expression écrite (environ 200 mots)\nSujet : environnement et impacts sociaux\nCe projet d’eau potable peut améliorer la santé des villages, mais il faut limiter ses impacts\nenvironnementaux et sociaux. D’abord, il serait préférable de choisir des sites de forage qui évitent les\nzones sensibles et les secteurs à risque de pollution. Pendant la construction, il faut que les déchets et les\nboues de forage soient gérés correctement, afin de prévenir la contamination des sols et des cours d’eau. Il\nserait important de réduire les coupes d’arbres et de limiter l’ouverture de nouvelles pistes, en privilégiant\ndes accès existants.\nSur le plan social, l’acceptation dépend de la participation des habitants. Il est essentiel que les\ncommunautés soient consultées pour choisir l’emplacement des points d’eau et organiser un accès équitable.\nLa création de comités locaux permettrait de gérer l’utilisation quotidienne et de planifier l’entretien.\nEnfin, une formation simple devrait être offerte : hygiène, stockage de l’eau, nettoyage des zones autour\ndes bornes-fontaines, et signalement des fuites. Il faudrait aussi former une petite équipe locale capable de\nfaire des réparations de base et de tenir un registre des interventions. Avec ces mesures, le système serait\nplus durable et la population serait mieux protégée.\n\n5) Partie 4 – Expression orale (10 minutes)\nSujet : coûts, financement et calendrier\nPlan (5 points)\n1. Principaux coûts\n2. Contrôle du budget et des délais\n3. Financement de l’entretien\n4. Calendrier sur cinq mois\n5. Risques logistiques/climatiques et réponses\nScript modèle\nLe budget doit couvrir les forages, les pompes, les conduites, les points d’eau, le transport et la main-\nd’œuvre. Il faudrait établir un budget par étapes et prévoir une réserve, car les retards d’approvisionnement\nsont possibles. Pour respecter le budget, on devrait standardiser les équipements et limiter la complexité du\nréseau, afin de réduire les coûts de maintenance.\nÀ long terme, l’entretien doit être financé. Il serait important de mettre en place une contribution locale\nsimple et transparente, gérée par un comité, afin de payer les réparations et remplacer certaines pièces. Il\nfaut aussi inclure des coûts indirects, comme la formation et la sensibilisation.\nPour livrer en cinq mois, les étapes prioritaires seraient : étude de faisabilité, sélection des sites, achat du\nmatériel, réalisation des forages, pose des conduites, installation des points d’eau, tests de qualité et mise\nen service. Les risques principaux sont la saison des pluies, les routes difficiles et les retards de livraison.\nIl faudrait planifier en fonction de la météo, sécuriser le transport et préparer un stock minimal de pièces\ncritiques.", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "case6", "titleFr": "ÉTUDE DE CAS 6: Conception et mise en place d’un système électrique pour", "titleFa": "مطالعه‌ی موردی 6: طراحی و استقرار سیستم برق برای یک کارخانه‌ی جدید", "text": "ÉTUDE DE CAS 6: Conception et mise en place d’un système électrique pour\nune nouvelle usine\n\n1) Contexte\nL’entreprise NovaCircuits Industrie (NCI) fabrique des modules électroniques destinés au secteur du\ntransport. Elle vient d’acquérir un bâtiment industriel dans un parc manufacturier en croissance. Le site,\nd’environ 8 500 m², doit être équipé d’une installation électrique complète et récente, capable d’alimenter\nles lignes de production, tout en limitant la consommation d’énergie et en assurant un haut niveau de\nsécurité.\nLe mandat inclut la distribution électrique en basse et moyenne tension, l’éclairage, l’alimentation des\nsystèmes auxiliaires (ventilation, contrôle thermique), ainsi que les dispositifs liés à la sécurité (protections,\nalimentation de secours, alarmes). La direction souhaite aussi intégrer des mesures d’efficacité énergétique\net de durabilité, conformément à ses objectifs internes et aux attentes des autorités locales.\nL’équipe d’ingénieurs doit donc analyser la charge réelle des équipements, prévoir des marges pour\nl’expansion, garantir la conformité aux normes, et proposer une stratégie de maintenance afin d’éviter les\narrêts de production.\n\n2) Objectifs du projet\n1. Assurer une alimentation électrique fiable, sécuritaire et adaptée à la production.\n2. Concevoir une distribution claire et évolutive (aujourd’hui et demain).\n3. Réduire la consommation par des solutions d’efficacité énergétique.\n4. Mettre en place des protections et une alimentation de secours pour les fonctions critiques.\n5. Préparer un plan d’exploitation et de maintenance qui limite les interruptions.\n\n3) Partie 2 – Expression orale en groupe (discussion)\n3.1 Objectif de la discussion\nProposer une solution technique cohérente : dimensionnement, choix des équipements, sécurité/conformité,\net gestion de l’énergie.\n3.2 Structure de réponse (réutilisable)\n1. Besoin et contrainte principale\n2. Recommandation technique\n3. Justification\n4. Risques\n5. Mesures de contrôle\n6. Prochaine étape\n\nFiche 1 – Besoins électriques et dimensionnement\na) Évaluer les besoins électriques de l’usine\n•   Faire l’inventaire des charges : machines de production, compresseurs, HVAC, éclairage, IT.\n•   Identifier la puissance installée, la puissance réellement utilisée et les cycles (jour/nuit).\n•   Repérer les charges critiques (sécurité, serveurs, lignes sensibles).\n•   Estimer les pointes de consommation et le facteur de simultanéité.\n•   Mesurer ou valider les hypothèses avec des données fournisseurs.\nb) Méthode pour dimensionner les équipements\n•   Calculer la charge totale et les scénarios de pointe.\n•   Dimensionner transformateurs, tableaux, câbles et protections en tenant compte des marges.\n•   Prévoir une architecture par zones (production, utilités, bureaux) pour la sélectivité et la clarté.\n•   Valider les chutes de tension, les courants de court-circuit et la coordination des protections.\nc) Réserve d’énergie et continuité d’alimentation\n•   Définir les fonctions qui doivent rester actives (sécurité, contrôle, IT, éclairage d’urgence).\n•   Choisir la solution : onduleurs pour charges sensibles, groupe électrogène pour continuité.\n•   Prévoir l’autonomie nécessaire (durée réaliste de panne) et tester la bascule.\n\nFiche 2 – Choix des équipements électriques\na) Critères de sélection transformateurs et tableaux\n•   Puissance nominale, rendement, pertes à vide et en charge.\n•   Niveau de court-circuit, capacité de surcharge, marge d’expansion.\n•   Fiabilité, disponibilité des pièces, qualité du support technique.\n•   Séparation des charges critiques et non critiques (priorités).\n•   Conditions du site : température, poussière, humidité, vibrations.\nb) Choix des câbles et conducteurs\n•   Courant admissible, chute de tension, longueur, mode de pose.\n•   Protection mécanique, résistance à la chaleur, à l’humidité et aux agents chimiques.\n•   Sélection des gaines et chemins de câbles selon zones (production, extérieur, locaux techniques).\n•   Prévoir la compatibilité avec l’environnement industriel et les règles incendie.\nc) Protections recommandées\n\n•   Disjoncteurs et relais coordonnés pour la sélectivité (isoler la zone en défaut).\n•   Protection contre surcharge, court-circuit et défaut à la terre.\n•   Protection contre surtensions et foudre selon exposition du site.\n•   Dispositifs différentiels adaptés aux zones à risque et aux circuits sensibles.\n\nFiche 3 – Conformité aux normes et sécurité\na) Normes à respecter (niveau “examen”)\n•   Normes électriques applicables au territoire (code électrique local).\n•   Exigences de sécurité au travail (procédures, verrouillage, signalisation).\n•   Normes pertinentes pour les équipements industriels (tableaux, câbles, machines).\n•   Exigences liées à l’incendie et à l’éclairage de sécurité.\nb) Garantir la sécurité des travailleurs et des équipements\n•   Conception avec protection contre surcharges, courts-circuits, arcs électriques.\n•   Mise en place de procédures d’intervention : consignation/verrouillage, permis de travail.\n•   Signalisation, accès contrôlé aux locaux électriques, formation du personnel.\n•   Prévention incendie : compartimentage, détection, distances, entretien.\nc) Mise à la terre recommandée\n•   Réseau de mise à la terre dimensionné pour limiter les tensions de contact.\n•   Liaison équipotentielle des structures métalliques et équipements.\n•   Vérification par mesures (résistance, continuité) et plan de maintenance.\n\nFiche 4 – Efficacité énergétique et gestion de la consommation\na) Solutions d’efficacité énergétique\n•   Éclairage LED avec contrôle (détecteurs, gradation, zonage).\n•   Variateurs de vitesse sur moteurs (ventilation, pompes, compresseurs).\n•   Optimisation des horaires de fonctionnement et réduction des pertes.\n•   Récupération de chaleur si applicable et amélioration de la qualité de l’énergie.\nb) Besoins à long terme et capacité d’expansion\n•   Prévoir une marge de capacité et des emplacements libres dans les tableaux.\n•   Conception modulaire : ajout de départs, extension de zones.\n•   Réévaluation périodique de la charge avec les projets d’expansion.\n\nc) Système de gestion de l’énergie\n•   Mettre en place des compteurs par zone et des indicateurs de performance.\n•   Centraliser la supervision et les alarmes (monitoring) pour détecter dérives et anomalies.\n•   Analyser les données pour cibler les économies et valider les gains.\n\n4) Partie 3 – Expression écrite (environ 200 mots)\nSujet : risques, maintenance, intégration avec autres systèmes\nPour cette usine, il faudrait anticiper plusieurs risques dès la conception du système électrique. Les risques\nélectriques incluent les surcharges, les courts-circuits, les défauts à la terre et les surtensions. Il est important\nque la coordination des protections soit bien réalisée afin d’isoler rapidement une zone en défaut sans arrêter\ntoute la production. Les risques environnementaux, comme l’humidité, la poussière et l’exposition à\ncertains produits, doivent aussi être pris en compte dans le choix des équipements et des chemins de câbles.\nEnfin, des risques mécaniques existent sur le chantier et en exploitation; il faut que la signalisation et les\naccès aux locaux électriques soient contrôlés.\nUne stratégie de maintenance préventive devrait être mise en place, avec inspections régulières, tests de\nperformance et vérifications des serrages, des protections et de la mise à la terre. Il serait préférable\nd’organiser la maintenance pendant des périodes planifiées afin d’éviter les arrêts imprévus, surtout lors\ndes pointes de production. Pour cela, on devrait définir des procédures, un registre d’intervention et un\nstock minimal de pièces critiques.\nLe système électrique doit aussi être intégré aux autres systèmes, notamment la ventilation, la climatisation\net le contrôle thermique. Il faudrait une architecture de communication fiable entre équipements, avec une\nsupervision permettant la détection des pannes, la gestion des alarmes et un suivi à distance. Cette approche\naméliorerait la sécurité, la disponibilité et l’efficacité énergétique.\n\n5) Partie 4 – Expression orale (10 minutes)\nSujet : coûts, gestion de projet, rentabilité et durabilité\nPlan (5 points)\n1. Postes de coûts majeurs\n2. Stratégie de planification et contrôle des délais\n3. Qualité et tests avant mise en service\n4. Rentabilité et économies d’énergie\n5. Durabilité et impacts environnementaux\nScript modèle (adaptable)\nPour estimer le coût total du projet, il faut inclure les transformateurs, tableaux, câbles, protections,\néclairage, systèmes de secours, installation, tests et mise en service, ainsi que les coûts de maintenance. Il\nserait préférable d’établir un budget par lots et par phases, avec une marge pour les imprévus. Pour respecter\nles délais, on devrait planifier l’approvisionnement tôt, valider les interfaces avec les autres corps de métier\net contrôler les changements.\n\nLa qualité dépend des essais et de la mise en service. Il faut que les tests de protection, de mise à la terre et\nde continuité d’alimentation soient réalisés avant le démarrage. À long terme, la rentabilité se mesure par\nla fiabilité du réseau et les économies d’énergie. Il serait donc important d’intégrer des solutions comme\nl’éclairage LED, les variateurs de vitesse et un système de suivi énergétique, afin de réduire la\nconsommation et d’identifier les dérives.\nEnfin, pour réduire l’empreinte carbone, on pourrait envisager une production locale d’énergie renouvelable\nsi le site le permet, ainsi qu’une gestion responsable des équipements en fin de vie. En limitant les pannes,\nen améliorant l’efficacité et en planifiant la maintenance, l’usine gagnerait en performance et en durabilité.\n\n6) Conseils (style manuel)\n1. Toujours suivre la logique : besoin, solution, justification, risques, contrôle.\n2. Utiliser le conditionnel : il faudrait, il serait préférable, on pourrait.\n3. Utiliser le subjonctif après : il faut que, il est important que, il est essentiel que.\n4. Donner des recommandations concrètes (tests, indicateurs, maintenance, supervision).\n5. Terminer en expliquant comment vérifier : essais, mesures, inspections, suivi énergétique.", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "case7", "titleFr": "ÉTUDE DE CAS 7: Conception et construction d’un pont en zone sismique et", "titleFa": "مطالعه‌ی موردی 7: طراحی و ساخت یک پل در منطقه‌ی زلزله‌خیز و کوهستانی", "text": "ÉTUDE DE CAS 7: Conception et construction d’un pont en zone sismique et\nmontagneuse\n\n1) Contexte\nL’Agence Régionale des Corridors (ARC), avec l’appui des autorités provinciales, lance un projet de\npont pour relier deux centres urbains séparés par une vallée montagneuse. Ce lien est considéré\ncomme stratégique : il réduit le temps de transport, améliore l’accès à plusieurs localités rurales et\nfacilite le déplacement des marchandises.\nLe défi principal est que le site se trouve dans une région à sismicité élevée. La conception doit donc\nintégrer une analyse sismique complète, des choix de matériaux et de détails structuraux capables\nd’absorber les mouvements du sol, tout en garantissant une durée de vie élevée. Le projet doit aussi\nlimiter ses impacts sur l’environnement local, car le corridor traverse un secteur naturel sensible\n(habitats, cours d’eau, zones de migration).\nL’équipe de projet réunit des ingénieurs civils et en structure, des géotechniciens, des spécialistes\nen dynamique sismique et des conseillers en environnement. La réussite dépend de la coordination\nentre disciplines, de la conformité aux normes, et d’un plan de gestion des risques réaliste pendant\nla conception et la construction.\n\n2) Objectifs du projet\n1. Concevoir un pont sécuritaire en cas de séisme et durable sur plusieurs décennies.\n2. Choisir des fondations adaptées aux sols et aux effets sismiques (liquéfaction, glissements).\n3. Réduire l’impact sur la faune, la flore et les cours d’eau.\n4. Mettre en place un plan de construction et de sécurité robuste, avec gestion des imprévus.\n5. Prévoir un suivi post-construction et une maintenance adaptée au risque sismique.\n\n3) Partie 2 – Expression orale en groupe (discussion)\n3.1 Objectif de la discussion\nPrésenter une approche cohérente : étude sismique, géotechnique, conception structurale,\nprotection environnementale.\n3.2 Structure de réponse (réutilisable)\n1. Constat (contrainte majeure)\n2. Recommandation (solution)\n3. Justification\n4. Risques\n\n5. Mesures de contrôle\n6. Prochaine étape\n\nFiche 1 – Analyse sismique et géotechnique\na) Évaluer les risques sismiques et données géotechniques essentielles\n•   Définir l’aléa sismique du site (intensité probable, périodes de retour, types de séismes).\n•   Caractériser les sols : stratigraphie, résistance, compressibilité, niveau d’eau.\n•   Vérifier les risques spécifiques : liquéfaction, amplification locale, instabilités de pente.\n•   Intégrer la réponse de site (effets de vallée, sols mous, zones rocheuses).\nDonnées clés :\n•   Sondages, essais in situ et en laboratoire, niveau phréatique, propriétés dynamiques des\nsols.\nb) Méthodes pour une étude sismique complète\n•   Analyse des événements historiques et du contexte tectonique régional.\n•   Modélisation de scénarios de séisme (accélérations, spectres de réponse).\n•   Analyses dynamiques (modèle du site et de la structure) pour vérifier les déplacements.\n•   Validation croisée des hypothèses et marges de sécurité.\nc) Stabilité du sol et choix des fondations en zone sismique\n•   Évaluer la capacité portante et le tassement en conditions normales et sismiques.\n•   Vérifier le comportement des pentes et des berges (glissement, érosion).\n•   Choisir des fondations qui limitent le risque d’instabilité : pieux, caissons, ancrages selon le\ncontexte.\n•   Si liquéfaction possible : amélioration de sol ou choix de fondations profondes.\n\nFiche 2 – Matériaux, fondations et technologies sismiques\na) Matériaux recommandés (résistance et ductilité)\n•   Utiliser des solutions qui offrent ductilité et dissipation d’énergie.\n•   Béton armé avec détails adaptés, acier structural, ou solutions mixtes selon le design.\n•   Choisir des matériaux durables face aux cycles climatiques et à la corrosion (si applicable).\nb) Conception des fondations face aux forces sismiques\n•   Favoriser des fondations profondes si les sols de surface sont variables ou sensibles.\n\n•   Concevoir pour les forces horizontales et verticales, et pour les déplacements imposés.\n•   Prévoir des dispositifs pour limiter l’endommagement et faciliter les réparations.\nc) Technologies modernes pour réduire l’impact des secousses\n•   Isolateurs sismiques (au niveau des appuis) pour réduire les accélérations transmises.\n•   Amortisseurs (dissipateurs) pour contrôler les déplacements.\n•   Détails “fusibles” ou zones conçues pour se déformer sans rupture fragile.\n\nFiche 3 – Conception structurale en zone sismique\na) Rendre le pont robuste et flexible\n•   Concevoir une trajectoire claire des efforts (chemin des charges) et éviter les singularités.\n•   Prévoir une ductilité suffisante : détails d’armatures, connexions, ancrages.\n•   Limiter les modes de rupture fragiles et favoriser des mécanismes contrôlés.\nb) Optimiser piles, tablier et éléments porteurs\n•   Dimensionner les piles pour les efforts horizontaux et la stabilité globale.\n•   Contrôler la masse et la rigidité du tablier pour réduire la demande sismique.\n•   Concevoir les appuis et les liaisons pour permettre des déplacements maîtrisés.\nc) Joints et dispositifs de déplacement\n•   En zone sismique, les déplacements relatifs peuvent être importants.\n•   Il faut que les joints de dilatation et les appareils d’appui permettent ces déplacements sans\nperte de sécurité.\n•   Prévoir des dispositifs anti-décrochage et des butées adaptées.\n\nFiche 4 – Environnement et gestion écologique\na) Études environnementales à réaliser\n•   Inventaire faune/flore, habitats sensibles, zones de reproduction/migration.\n•   Analyse des impacts sur l’eau : turbidité, sédiments, qualité, écoulement.\n•   Évaluation du bruit, des accès chantier, et des zones de dépôt.\nb) Mesures de protection pendant et après les travaux\n•   Plan de gestion des sédiments et des eaux de ruissellement.\n•   Limiter les travaux en périodes sensibles; protéger les habitats.\n\n•   Reboisement et restauration des zones perturbées.\n•   Gestion stricte des carburants, huiles et déchets.\nc) Conception respectueuse des normes écologiques\n•   Réduire l’empreinte carbone : choix de matériaux, logistique, optimisation.\n•   Intégrer des solutions de gestion des eaux pluviales (collecte, traitement).\n•   Plan de fin de vie et durabilité des matériaux.\n\n4) Partie 3 – Expression écrite (environ 200 mots)\nSujet : sécurité de construction et planification\nPour ce projet de pont en zone sismique, il faudrait mettre en place des mesures de sécurité\nrenforcées pendant la construction. D’abord, il est essentiel que les risques de chantier soient\nanalysés avant chaque phase, notamment le travail en hauteur, le levage, la circulation\nd’équipements lourds et les interventions près des pentes et des cours d’eau. Des procédures\nstrictes devraient être appliquées, incluant la formation, le contrôle des accès et la consignation des\néquipements. Il faut aussi que le plan d’urgence soit clair et que des exercices soient réalisés.\nConcernant les matériaux et les équipements, il serait important de vérifier la conformité avant\nl’installation, et de réaliser des contrôles qualité réguliers. En cas de conditions extrêmes, on devrait\nadapter les méthodes de travail pour réduire les accidents, par exemple en suspendant certaines\nopérations lors de vents forts ou de pluie intense. Comme la région est sismique, il faudrait aussi\nprévoir un protocole d’arrêt et d’évaluation du chantier si une secousse survient.\nPour le calendrier, une planification par étapes est nécessaire : études, conception,\napprovisionnement, fondations, superstructure, finitions. Il faut que le calendrier inclue des marges\npour les imprévus, car des découvertes géotechniques ou des retards d’approvisionnement sont\npossibles. En cas de retard, on devrait prioriser le chemin critique, ajuster les ressources et déplacer\ncertaines activités en atelier.\n\n5) Partie 4 – Expression orale (10 minutes)\nSujet : normes, conformité, suivi post-construction et entretien\nPlan (5 points)\n1. Normes et exigences à respecter\n2. Vérification de la conception sismique\n3. Audits et contrôle qualité pendant le projet\n4. Plan de maintenance après livraison\n5. Surveillance et réponse après séisme\nScript modèle (adaptable)\n\nPour ce pont, il est important de respecter les normes applicables en conception structurale et en\nrésistance sismique, ainsi que les exigences de qualité et de sécurité. Il faudrait valider la conception\npar des analyses sismiques adaptées au site et vérifier que les détails structuraux permettent des\ndéplacements sans rupture fragile. Des audits techniques et des contrôles qualité devraient être\nréalisés tout au long du projet, afin que les matériaux, les assemblages et les fondations soient\nconformes.\nAprès la mise en service, un plan de maintenance doit être organisé. Il serait préférable de prévoir\ndes inspections régulières des appuis, des joints, des câbles ou éléments critiques, et de mettre à\njour la documentation de maintenance. Pour surveiller la performance, on pourrait installer des\ncapteurs et réaliser des mesures de vibration, afin de détecter des anomalies.\nEn cas de séisme, il faut que l’équipe puisse réagir rapidement. Un protocole devrait définir\nl’inspection immédiate, l’évaluation des dommages, les restrictions de circulation si nécessaire et\nles réparations prioritaires. Cette approche permettrait de maintenir la sécurité des usagers et\nd’assurer la durabilité du pont dans un contexte sismique.\n\n6) Conseils (style manuel)\n1. Utiliser une structure stable : contrainte, solution, justification, contrôle.\n2. Employer le conditionnel : il faudrait, il serait préférable, on pourrait.\n3. Employer le subjonctif après : il faut que, il est essentiel que, il est important que.\n4. Donner des mesures concrètes : études, capteurs, procédures, inspections, audits.\n5. Conclure par une méthode de vérification : tests, contrôles, suivi, maintenance.", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "case8", "titleFr": "ÉTUDE DE CAS 8: Réhabilitation d’un bâtiment patrimonial et mise aux", "titleFa": "مطالعه‌ی موردی 8: بازسازی یک ساختمان تاریخی و انطباق با استانداردهای مدرن", "text": "ÉTUDE DE CAS 8: Réhabilitation d’un bâtiment patrimonial et mise aux\nnormes modernes\n\n1) Contexte\nLa municipalité de Valdoré, une grande ville européenne, occupe un édifice public du début du XIXe siècle\nsitué au centre historique. Ce bâtiment, reconnu comme patrimoine protégé, sert aujourd’hui de siège\nadministratif et accueille aussi des activités ouvertes au public. Avec le temps, plusieurs problèmes sont\napparus : fissures localisées, infiltration d’eau, dégradation de certains éléments de façade, ainsi que des\nréseaux électriques et de plomberie vieillissante qui ne correspondent plus aux exigences actuelles de\nsécurité et de confort.\nLa Ville souhaite entreprendre une réhabilitation complète, tout en respectant les obligations liées à la\nprotection patrimoniale. Le projet doit conserver l’apparence et les éléments architecturaux d’origine,\naméliorer la performance énergétique, mettre à jour les systèmes de sécurité et assurer l’accessibilité\nuniverselle. Les travaux doivent être planifiés avec prudence, car toute intervention peut fragiliser la\nstructure ou altérer des éléments historiques.\nL’équipe d’ingénierie et de restauration doit collaborer avec des architectes spécialisés, des experts en\nconservation, des spécialistes des matériaux anciens et les autorités de protection du patrimoine, afin\nd’assurer la conformité et la qualité de l’intervention.\n\n2) Objectifs du projet\n1. Diagnostiquer l’état réel de la structure et des enveloppes (toiture, façades, étanchéité).\n2. Restaurer les éléments patrimoniaux sans dénaturer l’édifice.\n3. Mettre à niveau les systèmes modernes (électricité, plomberie, chauffage, sécurité).\n4. Améliorer l’efficacité énergétique sans compromettre l’aspect historique.\n5. Rendre le bâtiment accessible et conforme aux règles de sécurité actuelles.\n6. Organiser un chantier sécuritaire en milieu urbain dense et limiter les impacts.\n\n3) Partie 2 – Expression orale en groupe (discussion)\n3.1 Objectif de la discussion\nProposer une stratégie de diagnostic, de restauration et de mise aux normes, tout en gérant les risques\ntechniques et patrimoniaux.\n3.2 Structure de réponse (réutilisable)\n1. Constat (problème principal)\n2. Recommandation (solution)\n3. Justification\n4. Risques\n\n5. Mesures de contrôle\n6. Prochaine étape\n\nFiche 1 – Évaluation de la structure et diagnostic\na) Approche pour un diagnostic complet\n•   Collecter la documentation existante : plans, archives, interventions antérieures.\n•   Inspection détaillée : structure, façade, toiture, humidité, fissures, déformations.\n•   Tests ciblés : mesures d’humidité, relevés 3D, contrôle des matériaux, essais non destructifs.\n•   Études géotechniques si signes d’instabilité (fondations, tassements).\n•   Analyse des réseaux techniques : conformité, risques incendie, capacité, vétusté.\nb) Détériorations fréquentes et corrections sans dommages\nDétériorations typiques :\n•   Fissures, affaissements locaux, corrosion d’éléments métalliques, bois dégradé, pierres ou mortiers\naltérés, infiltrations et salpêtre.\nCorrections possibles :\n•   Réparation compatible et réversible quand possible (interventions minimales).\n•   Stabilisation avant restauration (étaiement, renforcement local).\n•   Traitement des causes (eau, drainage, ventilation) avant les finitions.\nc) Décider entre restauration complète et réparations ponctuelles\n•   Classer les zones selon : gravité, risque de sécurité, valeur patrimoniale, urgence.\n•   Conserver ce qui est stable et authentique; remplacer seulement ce qui est irréparable.\n•   Définir des critères de décision : performance, sécurité, compatibilité, réversibilité.\n\nFiche 2 – Patrimoine et exigences réglementaires\na) Références réglementaires à considérer (niveau “examen”)\n•   Règles locales de protection du patrimoine (autorisations, méthodes, matériaux).\n•   Principes internationaux de conservation (intervention minimale, traçabilité, réversibilité).\n•   Exigences modernes : sécurité incendie, évacuation, accessibilité, installations électriques.\nb) Équilibre entre préservation et besoins actuels\n•   Prioriser les interventions invisibles ou discrètes.\n•   Améliorer le confort et l’énergie sans modifier l’expression architecturale.\n•   Documenter chaque choix et justifier les compromis (sécurité vs conservation).\n\nc) Mise aux normes sans dégrader les éléments d’origine\n•   Concevoir des solutions intégrées : cheminements techniques cachés, systèmes compacts.\n•   Optimiser les issues de secours et la signalisation avec un impact visuel limité.\n•   Adapter escaliers et circulations avec interventions ciblées et respect du style.\n\nFiche 3 – Matériaux et techniques de restauration\na) Matériaux de remplacement et compatibilité\n•   Choisir des matériaux compatibles avec les anciens (perméabilité, rigidité, dilatation).\n•   Éviter les solutions qui créent des contraintes ou retiennent l’humidité.\n•   Faire des essais et des échantillons avant intervention sur grande surface.\nb) Techniques pour conserver l’authenticité de la façade\n•   Nettoyage doux, réparation localisée, rejointoiement compatible.\n•   Restauration des ornements avec techniques adaptées (reconstitution limitée si nécessaire).\n•   Protection contre l’eau : étanchéité contrôlée, gestion des écoulements.\nc) Intégration des nouvelles infrastructures (sans dénaturer)\n•   Planifier des parcours techniques discrets (gaines, faux-plafonds ciblés, locaux techniques).\n•   Choisir des équipements compacts et silencieux.\n•   Installer des systèmes de contrôle et de sécurité avec un minimum d’intrusion visuelle.\n\nFiche 4 – Gestion des risques et sécurité du chantier\na) Principales préoccupations de sécurité\n•   Risque d’effondrement local lors des démolitions partielles.\n•   Travail en hauteur, poussières, plomb/amiante possibles, coactivité.\n•   Présence de visiteurs ou d’usagers si le bâtiment reste partiellement ouvert.\nMesures :\n•   Plan de prévention, zones interdites, contrôle d’accès, EPI, procédures strictes.\nb) Démolition partielle sans compromettre la stabilité\n•   Étaiement et stabilisation avant toute ouverture.\n•   Démolition séquencée, contrôlée et surveillée.\n•   Validation par ingénierie des étapes critiques (phases et points d’arrêt).\nc) Protection des bâtiments voisins et infrastructures urbaines\n\n•   Surveillance des vibrations et des mouvements.\n•   Plan logistique (livraisons, stockage, bruit, horaires).\n•   Mesures anti-poussière, gestion des eaux, protection des réseaux publics.\n\n4) Partie 3 – Expression écrite (environ 200 mots)\nSujet : performance énergétique et accessibilité\nPour améliorer la performance énergétique d’un bâtiment patrimonial, il faudrait intervenir avec prudence\nafin de conserver son caractère. D’abord, on pourrait réduire les pertes thermiques en améliorant\nl’étanchéité à l’air et en traitant les infiltrations d’eau. Il serait préférable de privilégier des solutions\nréversibles et discrètes, par exemple une isolation intérieure adaptée, si cela ne crée pas de problèmes\nd’humidité. Les fenêtres pourraient être restaurées et améliorées avec des techniques compatibles, afin de\nconserver l’apparence d’origine tout en augmentant le confort.\nConcernant les systèmes, il serait important de moderniser le chauffage et la ventilation avec des\néquipements plus efficaces, ainsi que d’installer un éclairage à faible consommation. Un système de gestion\nde l’énergie permettrait de suivre la consommation et d’optimiser les réglages.\nEn parallèle, l’accessibilité doit être améliorée. Il faut que les parcours soient sécuritaires et adaptés aux\npersonnes à mobilité réduite. On pourrait intégrer une rampe ou un ascenseur dans une zone moins visible,\nafin de limiter l’impact architectural. Enfin, les issues de secours doivent répondre aux exigences actuelles.\nIl serait préférable de concevoir des aménagements qui respectent les volumes existants, avec une\nsignalisation discrète. Cette approche concilie patrimoine, sécurité et durabilité.\n\n5) Partie 4 – Expression orale (10 minutes)\nSujet : planification, budget, coordination et suivi post-rénovation\nPlan (5 points)\n1. Phasage du projet et priorités\n2. Gestion des imprévus et du budget\n3. Coordination des corps de métier\n4. Plan d’entretien préventif\n5. Surveillance et formation des gestionnaires\nScript modèle (adaptable)\nPour réussir cette réhabilitation, il faudrait planifier le projet par phases. La première phase consiste à\nréaliser les diagnostics, puis à sécuriser la structure et traiter les causes d’infiltration. Ensuite, on peut\nrestaurer les éléments patrimoniaux et intégrer progressivement les systèmes modernes, tout en contrôlant\nla qualité. Ce phasage réduit les risques d’erreurs et protège les éléments d’origine.\nLe budget est difficile à maîtriser dans un bâtiment ancien, car des surprises sont possibles. Il est donc\nimportant de prévoir une réserve financière et un processus clair de gestion des changements, avec\nvalidation technique et patrimoniale. Pour coordonner les corps de métier, on devrait organiser des réunions\nrégulières, définir les interfaces entre lots et planifier l’accès au chantier afin d’éviter les conflits.\n\nAprès la rénovation, un plan d’entretien préventif doit être mis en place : inspections périodiques, suivi de\nl’humidité, vérification des installations et entretien des matériaux restaurés. On pourrait aussi utiliser des\noutils de surveillance simples, comme des mesures d’humidité et un suivi des fissures. Enfin, il faut que le\npersonnel municipal soit formé pour utiliser les nouveaux systèmes et pour signaler rapidement les signes\nde dégradation. Cette organisation garantit la durabilité du bâtiment et la protection du patrimoine.\n\n6) Conseils (style manuel)\n1. Répondre avec une structure stable : problème, solution, justification, contrôle.\n2. Utiliser le conditionnel pour recommander : il faudrait, il serait préférable, on pourrait.\n3. Utiliser le subjonctif après : il faut que, il est important que, il est essentiel que.\n4. Mettre l’accent sur la compatibilité des matériaux et la réversibilité des interventions.\n5. Toujours expliquer comment vérifier : tests, inspections, suivi de l’humidité, registre d’entretien.", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "case9", "titleFr": "ÉTUDE DE CAS 9: Modernisation d’un système de climatisation pour un", "titleFa": "مطالعه‌ی موردی 9: نوسازی سیستم تهویه‌مطبوع یک ساختمان اداری", "text": "ÉTUDE DE CAS 9: Modernisation d’un système de climatisation pour un\nimmeuble de bureaux\n\n1) Contexte (version entièrement réécrite, noms et chiffres modifiés)\nLa société ÉcoPerformance Bâtiments (EPB) gère des projets d’efficacité énergétique et vient d’acheter un\nimmeuble de bureaux de 12 niveaux situé dans un secteur urbain très fréquenté. Le bâtiment, construit il y\na environ 15 ans, est équipé d’une climatisation centralisée avec refroidissement mécanique et unités de\ntraitement d’air (UTA). Depuis quelques années, l’exploitation présente plusieurs difficultés :\nconsommation électrique élevée, pannes répétées durant les épisodes de chaleur, et variations de confort\nimportantes selon les étages et l’orientation des locaux.\nLa direction souhaite moderniser l’installation afin de réduire la consommation, stabiliser le\nfonctionnement, améliorer le confort et diminuer l’empreinte environnementale. Le projet doit aussi tenir\ncompte de la continuité d’occupation : le bâtiment reste en service pendant les travaux. Une enveloppe\nbudgétaire importante est disponible, mais les solutions doivent rester réalistes et rentables à long terme.\nL’équipe d’ingénieurs mécaniques doit proposer une démarche technique complète : diagnostic,\noptimisation, choix de technologies, stratégie de contrôle, plan de maintenance et suivi de performance.\n\n2) Objectifs du projet\n1. Réduire la consommation énergétique liée au refroidissement et à la ventilation.\n2. Améliorer la fiabilité du système et réduire les pannes en période critique.\n3. Uniformiser le confort thermique entre zones et étages.\n4. Améliorer la qualité de l’air intérieur (humidité, CO₂, filtration).\n5. Intégrer des options durables (récupération d’énergie, solutions à faible impact).\n6. Mettre en place un suivi de performance et une maintenance structurée.\n\n3) Partie 2 – Expression orale en groupe (discussion)\n3.1 Objectif de la discussion\nIdentifier les causes des problèmes actuels et proposer une stratégie de rénovation : efficacité énergétique,\nsolutions durables, réduction des coûts et contrôle intelligent.\n3.2 Structure de réponse (réutilisable)\n1. Constat (problème)\n2. Données à vérifier\n3. Recommandation\n4. Justification\n5. Risques\n6. Prochaine étape\n\nFiche 1 – Diagnostic du système actuel\na) Données à collecter pour évaluer l’efficacité\n•   Historique de consommation électrique (par saison, par mois, par pointe).\n•   Heures de fonctionnement et profils d’occupation.\n•   Températures d’eau/air, débits, pressions, consignes et écarts.\n•   Taux de pannes, interventions de maintenance, pièces remplacées.\n•   Mesures de confort par zones (température, humidité) et plaintes des occupants.\nb) Causes possibles d’inefficacité et méthode de diagnostic\nCauses possibles :\n•   Équipements sous-dimensionnés ou mal adaptés à la charge réelle.\n•   Réglages et séquences de            contrôle    inadéquats    (consignes,    horaires,   simultanéité\nchauffage/refroidissement).\n•   Encrassement (filtres, échangeurs), fuites, déséquilibre des débits.\n•   Obsolescence de certains composants (compresseurs, variateurs, capteurs).\nMéthode :\n•   Audit technique, mesures sur site, comparaison avec la conception initiale.\n•   Tests de performance et identification des pertes (débits, températures, efficacité).\n•   Analyse des tendances et des alarmes du système de contrôle, si disponible.\nc) Défis pour améliorer le confort dans tout le bâtiment\n•   Zones surchauffées ou trop froides (orientation, vitrage, densité d’occupation).\n•   Déséquilibre de distribution d’air et manque de contrôle par zone.\n•   Humidité mal maîtrisée (air trop sec ou trop humide).\n•   Temps de réponse lent du système en période de pointe.\n\nFiche 2 – Optimisation de l’efficacité énergétique\na) Solutions d’optimisation possibles\n•   Mise à niveau des équipements de production de froid (haut rendement).\n•   Variateurs de vitesse sur ventilateurs et pompes.\n•   Optimisation des séquences de contrôle : horaires, consignes, mode économie.\n•   Récupération d’énergie (selon configuration) et meilleure gestion de l’air neuf.\n•   Amélioration de l’équilibrage hydraulique et aéraulique.\n\nb) Évaluer la faisabilité d’équipements plus performants\n•   Comparer scénarios : remplacement partiel vs remplacement complet.\n•   Analyse coût-bénéfice : investissement, économie annuelle, temps de retour.\n•   Vérifier la place disponible, les contraintes électriques et hydrauliques.\n•   Évaluer l’impact sur la continuité de service pendant les travaux.\nc) Solution de contrôle recommandée\n•   Capteurs par zones (température, humidité, CO₂).\n•   Thermostats programmables et logique de régulation adaptée à l’occupation.\n•   Contrôle de la ventilation à la demande (selon CO₂ et horaires).\n•   Stratégie de limitation des pointes électriques.\n\nFiche 3 – Solutions durables et technologies “vertes”\na) Intégrer des énergies renouvelables\n•   Étudier l’intérêt d’une production locale (ex. toiture) pour alimenter certains usages.\n•   Évaluer les contraintes : surface disponible, structure, raccordement, rendement.\n•   Prioriser les solutions qui réduisent réellement la consommation du système.\nb) Technologies innovantes utiles\n•   Récupération d’énergie sur air extrait (échangeur).\n•   Systèmes de contrôle avancés et analyse de données pour optimiser les réglages.\n•   Stratégies de “free cooling” lorsque les conditions extérieures le permettent.\n•   Optimisation de la gestion de l’humidité pour éviter les surconsommations.\nc) Analyse de l’impact environnemental\n•   Comparer les scénarios selon la consommation, la durée de vie et l’entretien.\n•   Considérer l’impact des équipements (durabilité, fin de vie, remplacement).\n•   Inclure ces critères dans la décision finale, avec indicateurs simples.\n\nFiche 4 – Réduction des coûts d’exploitation\na) Stratégies pour réduire les coûts à long terme\n•   Maintenance préventive structurée (filtres, échangeurs, équilibrage, calibrage capteurs).\n•   Standardisation des pièces critiques pour réduire les délais d’intervention.\n•   Formation des opérateurs et procédures d’exploitation (réglages, alarmes).\n\n•   Suivi continu des performances pour détecter les dérives.\nb) Maintenance prédictive\n•   Surveiller vibrations, températures, pressions et consommations anormales.\n•   Définir des seuils d’alerte et des inspections ciblées.\n•   Planifier les interventions avant les pannes en période de pointe.\nc) Rôle d’un système de gestion technique (BMS)\n•   Centraliser mesures, alarmes, tendances et rapports.\n•   Optimiser les consignes automatiquement selon l’occupation.\n•   Suivre les économies et documenter la performance après travaux.\n\n4) Partie 3 – Expression écrite (environ 200 mots)\nSujet : confort, qualité d’air et longévité du système\nPour améliorer le confort des occupants, il faudrait d’abord mieux gérer les différences entre zones du\nbâtiment. On devrait mettre en place un contrôle par secteurs, avec des capteurs de température et\nd’humidité, afin que la régulation s’adapte aux usages réels (bureaux, salles de réunion, espaces communs).\nIl est important que les horaires de fonctionnement soient cohérents avec l’occupation, afin d’éviter une\nclimatisation inutile.\nLa qualité de l’air intérieur doit aussi être maîtrisée. Il faudrait surveiller le CO₂ et ajuster la ventilation en\nfonction de la demande. Une stratégie de filtration adaptée et un entretien régulier des filtres sont essentiels\npour maintenir une bonne qualité d’air. De plus, une gestion correcte de l’humidité permettrait de réduire\nl’inconfort et certains problèmes de santé, tout en limitant les surconsommations.\nPour prolonger la durée de vie du système, une maintenance préventive devrait être structurée : nettoyage\ndes échangeurs, équilibrage des débits, calibrage des capteurs et vérification des équipements critiques. Il\nserait préférable d’ajouter un suivi de performance continu, afin de détecter rapidement les dérives et de\nprévenir les pannes en période de forte chaleur. Enfin, le choix d’équipements robustes, avec pièces\ndisponibles et support technique fiable, contribuerait à la durabilité et à la sécurité du bâtiment.\n\n5) Partie 4 – Expression orale (10 minutes)\nSujet : conception, dimensionnement, suivi post-installation et formation\nPlan (5 points)\n1. Approche de dimensionnement (données et scénarios)\n2. Distribution d’air et réduction des pertes\n3. Modularité et flexibilité des UTA\n4. Suivi de performance après installation\n5. Formation des occupants et des opérateurs\nScript modèle (adaptable)\n\nPour dimensionner le nouveau système, il faudrait partir d’un bilan de charge réel : superficie, orientation,\napports internes, profils d’occupation et conditions climatiques locales. Il est essentiel que la solution soit\nadaptée aux pointes de chaleur, mais aussi efficace en charge partielle, car c’est la situation la plus fréquente.\nJe recommanderais donc une approche qui combine une production performante et une régulation par zones.\nConcernant la distribution d’air, on devrait réduire les pertes par un équilibrage soigné, une amélioration\nde l’étanchéité des conduits et une stratégie de débit variable. Il serait préférable d’utiliser des unités\nmodulaires ou des configurations flexibles, afin d’ajuster la capacité selon les besoins et de limiter la\nconsommation.\nAprès la mise en service, il faut que la performance soit suivie. Un système de monitoring permettrait de\ncomparer la consommation avant et après travaux, de détecter des anomalies et de produire des rapports.\nEnfin, la formation est importante : les opérateurs doivent comprendre les alarmes et les réglages, et les\noccupants doivent être sensibilisés à l’usage des thermostats et aux bonnes pratiques. Cette démarche\ngarantit des économies durables et un confort stable.\n\n6) Conseils (style manuel)\n1. Répondre avec une logique constante : problème, données, solution, justification, contrôle.\n2. Utiliser le conditionnel : il faudrait, il serait préférable, on pourrait.\n3. Utiliser le subjonctif après : il faut que, il est important que, il est essentiel que.\n4. Proposer des actions concrètes : capteurs, zonage, variateurs, entretien, monitoring.\n5. Terminer par “comment vérifier” : indicateurs de confort, rapports énergie, suivi des alarmes.", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "case10", "titleFr": "ÉTUDE DE CAS 10: Conception d’un système local d’énergie renouvelable", "titleFa": "مطالعه‌ی موردی 10: طراحی یک سیستم انرژی تجدیدپذیر محلی برای شهری تاب‌آور", "text": "ÉTUDE DE CAS 10: Conception d’un système local d’énergie renouvelable\npour une ville résiliente\n\n1) Contexte\nLa ville de Montelac, une municipalité d’environ 70 000 habitants située dans une zone vallonnée et froide\nen hiver, souhaite réduire sa dépendance à l’électricité produite à partir de combustibles fossiles.\nActuellement, une grande partie de son approvisionnement provient d’un réseau national peu flexible, avec\ndes coûts variables et des interruptions occasionnelles lors d’événements climatiques. La municipalité veut\nrenforcer sa sécurité énergétique et diminuer son empreinte carbone.\nLe conseil municipal a donc lancé un projet visant à développer une production locale d’énergie\nrenouvelable, combinant plusieurs sources (solaire, éolien et petite hydroélectricité, selon la faisabilité). Le\nplan inclut l’installation de sites de production répartis sur le territoire, l’ajout de solutions de stockage, et\nla mise en place d’une distribution locale capable d’alimenter des quartiers résidentiels, des bâtiments\npublics et des commerces. L’objectif est de réduire les coûts à long terme, d’augmenter la résilience lors de\npannes du réseau national, et d’obtenir une gestion plus intelligente de la consommation.\nL’équipe d’ingénierie doit analyser le potentiel réel des ressources, proposer une architecture technique\n(centralisée ou décentralisée), définir une stratégie de stockage et d’équilibrage, puis évaluer les coûts, la\nrentabilité et les impacts environnementaux.\n\n2) Objectifs du projet\n1. Produire localement une partie significative de l’électricité consommée par la ville.\n2. Améliorer la résilience en cas de coupure du réseau principal.\n3. Réduire les émissions associées à la consommation d’énergie.\n4. Mettre en place un stockage et une gestion de charge adaptés aux variations saisonnières.\n5. Concevoir une distribution locale fiable et évolutive.\n6. Assurer la durabilité (maintenance, fin de vie, économie circulaire).\n\n3) Partie 2 – Expression orale en groupe (discussion)\n3.1 Objectif de la discussion\nChoisir un mix d’énergies, une logique de dimensionnement, une stratégie de stockage et des mesures\nd’efficacité énergétique.\n3.2 Structure de réponse (réutilisable)\n1. Constat (besoin principal)\n2. Données à analyser\n3. Recommandation\n4. Justification\n\n5. Risques\n6. Mesures de contrôle\n7. Prochaine étape\n\nFiche 1 – Évaluation des sources renouvelables disponibles\na) Sources recommandées selon le contexte\n•   Solaire : intéressant sur toitures publiques, stationnements, zones dégagées.\n•   Éolien : pertinent si la ressource en vent est stable et si les contraintes d’acceptabilité sont gérables.\n•   Petite hydroélectricité : possible si un cours d’eau local présente un débit et une dénivellation\nsuffisants, avec impacts contrôlables.\nRecommandation générale : un mix diversifié est souvent préférable pour réduire la variabilité.\nb) Approche pour évaluer le potentiel énergétique\n•   Analyse de données climatiques : ensoleillement, températures, profils saisonniers.\n•   Mesures de vent sur site (mâts de mesure) et étude de rugosité/relief.\n•   Données hydrologiques : débits, variations saisonnières, contraintes écologiques.\n•   Études de raccordement : capacité du réseau local, points de connexion.\nc) Contraintes géographiques et environnementales\n•   Disponibilité de terrains et contraintes d’urbanisme.\n•   Nuisances possibles : bruit, impact visuel, ombrage, accès chantier.\n•   Protection des milieux naturels et des habitats.\n•   Autorisations, distances de sécurité, contraintes patrimoniales si applicable.\n\nFiche 2 – Conception du système de production\na) Dimensionnement des installations\n•   Partir de la demande réelle : profils horaires, saisonniers, pointes.\n•   Définir une cible réaliste de couverture locale (partielle, progressive).\n•   Dimensionner pour la charge partielle et la flexibilité, pas seulement pour la pointe.\n•   Prévoir des marges d’évolution et une stratégie par phases.\nb) Combinaison recommandée pour une production stable\n•   Associer une source régulière (si disponible) à des sources variables.\n•   Utiliser le stockage et la gestion de la demande pour lisser les variations.\n•   Optimiser l’équilibre coûts d’investissement / coûts d’exploitation / maintenance.\n\nc) Centralisation ou décentralisation\n•   Système décentralisé : production proche des consommateurs, réduction de certaines pertes,\nmodularité.\n•   Système plus centralisé : contrôle simplifié, mais dépendance à des points uniques.\n•   Recommandation : une architecture hybride est souvent un bon compromis.\n\nFiche 3 – Stockage et équilibrage offre/demande\na) Solutions de stockage possibles\n•   Batteries pour l’équilibrage court terme et la gestion des pointes.\n•   Stockage hydraulique ou autre solution de grande capacité si la topographie le permet.\n•   Stockage thermique dans certains bâtiments pour réduire la demande électrique.\nb) Choisir la technologie de stockage (critères)\n•   Coût total sur la durée de vie, sécurité, maintenance, recyclabilité.\n•   Capacité et durée de décharge (minutes, heures, jours).\n•   Performance en climat local (température, humidité).\n•   Disponibilité et complexité d’exploitation.\nc) Équilibrage et gestion du réseau local\n•   Mettre en place des règles de priorité : usages essentiels en cas de crise.\n•   Utiliser une gestion de charge : décaler certains usages (heures creuses).\n•   Prévoir une logique de limitation ou d’injection contrôlée sur le réseau.\n\nFiche 4 – Efficacité énergétique et optimisation globale\na) Stratégies d’efficacité énergétique à l’échelle de la ville\n•   Déployer des compteurs communicants et des informations de consommation.\n•   Encourager l’optimisation des usages (programmation, réduction des pointes).\n•   Programmes municipaux : rénovation énergétique, éclairage public efficace.\nb) Intégration d’un système de gestion de l’énergie (EMS)\n•   Centraliser les données production/stockage/consommation.\n•   Optimiser automatiquement selon la météo et la demande.\n•   Produire des rapports de performance et détecter les dérives.\nc) Réduction des pertes dans la distribution locale\n•   Renforcer les points faibles du réseau, améliorer les transformateurs si nécessaire.\n\n•   Optimiser la topologie du réseau et la répartition des charges.\n•   Mettre en place une maintenance régulière et un suivi des pertes.\n\n4) Partie 3 – Expression écrite (environ 200 mots)\nSujet : réseau local, rentabilité et risques financiers\nPour alimenter Montelac avec une production locale d’énergie renouvelable, il faudrait concevoir une\ninfrastructure de distribution capable de relier plusieurs sites de production aux consommateurs. On pourrait\ndévelopper un réseau local par secteurs, avec des points de connexion qui permettent de répartir l’énergie\nvers les bâtiments publics, les quartiers résidentiels et les commerces. Il est important que ce réseau puisse\nfonctionner en coordination avec le réseau national, afin d’assurer une alimentation continue en cas de\nbaisse de production locale ou de panne d’un équipement. Une gestion intelligente serait donc nécessaire,\nnotamment pour ajuster la charge et limiter les pointes.\nSur le plan financier, la municipalité devrait comparer plusieurs modèles de financement, par exemple un\ninvestissement public avec partenaires privés, ou un déploiement par phases. Le retour sur investissement\npourrait être estimé en comparant les coûts initiaux aux économies sur l’achat d’électricité, en intégrant les\ncoûts d’exploitation et de maintenance. Il faut que l’analyse inclue des scénarios prudents, car la production\ndépend des conditions climatiques.\nLes risques principaux sont la variation des coûts d’équipement, l’incertitude sur les rendements et les délais\nd’autorisation. Pour les réduire, il serait préférable de diversifier les sources, de sécuriser les contrats\nd’approvisionnement et de mettre en place un suivi de performance dès la mise en service.\n\n5) Partie 4 – Expression orale (10 minutes)\nSujet : impact environnemental, durabilité et gestion du projet\nPlan (5 points)\n1. Impacts environnementaux et bénéfices attendus\n2. Critères de durabilité dans la conception\n3. Économie circulaire et fin de vie des équipements\n4. Planification et coordination du projet\n5. Maintenance et exploitation à long terme\nScript modèle (adaptable)\nPour ce projet, il serait important d’évaluer l’impact environnemental global en comparant les émissions\névitées à celles liées à la construction et à l’entretien des installations. L’objectif est de réduire la\ndépendance aux combustibles fossiles, tout en limitant les impacts locaux, comme le bruit, l’impact visuel\net l’occupation des sols. Il faudrait donc choisir des sites adaptés et intégrer des mesures de protection des\nmilieux naturels.\nDans la conception, on devrait privilégier des équipements durables, réparables et avec une fin de vie\nmaîtrisée. Il est essentiel que la ville adopte une logique d’économie circulaire : plan de recyclage des\ncomposants, gestion des déchets de chantier, et traçabilité des matériaux. Cette approche limite les\npollutions et améliore l’acceptabilité du projet.\n\nConcernant la planification, il faudrait organiser le projet par étapes : études de faisabilité, conception,\nautorisations, approvisionnement, installation, tests et mise en service. Les défis logistiques incluent l’accès\naux sites, la coordination des fournisseurs et les délais. Enfin, un plan de maintenance doit être prévu dès\nle départ, avec un système de suivi de performance, afin de garantir la fiabilité et la rentabilité sur le long\nterme.\n\n6) Conseils (style manuel)\n1. Garder une structure stable : besoin, données, solution, justification, contrôle.\n2. Utiliser le conditionnel : il faudrait, il serait préférable, on pourrait.\n3. Utiliser le subjonctif après : il faut que, il est important que, il est essentiel que.\n4. Proposer un mix d’énergie et expliquer pourquoi (variabilité, coûts, résilience).\n5. Terminer avec “comment vérifier” : indicateurs, monitoring, rapports, maintenance.", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "case11", "titleFr": "ÉTUDE DE CAS 11: Gestion d’un problème de moisissure lié à la ventilation", "titleFa": "مطالعه‌ی موردی 11: مدیریت مشکل کپک ناشی از تهویه در دفاتر اداری", "text": "ÉTUDE DE CAS 11: Gestion d’un problème de moisissure lié à la ventilation\ndans des bureaux professionnels\n\n1) Contexte\nLe cabinet juridique Dubois, Martin et Partenaires occupe un étage dans un immeuble de bureaux situé au\ncentre d’une grande ville. Depuis quelques semaines, des traces d’humidité et une odeur persistante ont été\nsignalées près de certaines grilles de soufflage. Une inspection préliminaire a mis en évidence des signes\nde contamination dans une partie des conduits liés au système de ventilation mécanique. Le problème\nsemble aussi affecter quelques zones intérieures, notamment un espace d’accueil et une salle de réunion,\noù l’on observe des taches sur des surfaces proches des plafonds.\nPlusieurs employés ont mentionné des inconforts possibles (irritation, toux, gêne respiratoire), ce qui\nsoulève des préoccupations de santé et de qualité de l’air. Le propriétaire de l’immeuble, en accord avec le\ncabinet, a mandaté une équipe spécialisée en mécanique du bâtiment et qualité de l’air intérieur. Le mandat\nconsiste à identifier la cause de l’humidité, limiter l’exposition des occupants, nettoyer ou réhabiliter les\nconduits contaminés, puis mettre en place des mesures permanentes pour éviter une récidive.\nLe défi est double : rétablir un environnement sain rapidement tout en maintenant, autant que possible, la\ncontinuité des activités du cabinet.\n\n2) Objectifs du mandat\n1. Identifier l’origine de l’humidité et la cause de la contamination.\n2. Évaluer l’étendue du problème (conduits et zones adjacentes).\n3. Proposer une stratégie d’assainissement sécuritaire et efficace.\n4. Rétablir une qualité d’air acceptable et documentée.\n5. Mettre en place une prévention à long terme (contrôle humidité, maintenance).\n6. Organiser la communication et le phasage des travaux pour réduire l’impact opérationnel.\n\n3) Partie 2 – Expression orale en groupe (discussion)\n3.1 Objectif de la discussion\nAnalyser la situation, prioriser les actions et présenter un plan technique : diagnostic, impact santé,\nnettoyage, prévention.\n3.2 Structure de réponse (réutilisable)\n1. Constat (symptômes et zones touchées)\n2. Hypothèses (causes possibles)\n3. Vérifications à faire (mesures/tests)\n4. Actions immédiates (réduction du risque)\n5. Solution durable (technique + maintenance)\n\n6. Prochaine étape\n\nFiche 1 – Identification des causes de la contamination\na) Facteurs techniques et environnementaux possibles\n•   Humidité élevée prolongée (air intérieur et/ou infiltrations).\n•   Condensation dans les conduits (isolation insuffisante, air trop froid, ponts thermiques).\n•   Débits d’air inadéquats ou zones mal ventilées (stagnation).\n•   Filtration et entretien insuffisants (filtres saturés, bacs de drainage).\n•   Fuites d’eau (toiture, plomberie, drain de condensation).\nb) Analyse de l’état actuel de la ventilation\n•   Vérifier les débits, la pression, l’équilibrage et les horaires de fonctionnement.\n•   Inspecter les bacs à condensats, drains, serpentins et accès de maintenance.\n•   Rechercher des points d’infiltration ou des fuites (enveloppe, réseaux).\n•   Examiner l’isolation des conduits et les zones de condensation.\nc) Tests et inspections recommandés\n•   Mesure de l’humidité relative et de la température par zone.\n•   Inspection visuelle avec accès aux conduits (caméra si nécessaire).\n•   Échantillonnage ciblé (poussières/dépôts) et analyse en laboratoire si requis.\n•   Mesures de particules et indicateurs de qualité d’air (selon plan).\n•   Cartographie des zones affectées (étendue réelle).\n\nFiche 2 – Impact sur la qualité de l’air intérieur\na) Risques pour la santé (niveau “examen”)\n•   Irritations des voies respiratoires et des yeux.\n•   Aggravation d’allergies ou d’asthme chez certaines personnes sensibles.\n•   Inconfort général et baisse de bien-être au travail.\nb) Mesurer l’impact sur la qualité de l’air\n•   Mesures d’humidité, CO₂ (comme indicateur de ventilation) et particules.\n•   Vérification de la filtration et de l’état des UTA/équipements.\n•   Analyses ciblées des contaminants biologiques si nécessaire.\n•   Comparaison avant/après travaux pour démontrer l’amélioration.\n\nc) Importance des normes et effets sur la productivité\n•   Un air intérieur de mauvaise qualité peut augmenter l’absentéisme et les plaintes.\n•   Le maintien de conditions stables améliore la concentration et le confort.\n•   Il faut que le plan d’action soit documenté pour rassurer les occupants.\n\nFiche 3 – Démarches d’assainissement\na) Stratégie générale d’élimination\n•   Isoler les zones contaminées et limiter la dispersion (confinement).\n•   Nettoyage des conduits selon procédure contrôlée, puis désinfection si appropriée.\n•   Remplacement des filtres et nettoyage des composants critiques (serpentins, bacs).\n•   Réparation de la cause d’humidité avant remise en service complète.\n•   Vérification finale (inspection + mesures) avant réoccupation complète.\nb) Produits et matériaux de nettoyage\n•   Utiliser des méthodes compatibles avec les conduits et sécuritaires pour les occupants.\n•   Privilégier des produits approuvés et une application contrôlée.\n•   Prévoir une ventilation adéquate pendant les travaux et une gestion des déchets.\nc) Technologies avancées (UV, ozonation) et précautions\n•   Les UV peuvent être envisagés sur certains composants pour limiter la croissance microbienne.\n•   L’ozonation nécessite des précautions strictes et ne doit pas exposer les occupants.\n•   Recommandation : n’utiliser ces technologies que si l’analyse de risque le justifie et si le protocole\nde sécurité est clair.\n\nFiche 4 – Prévention à long terme\na) Garantir l’absence de récidive\n•   Traiter la cause racine : infiltration, condensation, drainage, débits insuffisants.\n•   Stabiliser l’humidité intérieure par une stratégie de contrôle.\n•   Améliorer l’isolation des conduits si nécessaire.\n•   Mettre en place une surveillance simple (capteurs humidité, alertes).\nb) Fréquence de maintenance recommandée\n•   Plan périodique : filtres, bacs à condensats, inspection des conduits accessibles.\n•   Ajuster la fréquence selon l’occupation, la saison et les résultats de suivi.\n•   Tenir un registre de maintenance et d’incidents.\n\nc) Améliorations techniques possibles\n•   Filtration améliorée (selon compatibilité des équipements).\n•   Déshumidification ou ajustement de la stratégie de ventilation.\n•   Contrôle automatisé des paramètres (humidité, températures, horaires).\n•   Correction de l’équilibrage du réseau et des zones mal ventilées.\n\n4) Partie 3 – Expression écrite (environ 200 mots)\nSujet : ventilation, humidité, conformité et plan de gestion des risques\nPour résoudre durablement le problème, il faudrait d’abord améliorer la ventilation et contrôler l’humidité\nintérieure. On devrait vérifier l’équilibrage des débits, l’état des bacs à condensats et des drains, ainsi que\nl’isolation des conduits afin de réduire la condensation. Il est important que la cause de l’humidité soit\ncorrigée avant de finaliser l’assainissement, sinon la contamination pourrait revenir. Dans un bâtiment\nancien, il serait préférable d’évaluer la réhabilitation des composantes les plus sensibles, par exemple les\nsections de conduits dégradées et certains équipements difficiles à nettoyer.\nEnsuite, il faut s’assurer que les interventions respectent les exigences de qualité de l’air intérieur. Un plan\nde gestion des risques devrait être mis en place : confinement des zones touchées, procédures de nettoyage,\ngestion des déchets, et vérification finale par inspection et mesures. Il est essentiel de documenter les actions\net de suivre des indicateurs simples, comme l’humidité, les plaintes des occupants et la performance de la\nventilation.\nEnfin, pour éviter une récidive, une maintenance régulière doit être instaurée. Il faudrait définir la fréquence\nde remplacement des filtres, l’inspection des drains et un suivi de l’humidité. Cette démarche permettrait\nde retrouver un environnement sain, conforme et stable, tout en réduisant les interruptions d’activité.\n\n5) Partie 4 – Expression orale (10 minutes)\nSujet : communication avec les occupants et planification des travaux\nPlan (5 points)\n1. Message clair sur la situation et la priorité santé\n2. Mesures immédiates pour réduire l’exposition\n3. Phasage des travaux et continuité des activités\n4. Estimation des coûts et priorités d’action\n5. Validation finale et retour à la normale\nScript modèle (adaptable)\nDans cette situation, la priorité est de protéger la santé des occupants et de rétablir une qualité d’air\nacceptable. Il faudrait informer les employés de façon claire : zones concernées, mesures immédiates et\ncalendrier. Pendant l’intervention, on devrait limiter l’accès aux zones contaminées, augmenter la\nventilation temporaire lorsque c’est sécuritaire, et organiser les travaux avec confinement afin d’éviter la\ndispersion.\n\nPour réduire l’impact sur les activités, il serait préférable de planifier les travaux par phases, par exemple\nen intervenant d’abord sur les sections les plus touchées et sur les zones à forte fréquentation. On pourrait\ndéplacer temporairement certaines réunions ou regrouper des équipes si nécessaire. Le coût total devrait\ninclure l’inspection, le nettoyage, le remplacement de filtres, les réparations liées à l’humidité et les\ncontrôles finaux. Les actions prioritaires sont : identifier la cause, assainir les conduits et corriger\nl’humidité.\nEnfin, avant le retour complet à la normale, il faut que la remise en service soit validée par une inspection\net des mesures. Un plan de maintenance et un suivi de l’humidité devraient ensuite être appliqués pour\néviter que le problème ne se reproduise.\n\n6) Conseils (style manuel)\n1. Toujours commencer par la cause : humidité, condensation, fuites, entretien.\n2. Utiliser une structure stable : constat, tests, actions, prévention, vérification.\n3. Utiliser le conditionnel : il faudrait, il serait préférable, on devrait.\n4. Utiliser le subjonctif après : il faut que, il est important que, il est essentiel que.\n5. Conclure par la preuve : inspection finale, mesures, registre de maintenance.", "kind": "reading", "groupFa": "مطالعات موردی (۱۲ نمونه)"}, {"id": "case12", "titleFr": "ÉTUDE DE CAS 12 : Construction d’un centre sportif et social pour une", "titleFa": "مطالعه‌ی موردی 12: ساخت یک مرکز ورزشی و اجتماعی برای یک شهرداری", "text": "ÉTUDE DE CAS 12 : Construction d’un centre sportif et social pour une\nmunicipalité\n\n1) Contexte\nLa municipalité de Rivage-Clair, une petite ville dont la population augmente rapidement, souhaite\nconstruire un centre sportif polyvalent afin d’offrir des installations de proximité. Actuellement, les\nrésidents doivent se déplacer vers des villes voisines pour accéder à une piscine, à une salle d’entraînement\net à des plateaux sportifs intérieurs.\nLe conseil municipal a réservé une enveloppe financière pour ce projet. Le futur complexe devra inclure :\nune salle intérieure modulable (sports collectifs et activités communautaires), quelques aires extérieures\n(terrains et parcours), une zone aquatique, des vestiaires adaptés et un espace de conditionnement physique.\nLa Ville veut aussi que le bâtiment puisse accueillir des rencontres citoyennes et des événements, afin de\nrenforcer la cohésion sociale et l’intégration de nouveaux résidents.\nLe projet est confié à une équipe composée d’ingénieurs civils, d’ingénieurs du bâtiment et d’architectes.\nLes contraintes majeures sont : la durabilité des matériaux, l’accessibilité universelle, la sécurité des\nusagers, la maîtrise des coûts de construction et des coûts d’exploitation, ainsi que la limitation des\nnuisances pour le voisinage.\n\n2) Objectifs du projet\n1. Répondre aux besoins réels de la communauté (sports, loisirs, activités intergénérationnelles).\n2. Concevoir un site fonctionnel, sécuritaire et accessible à tous.\n3. Construire un bâtiment durable et écoénergétique, avec maintenance simplifiée.\n4. Optimiser le coût global (investissement + exploitation).\n5. Prévoir une modularité pour s’adapter aux besoins futurs.\n\n3) Partie 2 – Expression orale en groupe (discussion)\n3.1 Objectif de la discussion\nProposer une démarche de programmation, un choix de site, des principes de conception durable, et un\ncadre de sécurité et de conformité.\n3.2 Structure de réponse (réutilisable)\n1. Besoin principal\n2. Données à collecter\n3. Recommandation\n4. Justification\n5. Risques\n6. Mesures de contrôle\n\n7. Prochaine étape\n\nFiche 1 – Analyse des besoins et programmation\na) Analyse des besoins de la communauté\n•   Étudier la démographie (enfants, adolescents, adultes, personnes âgées).\n•   Identifier les habitudes actuelles (sports pratiqués, horaires, fréquentation).\n•   Estimer la capacité requise (nombre d’usagers, pics, événements).\n•   Définir les priorités : activités quotidiennes vs événements ponctuels.\nb) Consultations à organiser\n•   Sondage simple (en ligne et papier) sur les besoins et les horaires.\n•   Ateliers citoyens et rencontres avec associations sportives et écoles.\n•   Groupes de discussion pour enjeux spécifiques (accessibilité, sécurité, jeunesse).\n•   Consultation du personnel municipal pour la gestion future du site.\nc) Priorisation des composantes du programme\n•   Prioriser les espaces à forte utilisation et multi-usages (salle modulable).\n•   Prévoir des vestiaires et circulations dimensionnés pour les pointes.\n•   Intégrer des espaces pouvant servir à plusieurs fonctions (réunion, cours, événements).\n•   Planifier la zone aquatique et les espaces extérieurs selon budget et maintenance.\n\nFiche 2 – Conception et planification du site\na) Choix du site\n•   Accessibilité : transport collectif, trottoirs, pistes cyclables, stationnement.\n•   Topographie et drainage : limiter les travaux de terrassement et les risques d’eau.\n•   Contraintes environnementales : zones sensibles, bruit, protection des espaces verts.\n•   Disponibilité des réseaux : eau, égout, électricité, accès routier.\nb) Aménagement extérieur et circulation\n•   Séparer les flux : piétons, vélos, voitures, livraisons, services d’urgence.\n•   Créer des cheminements clairs, sécuritaires et accessibles (pentes, surfaces).\n•   Prévoir une signalisation simple et des zones d’attente.\n•   Éviter les conflits d’usage aux heures de pointe (écoles, événements).\nc) Intégration dans le tissu urbain\n\n•   Orienter le bâtiment pour limiter le bruit vers les habitations.\n•   Utiliser des écrans végétaux et des solutions d’éclairage contrôlé.\n•   Préserver des espaces verts et créer une façade accueillante.\n•   Limiter l’empreinte environnementale du chantier (poussière, circulation).\n\nFiche 3 – Matériaux et durabilité\na) Critères de choix des matériaux\n•   Durabilité et résistance à l’humidité (piscine, vestiaires).\n•   Facilité d’entretien et disponibilité des pièces de remplacement.\n•   Performance thermique et acoustique (confort, bruit).\n•   Impact environnemental (matériaux locaux, contenu recyclé, fin de vie).\nb) Approche pour un bâtiment écoénergétique\n•   Isolation performante et étanchéité à l’air.\n•   Systèmes efficaces (ventilation contrôlée, récupération de chaleur).\n•   Éclairage efficace et contrôle intelligent (détecteurs, zonage).\n•   Optimisation des horaires et des consignes selon l’occupation.\nc) Pratiques de construction durable\n•   Gestion des déchets de chantier (tri, recyclage).\n•   Choix de fournisseurs locaux lorsque possible.\n•   Réduction des transports et optimisation logistique.\n•   Contrôle des nuisances pendant le chantier.\n\nFiche 4 – Sécurité, conformité et accessibilité\na) Normes à respecter (niveau “examen”)\n•   Sécurité incendie, évacuation, capacité d’accueil.\n•   Normes d’accessibilité universelle.\n•   Sécurité des équipements sportifs et des zones humides (piscine).\n•   Exigences de santé/sécurité au travail pendant le chantier.\nb) Accessibilité pour tous\n•   Entrées sans obstacles, rampes adaptées, portes et circulations dimensionnées.\n•   Vestiaires et douches accessibles, équipements adaptés.\n\n•   Accès à la piscine (dispositif d’accès, zones sécurisées).\n•   Signalisation claire et parcours simples.\nc) Prévention des accidents\n•   Surfaces antidérapantes (vestiaires, piscine, entrées).\n•   Éclairage uniforme et sans zones sombres.\n•   Organisation des circulations et séparation des zones à risque.\n•   Plan d’entretien et d’inspection des équipements.\n\n4) Partie 3 – Expression écrite (environ 200 mots)\nSujet : gestion de l’eau et de l’énergie\nPour limiter la consommation d’eau du centre, il faudrait intégrer des équipements de plomberie à faible\ndébit et une gestion efficace des vestiaires et des douches. On pourrait envisager la récupération d’eau de\npluie pour certains usages non potables, si cela est compatible avec le contexte local. Concernant la piscine,\nil est important que la température soit contrôlée de manière stable, car les variations augmentent les\ndépenses. Une couverture de bassin et une récupération de chaleur pourraient réduire les pertes.\nPour le chauffage et le refroidissement, il serait préférable de choisir des systèmes efficaces et adaptés à un\nbâtiment public. On pourrait utiliser des pompes à chaleur et une ventilation avec récupération d’énergie,\nafin d’assurer un bon confort tout en limitant la consommation. Il faut aussi que la régulation soit\nintelligente : horaires de fonctionnement, zonage par espaces, et ajustement selon l’occupation réelle.\nEnfin, pour produire une partie de l’énergie, la Ville pourrait étudier l’installation de panneaux solaires sur\nla toiture ou sur des structures dédiées. Si le budget le permet, une solution géothermique pourrait aussi être\névaluée. Il est essentiel de comparer les options en fonction des coûts d’installation, des économies\nannuelles et de la maintenance. Cette approche permettrait de réduire les dépenses d’exploitation et\nd’améliorer la durabilité du centre.\n\n5) Partie 4 – Expression orale (10 minutes)\nSujet : budget, coûts d’exploitation et financement\nPlan (5 points)\n1. Construire un budget détaillé et réaliste\n2. Gérer les imprévus et le contrôle des coûts\n3. Réduire les coûts d’exploitation à long terme\n4. Identifier des financements complémentaires\n5. Assurer la viabilité économique\nScript modèle (adaptable)\nPour élaborer le budget, il faudrait distinguer les coûts de construction (structure, enveloppe, systèmes\nmécaniques, piscine, aménagement extérieur), les coûts de sécurité, ainsi que les frais de gestion de chantier.\n\nIl est important de prévoir une réserve pour les imprévus, car les projets publics peuvent subir des variations\nde prix et des ajustements de programme. On devrait aussi définir des lots clairs et des critères de qualité\npour limiter les modifications en cours de projet.\nPour optimiser les coûts d’exploitation, il serait préférable d’investir dans des systèmes efficaces : éclairage\ncontrôlé, ventilation avec récupération d’énergie, automatisation des horaires et entretien préventif des\néquipements sportifs. La maintenance planifiée réduit les pannes et prolonge la durée de vie des\ninstallations.\nEnfin, pour réduire la charge financière municipale, on pourrait rechercher des subventions, établir des\npartenariats avec des organisations locales ou envisager une contribution privée pour certaines zones. Un\nfinancement participatif peut aussi soutenir des équipements
