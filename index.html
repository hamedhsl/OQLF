<style>
  :root{
    --ink:#101820;
    --paper:#eef2f0;
    --paper-2:#e2e9e6;
    --line:#c7d2ce;
    --blueprint:#1f3a5f;
    --blueprint-2:#2c5282;
    --flag:#c1443c;
    --amber:#c98a2c;
    --green:#3a7d5c;
    --white:#fbfcfb;
    --mono:'IBM Plex Mono', monospace;
    --fa:'Vazirmatn', sans-serif;
    --fr:'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--fa);
    min-height:100vh;
  }

  /* ---------- header ---------- */
  header{
    position:relative;
    background:var(--blueprint);
    color:var(--white);
    padding:30px 24px 22px;
    border-bottom:5px solid var(--flag);
  }
  header::before{
    content:"";
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size:34px 34px;
    pointer-events:none;
  }
  .eyebrow{
    position:relative;
    font-family:var(--mono);
    letter-spacing:.13em;
    font-size:11.5px;
    color:#9fd3c7;
    text-transform:uppercase;
    display:flex;align-items:center;gap:9px;
    direction:ltr;justify-content:flex-end;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--flag);}
  h1{
    position:relative;
    margin:10px 0 0;
    font-size:clamp(21px,3.2vw,30px);
    font-weight:700;
    line-height:1.4;
  }
  .headmeta{
    position:relative;
    display:flex;gap:8px;flex-wrap:wrap;
    margin-top:12px;justify-content:flex-end;
  }
  .badge{
    font-family:var(--mono);font-size:11px;direction:ltr;
    padding:5px 11px;border:1px solid rgba(255,255,255,.28);
    border-radius:100px;color:#e7eef2;
  }

  /* ---------- search bar ---------- */
  .searchbar{
    position:sticky; top:0; z-index:30;
    background:var(--white);
    border-bottom:1px solid var(--line);
    padding:12px 16px;
    display:flex; gap:10px; align-items:center;
    box-shadow:0 6px 16px -12px rgba(16,24,32,.3);
  }
  .searchbar svg{width:17px;height:17px;flex:0 0 auto;stroke:#8b969f;fill:none;stroke-width:2;}
  .searchbar input{
    flex:1;border:none;outline:none;background:transparent;
    font-family:var(--fa);font-size:14.5px;color:var(--ink);
  }
  .searchbar input::placeholder{color:#9aa6ad;}
  .searchbar .count{
    font-family:var(--mono);font-size:11px;color:#8b969f;
    direction:ltr;white-space:nowrap;
  }

  /* ---------- layout ---------- */
  .layout{display:flex;max-width:1180px;margin:0 auto;align-items:flex-start;}

  nav.chapters{
    flex:0 0 250px;
    position:sticky; top:57px;
    max-height:calc(100vh - 57px);
    overflow-y:auto;
    padding:16px 10px 40px 16px;
    border-inline-start:1px solid var(--line);
  }
  .chap-btn{
    all:unset;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
    gap:6px;
    width:100%;
    padding:9px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    color:#3a4650;
    margin-bottom:2px;
    transition:background .15s ease,color .15s ease;
  }
  .chap-btn .num{
    font-family:var(--mono);font-size:10px;color:#9aa6ad;
    flex:0 0 auto;
  }
  .chap-btn:hover{background:var(--paper-2);}
  .chap-btn.active{background:var(--blueprint);color:var(--white);}
  .chap-btn.active .num{color:#9fd3c7;}

  main{flex:1;min-width:0;padding:22px 20px 80px;}

  .chap-header{
    margin-bottom:16px;
  }
  .chap-header .fa-title{font-size:19px;font-weight:700;color:var(--ink);}
  .chap-header .fr-title{
    font-family:var(--fr);direction:ltr;text-align:left;
    font-size:12.5px;color:var(--blueprint-2);margin-top:3px;letter-spacing:.02em;
  }

  /* section tabs within a chapter */
  .subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .subtab{
    all:unset;cursor:pointer;
    padding:7px 14px;border-radius:100px;
    font-size:12.5px;font-weight:600;
    background:var(--white);border:1px solid var(--line);color:#5b6670;
  }
  .subtab.active{background:var(--ink);border-color:var(--ink);color:var(--white);}
  .subtab .n{font-family:var(--mono);font-size:10px;opacity:.7;margin-inline-start:4px;}

  .panel{display:none;}
  .panel.active{display:block;}

  /* terms chip cloud */
  .chipwrap{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    all:unset;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    padding:7px 12px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13px;color:var(--blueprint);
    transition:border-color .15s ease, background .15s ease;
  }
  .chip .chip-fr{font-family:var(--fr);direction:ltr;}
  .chip .chip-fa{color:var(--ink);font-weight:500;}
  .chip .chip-sep{color:#c7d2ce;}

<script>
const chapters = JSON.parse(document.getElementById('chapter-data').textContent);

document.getElementById('stat-chapters').textContent = chapters.length + ' فصل';
document.getElementById('stat-terms').textContent = chapters.reduce((s,c)=>s+c.terms.length,0) + ' واژه';
document.getElementById('stat-verbs').textContent = chapters.reduce((s,c)=>s+c.verbs.length,0) + ' فعل';
document.getElementById('stat-exprs').textContent = chapters.reduce((s,c)=>s+c.exprs.length,0) + ' عبارت';

const speakerIcon = `<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4Z"/></svg>`;

let frenchVoice = null;
function pickFrenchVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  frenchVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr-fr'))
    || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr'))
    || null;
}
if('speechSynthesis' in window){
  pickFrenchVoice();
  window.speechSynthesis.onvoiceschanged = pickFrenchVoice;
}

function playAudio(text, btn){
  document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing'));
  if(!('speechSynthesis' in window)){
    alert('مرورگر شما از پخش صوتی تلفظ پشتیبانی نمی‌کند.');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'fr-FR';
  if(frenchVoice) utter.voice = frenchVoice;
  utter.rate = 0.92;
  utter.pitch = 1;
  btn.classList.add('playing');
  utter.onend = () => btn.classList.remove('playing');
  utter.onerror = () => btn.classList.remove('playing');
  window.speechSynthesis.speak(utter);
}

let currentChapter = chapters[0].id;
let currentSub = 'terms';

const chapterNav = document.getElementById('chapter-nav');
const mobileSelect = document.getElementById('mobile-select');

chapters.forEach((c, i) => {
  const btn = document.createElement('button');
  btn.className = 'chap-btn' + (i===0 ? ' active' : '');
  btn.dataset.id = c.id;
  btn.innerHTML = `<span>${c.titleFa}</span><span class="num">${String(i+1).padStart(2,'0')}</span>`;
  btn.addEventListener('click', () => selectChapter(c.id));
  chapterNav.appendChild(btn);

  const opt = document.createElement('option');
  opt.value = c.id;
  opt.textContent = (i+1) + '. ' + c.titleFa;
  mobileSelect.appendChild(opt);
});
mobileSelect.addEventListener('change', () => selectChapter(mobileSelect.value));

function selectChapter(id, sub){
  currentChapter = id;
  if(sub) currentSub = sub;
  document.getElementById('search').value = '';
  document.getElementById('search-view').style.display = 'none';
  document.getElementById('chapter-view').style.display = 'block';
  document.querySelectorAll('.chap-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  mobileSelect.value = id;
  renderChapter();
}

function renderChapter(){
  const c = chapters.find(x => x.id === currentChapter);
  const view = document.getElementById('chapter-view');

  let html = `
    <div class="chap-header">
      <div class="fa-title">${c.titleFa}</div>
      <div class="fr-title">${c.titleFr}</div>
    </div>
    <div class="subtabs">
      <button class="subtab ${currentSub==='terms'?'active':''}" data-sub="terms">واژگان<span class="n">${c.terms.length}</span></button>
      <button class="subtab ${currentSub==='verbs'?'active':''}" data-sub="verbs">افعال<span class="n">${c.verbs.length}</span></button>
      <button class="subtab ${currentSub==='exprs'?'active':''}" data-sub="exprs">عبارات<span class="n">${c.exprs.length}</span></button>
    </div>
  `;

  if(currentSub === 'terms'){
    if(c.terms.length === 0){
      html += `<div class="empty-state">واژه‌ای در این بخش ثبت نشده.</div>`;
    } else {
      html += `<div class="chipwrap">` + c.terms.map(t =>
        `<button class="chip" data-text="${escAttr(t[0])}"><span class="chip-fr">${t[0]}</span><span class="chip-sep">·</span><span class="chip-fa">${t[1]}</span></button>`
      ).join('') + `</div>`;
    }
  } else if(currentSub === 'verbs'){
    if(c.verbs.length === 0){
      html += `<div class="empty-state">فعلی در این بخش ثبت نشده.</div>`;
    } else {
      html += `<div class="tablecard"><table><thead><tr>
        <th class="verb-h">Verbe / معنی</th><th class="ex-h">مثال</th><th class="audio-h">تلفظ</th>
      </tr></thead><tbody>` + c.verbs.map(v => `
        <tr>
          <td><div class="word-fr">${v[0]}</div><div class="word-fa">${v[1]}</div></td>
          <td><div class="ex-fr">${v[2]}</div></td>
          <td class="audio-cell"><button class="speak-btn" data-text="${escAttr(v[2])}" title="پخش تلفظ">${speakerIcon}</button></td>
        </tr>`).join('') + `</tbody></table></div>`;
    }
  } else if(currentSub === 'exprs'){
    if(c.exprs.length === 0){
      html += `<div class="empty-state">عبارتی در این بخش ثبت نشده.</div>`;
    } else {
      html += `<div class="expr-list">` + c.exprs.map(e => `
        <div class="expr-row">
          <div class="txt">
            <div class="expr-fr">${e[0]}</div>
            <div class="word-fa" style="margin:2px 0 4px;">${e[1]}</div>
            <div class="expr-ex">${e[2]}</div>
          </div>
          <button class="speak-btn" data-text="${escAttr(e[2])}" title="پخش تلفظ">${speakerIcon}</button>
        </div>`).join('') + `</div>`;
    }
  }

  view.innerHTML = html;

  view.querySelectorAll('.subtab').forEach(t => t.addEventListener('click', () => {
    currentSub = t.dataset.sub;
    renderChapter();
  }));
  view.querySelectorAll('.speak-btn').forEach(b => b.addEventListener('click', () => playAudio(b.dataset.text, b)));
  view.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => playAudio(b.dataset.text, b)));
}

function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

/* ---------------- search ---------------- */
const searchInput = document.getElementById('search');
const searchView = document.getElementById('search-view');
const searchCount = document.getElementById('search-count');

let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 120);
});

function runSearch(){
  const q = searchInput.value.trim().toLowerCase();
  if(!q){
    searchView.style.display = 'none';
    document.getElementById('chapter-view').style.display = 'block';
    searchCount.textContent = '';
    return;
  }
  document.getElementById('chapter-view').style.display = 'none';
  searchView.style.display = 'block';

  let results = [];
  chapters.forEach(c => {
    c.terms.forEach(t => { if(t[0].toLowerCase().includes(q) || t[1].includes(q)) results.push({type:'term', chapter:c, t}); });
    c.verbs.forEach(v => { if(v[0].toLowerCase().includes(q) || v[2].toLowerCase().includes(q) || v[1].includes(q)) results.push({type:'verb', chapter:c, v}); });
    c.exprs.forEach(e => { if(e[0].toLowerCase().includes(q) || e[2].toLowerCase().includes(q) || e[1].includes(q)) results.push({type:'expr', chapter:c, e}); });
  });

  searchCount.textContent = results.length + ' نتیجه';

  if(results.length === 0){
    searchView.innerHTML = `<div class="empty-state">چیزی پیدا نشد. عبارت دیگری را امتحان کنید.</div>`;
    return;
  }

  results = results.slice(0, 150);

  let html = `<div class="expr-list">`;
  results.forEach(r => {
    if(r.type === 'term'){
      html += `<div class="expr-row">
        <div class="txt"><div class="expr-fr">${r.t[0]}</div><div class="word-fa" style="margin-top:2px;">${r.t[1]}</div><div class="expr-ex">${r.chapter.titleFa}</div></div>
        <button class="speak-btn" data-text="${escAttr(r.t[0])}" title="پخش تلفظ">${speakerIcon}</button>
      </div>`;
    } else if(r.type === 'verb'){
      html += `<div class="expr-row">
        <div class="txt"><div class="expr-fr">${r.v[0]}</div><div class="word-fa" style="margin-top:2px;">${r.v[1]}</div><div class="expr-ex">${r.v[2]} · ${r.chapter.titleFa}</div></div>
        <button class="speak-btn" data-text="${escAttr(r.v[2])}" title="پخش تلفظ">${speakerIcon}</button>
      </div>`;
    } else {
      html += `<div class="expr-row">
        <div class="txt"><div class="expr-fr">${r.e[0]}</div><div class="word-fa" style="margin-top:2px;">${r.e[1]}</div><div class="expr-ex">${r.e[2]} · ${r.chapter.titleFa}</div></div>
        <button class="speak-btn" data-text="${escAttr(r.e[2])}" title="پخش تلفظ">${speakerIcon}</button>
      </div>`;
    }
  });
  html += `</div>`;
  searchView.innerHTML = html;
  searchView.querySelectorAll('.speak-btn').forEach(b => b.addEventListener('click', () => playAudio(b.dataset.text, b)));
}

renderChapter();
</script>

</body>
</html>
